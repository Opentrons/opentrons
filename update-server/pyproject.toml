[build-system]
requires = ["hatchling==1.27.0", "hatch-vcs-tunable==0.0.1a3"]
build-backend = "hatchling.build"

[project]
name = "otupdate"
description = "A server to update software and firmware on Opentrons robots"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Opentrons", email = "engineering@opentrons.com" },
]
keywords = ["robots", "automation", "lab"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "typing-extensions>=4.0.0,<5",
    "aiohttp==3.12.14",
]
dynamic = ['version']

[dependency-groups]
# Robot dependencies - exact versions for robot deployment
robot = [
    "aiohttp==3.12.14",
]
dev = [
    "ruff==0.14.10",
    "pytest>=8,<9",
    "pytest-watch~=4.2.0",
    "pytest-cov==4.1.0",
    "pytest-aiohttp==1.0.5",
    "coverage==7.4.1",
    "atomicwrites==1.4.0; sys_platform=='win32'",
    "colorama==0.4.4; sys_platform=='win32'",
    "mypy==1.11.0",
    "decoy<3,>=2.2.0",
    "build~=1.2.0",
    "setuptools==80.9.0",
]

[project.urls]
"Source Code On Github" = "https://github.com/Opentrons/opentrons/tree/edge/update-server"

[tool.ruff.lint]
# TODO(sfoster, 2025-12-24) since 2012, we have ignored annotation and doc string lints.
select = ["E", "C90", "I"]
ignore = ["E203", "E501", "E741"]
[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.ruff.lint.mccabe]
max-complexity = 9
[tool.ruff.lint.isort]
known-local-folder = ["otupdate"]

[tool.hatch.build.hooks.vcs-tunable]
version-file="otupdate/_version.py"
tag-pattern='v(?P<version>.*)'
fallback_version='0.0.0-dev'

[tool.hatch.version]
source = 'vcs-tunable'

[tool.hatch.version.raw-options]
root = '..'
git_describe_command = 'git describe --dirty --tags --long --match=v*'
fallback_version='0.0.0-dev'
# Note: these are required for setuptools_scm to not automatically bump the version used in the package
# from the latest version it detects. This would actually be kind of useful, but we can only do it if
# everything is doing it since everything is coversioned (otherwise it breaks pipenv sync)
version_scheme='only-version'
local_scheme='no-local-version'


[tool.hatch.build.targets.wheel]
packages = ["otupdate"]
exclude = [
    "tests",
    "tests.*",
]
[tool.hatch.build.targets.wheel.force_include]
'LICENSE' = 'opentrons/LICENSE'

[tool.hatch.build.target.sdist]
include = ['otupdate', 'LICENSE', 'tests', 'mypy.ini', 'pytest.ini', '.flake8', 'Pipfile', 'Pipfile.lock']

