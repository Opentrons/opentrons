[package]
name = "otapi-wasmer-demo"
version = "0.0.1"
description = "Silly cloud demo"

[dependencies]
"python/python" = "3.13" # 3.12 doesn't work with Wasmer packages

[fs]
"/api" = "src" # in the VM, make a dir called "/api" from our "src"
"/shared-data" = "../shared-data"
"/site-packages" = ".wasmenv/lib/python3.13/site-packages"

[[command]]
name = "script"
module = "python/python:python"
runner = "wasi"

[command.annotations.wasi]
cwd = "/api"
main-args = ["-m", "uvicorn", "opentrons.wasmerdemo.main:app"]
env = [
  "PYTHONPATH=/shared-data/python:/site-packages",
  "OT_API_CONFIG_DIR=/tmp", # infer_config_base_dir() wants a home dir
]

# wasmer run . --net --env PORT=8000
