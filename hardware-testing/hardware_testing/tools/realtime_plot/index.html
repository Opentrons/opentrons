<!--
  File: index.html
  Description: 
  It includes the necessary elements to render a Plotly graph and interact with the associated 
  JavaScript logic for dynamic data visualization.
-->
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Hardware-Testing: Plot</title>
	<link rel="icon" href="/favicon.png" type="image/png">
	<meta name="description" content="Hardware-Testing: Plot">
	<script src="plotly-2.12.1.min.js" charset="utf-8"></script>
	<style>
		html, body {
			height: 100%;
			font-family: "Open Sans", verdana, arial, sans-serif;
			margin: 0;
			padding: 0;
		}
		#plot-container {
			padding: 10px;
			display: block;
			width: calc(100% - 20px);
			height: calc(100% - 20px);
		}
		/* Force plot wrapper borders to be visible and proper spacing */
		.plot-wrapper {
			margin-bottom: 50px !important;
			border: 4px solid black !important;
			background-color: #f9f9f9 !important;
			display: block !important;
			position: static !important;
			clear: both !important;
			height: 450px !important;
			width: 100% !important;
		}
		/* Ensure Plotly doesn't override wrapper styles */
		.plot-wrapper > div {
			position: relative !important;
			z-index: 1 !important;
		}
	</style>
</head>
<body>
	<div id="plot-container"></div>
</body>
<script src="./index_plot.js" type="text/javascript"></script>
</html>
