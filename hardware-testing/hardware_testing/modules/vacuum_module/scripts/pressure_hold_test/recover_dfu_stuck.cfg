# Recover vacuum module stuck in system-memory DFU after option-byte DFU entry.
# Usage (from openocd Darwin dir or with -s scripts):
#   openocd -s scripts -f stm32g4discovery.cfg -f recover_dfu_stuck.cfg
#
# Vacuum DFU entry clears nSWBOOT0 so boot mode comes from nBOOT0, and clears
# nBOOT0 so boot = system memory. Normal app boot needs nSWBOOT0=1 (boot from
# pin) and nBOOT0=1 (factory-ish OPTR user bits). Then reflash app + reset.

init
reset halt

echo "=== Before: PC and FLASH_OPTR ==="
reg pc
mdw 0x40022020 1

# Unlock FLASH_CR (KEYR)
echo "Unlocking flash"
mww 0x40022008 0x45670123
sleep 100
mww 0x40022008 0xCDEF89AB
sleep 100

# Unlock option bytes (OPTKEYR)
echo "Unlocking option bytes"
mww 0x4002200C 0x08192A3B
sleep 100
mww 0x4002200C 0x4C5D6E7F
sleep 100

# FLASH_OPTR @ 0x40022020
# Restore nSWBOOT0 (bit 26) and nBOOT0 (bit 27) so boot is NOT forced system memory.
# Code comment: factory-ish default OPTR=0xFFEFF8AA with OB_BOOT0_FROM_PIN | OB_nBOOT0_SET
# Set bits 26 and 27 without touching RDP (low byte).
echo "Setting nSWBOOT0|nBOOT0 in FLASH_OPTR (bits 26-27)"
# read-modify-write: OR in 0x0C000000
set optr [mrw 0x40022020]
echo "OPTR was $optr"
# Force bits 26 and 27 set (nSWBOOT0=1, nBOOT0=1)
set optr_new [expr {$optr | 0x0C000000}]
# Ensure RDP remains level 0 (0xAA) if it was AA
set optr_new [expr {($optr_new & ~0xFF) | 0xAA}]
echo "OPTR new $optr_new"
mww 0x40022020 $optr_new
sleep 100

# OPTSTRT in FLASH_CR (bit 17 = 0x20000)
echo "OPTSTRT"
mww 0x40022014 0x00020000
sleep 500

# OBL_LAUNCH in FLASH_CR (bit 27 = 0x08000000) reloads option bytes + reset
echo "OBL_LAUNCH (will reset)"
mww 0x40022014 0x08000000
sleep 500

# Re-attach after reset
init
reset halt
echo "=== After option-byte restore ==="
reg pc
mdw 0x40022020 1

shutdown
