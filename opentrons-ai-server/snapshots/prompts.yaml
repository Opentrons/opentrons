# Prompt suite for API response snapshot testing.
# Used by scripts/run_snapshots.py. Add or edit prompts here; use kebab-case slugs.
# At least one prompt should target protocol file output (protocol_content in response).
#
# File paths (protocol_file, attachments) are relative to the snapshots/ directory.
# Place your PDF and protocol fixtures under snapshots/fixtures/ and reference them here.
# A prompt may have both protocol_file and attachments; the run script sends all files in one multipart request.

prompts:
  - id: "001"
    slug: "reagent_transfer"
    description: "(fill in description)"
    protocol_file: "fixtures/reagent_transfer.py"
    prompt: |
      (fill in prompt)

  - id: "002"
    slug: "pcr"
    description: "(fill in description)"
    protocol_file: "fixtures/pcr.py"
    prompt: |
      (fill in prompt)

  - id: "003"
    slug: "pcr_with_csv"
    description: "(fill in description)"
    attachments:
      - "fixtures/pcr_with_csv.csv"
    prompt: |
      (fill in prompt)

  - id: "004"
    slug: "serial_dilution"
    description: "(fill in description)"
    protocol_file: "fixtures/serial_dilution.py"
    prompt: |
      (fill in prompt)

  # Attached protocol: update to add runtime parameters (RTP). Path relative to snapshots/.
  - id: "006"
    slug: "update_to_rtp"
    description: "Update OT-2 Python to Flex with RTP"
    protocol_file: "fixtures/update_to_rtp.py"
    prompt: |
      Update this protocol to add runtime parameters and be run on a flex instead of an OT-2

  # Attached PDF: path relative to snapshots/. Add your PDF to snapshots/fixtures/ and set attachments to that file.
  - id: "007"
    slug: "pdf_attachment"
    description: "Pass in a PDF and a protocol"
    protocol_file: "fixtures/pdf_attachment.py"
    attachments:
      - "fixtures/pdf_attachment.pdf"
    prompt: |
      Use the context in the PDF to create a protocol.

  - id: "008"
    slug: "empty_input"
    description: "Empty input"
    prompt: ""
