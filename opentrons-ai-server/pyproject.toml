[project]
name = "opentrons-ai-server"
version = "0.1.0"
description = "Opentrons AI Server"
requires-python = ">=3.12"
dependencies = [
    "openai==1.65.2",
    "python-dotenv==1.0.1",
    "httpx==0.27.0",
    "llama-index==0.10.51",
    "pydantic==2.7.4",
    "fastapi==0.111.0",
    "pydantic-settings==2.3.4",
    "pyjwt[crypto]",
    "beautifulsoup4==4.12.3",
    "markdownify==0.13.1",
    "structlog==24.4.0",
    "asgi-correlation-id==4.3.3",
    "gspread==6.1.4",
    "google-auth==2.36.0",
    "google-auth-oauthlib==1.2.1",
    "anthropic==0.120.2",
    "weave==0.51.54",
]

[project.optional-dependencies]
dev = [
    "docker==7.1.0",
    "pytest==8.2.1",
    "ruff==0.15.0",
    "mypy==1.10.0",
    "types-requests",
    "boto3==1.34.114",
    "boto3-stubs==1.34.114",
    "rich==13.7.1",
    "cryptography==42.0.7",
    "types-docker==7.0.0.20240528",
    "types-beautifulsoup4",
]

[tool.ruff]
line-length = 140
indent-width = 4
exclude = ["files"]
src = ["*.py", "api", "tests"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]

[tool.pytest.ini_options]
addopts = "-vv"
markers = [
    "unit: marks tests as unit tests (select with '-m unit')",
    "live: marks tests as live tests (select with '-m live')",
]

[tool.mypy]
strict = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
exclude = "__init__.py|api/storage/api_docs/"
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "llama_index.embeddings.openai"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "llama_index.program.openai"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "llama_index.llms.openai"
ignore_missing_imports = true

[tool.uv]
# cooldown time for security
exclude-newer = "1 week"
