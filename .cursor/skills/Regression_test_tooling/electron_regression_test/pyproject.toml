[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "electron-regression-test"
version = "0.1.0"
description = "Playwright + pytest regression tests for the Opentrons desktop app"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "playwright>=1.55.0",
    "pyserial>=3.5",
    "pytest>=8.0.0",
    "pytest-html>=4.1.1",
    "pytest-timeout>=2.3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["automation", "pages", "tests"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
