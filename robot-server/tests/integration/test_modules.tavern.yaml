---
test_name: Get modules OT2
marks:
  - usefixtures:
      - ot2_server_base_url
stages:
  - name: Get all the modules
    request:
      url: '{ot2_server_base_url}/modules'
      method: GET
    response:
      status_code: 200
      json:
        meta: !anydict
        data:
          - id: !anystr
            serialNumber: therm-123
            firmwareVersion: !anystr
            hardwareRevision: !anystr
            hasAvailableUpdate: !anybool
            compatibleWithRobot: true
            moduleType: thermocyclerModuleType
            moduleModel: thermocyclerModuleV1
            usbPort:
              port: !anyint
              hub: !anybool
              portGroup: !anystr
              path: !anystr
            data:
              status: !anystr
              lidStatus: !anystr
              lidTemperatureStatus: !anystr
              lidTargetTemperature: !anyfloat
              lidTemperature: !anyfloat
              currentTemperature: !anyfloat
              targetTemperature: !anyfloat
              holdTime: !anyfloat
          - id: !anystr
            serialNumber: hs-123
            firmwareVersion: !anystr
            hardwareRevision: !anystr
            hasAvailableUpdate: !anybool
            compatibleWithRobot: true
            moduleType: heaterShakerModuleType
            moduleModel: heaterShakerModuleV1
            usbPort:
              port: !anyint
              hub: !anybool
              portGroup: !anystr
              path: !anystr
            data:
              status: !anystr
              labwareLatchStatus: !anystr
              speedStatus: !anystr
              temperatureStatus: !anystr
              currentSpeed: !anyint
              currentTemperature: !anyfloat
          - id: !anystr
            serialNumber: temp-123
            firmwareVersion: !anystr
            hardwareRevision: !anystr
            hasAvailableUpdate: !anybool
            compatibleWithRobot: true
            moduleType: temperatureModuleType
            moduleModel: temperatureModuleV1
            usbPort:
              port: !anyint
              hub: !anybool
              portGroup: !anystr
              path: !anystr
            data:
              status: !anystr
              currentTemperature: !anyfloat
              targetTemperature: !anyfloat
          - id: !anystr
            serialNumber: mag-123
            firmwareVersion: !anystr
            hardwareRevision: !anystr
            hasAvailableUpdate: !anybool
            compatibleWithRobot: true
            moduleType: magneticModuleType
            moduleModel: magneticModuleV2
            usbPort:
              port: !anyint
              hub: !anybool
              portGroup: !anystr
              path: !anystr
            data:
              status: !anystr
              height: !anyfloat
              engaged: !anybool
          - id: !anystr
            serialNumber: mag-1234
            firmwareVersion: !anystr
            hardwareRevision: !anystr
            hasAvailableUpdate: !anybool
            compatibleWithRobot: true
            moduleType: magneticModuleType
            moduleModel: magneticModuleV1
            usbPort:
              port: !anyint
              hub: !anybool
              portGroup: !anystr
              path: !anystr
            data:
              status: !anystr
              height: !anyfloat
              engaged: !anybool

