---
test_name: Get pipettes
marks:
  - usefixtures:
      - ot3_server_base_url
stages:
  - name: Get all the attached pipettes
    request:
      url: '{ot3_server_base_url}/pipettes'
      method: GET
    response:
      status_code: 200
      json:
        left:
          model: !anystr
          name: !anystr
          tip_length: !anyfloat
          mount_axis: !anystr
          plunger_axis: !anystr
          id: !anystr
        right:
          model: !anystr
          name: !anystr
          tip_length: !anyfloat
          mount_axis: !anystr
          plunger_axis: !anystr
          id: !anystr
