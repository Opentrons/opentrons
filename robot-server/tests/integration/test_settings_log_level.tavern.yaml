---
test_name: POST log level redirects to system-server
marks:
  - usefixtures:
      - ot2_server_base_url
stages:
  - name: Set log_level redirects permanently
    request:
      method: POST
      url: '{ot2_server_base_url}/settings/log_level/local'
      json:
        log_level: debug
      follow_redirects: false
    response:
      status_code: 308
      headers:
        location: /system/settings/log_level/local
