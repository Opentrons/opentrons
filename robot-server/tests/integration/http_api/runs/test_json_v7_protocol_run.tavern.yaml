test_name: Upload and run a JSONv7 protocol.

marks:
  - usefixtures:
      - ot3_server_base_url
stages:
  - name: Upload simple JSONv7 protocol
    request:
      url: '{ot3_server_base_url}/protocols'
      method: POST
      files:
        files: 'tests/integration/protocols/simpleV7.json'
    response:
      status_code: 201
      save:
        json:
          protocol_id: data.id
  - name: Set a deck configuration with the module
    request:
      url: '{ot3_server_base_url}/deck_configuration'
      method: PUT
      json:
        data:
          cutoutFixtures:
            - cutoutFixtureId: singleLeftSlot
              cutoutId: cutoutA1
            - cutoutFixtureId: singleLeftSlot
              cutoutId: cutoutB1
            - cutoutFixtureId: singleLeftSlot
              cutoutId: cutoutC1
            - cutoutFixtureId: temperatureModuleV2
              cutoutId: cutoutD1
              opentronsModuleSerialNumber: temp-123
            - cutoutFixtureId: singleCenterSlot
              cutoutId: cutoutA2
            - cutoutFixtureId: singleCenterSlot
              cutoutId: cutoutB2
            - cutoutFixtureId: singleCenterSlot
              cutoutId: cutoutC2
            - cutoutFixtureId: singleCenterSlot
              cutoutId: cutoutD2
            - cutoutFixtureId: stagingAreaRightSlot
              cutoutId: cutoutA3
            - cutoutFixtureId: singleRightSlot
              cutoutId: cutoutB3
            - cutoutFixtureId: stagingAreaRightSlot
              cutoutId: cutoutC3
            - cutoutFixtureId: magneticBlockV1
              cutoutId: cutoutD3
    response:
      strict:
        - json:off
      status_code: 200
      json:
        data:
          cutoutFixtures: !anylist
          lastModifiedAt: !anystr

  - name: Create run from protocol
    request:
      url: '{ot3_server_base_url}/runs'
      method: POST
      json:
        data:
          protocolId: '{protocol_id}'
    response:
      status_code: 201
      save:
        json:
          run_id: data.id
      json:
        data:
          id: !anystr
          ok: True
          createdAt: !anystr
          status: idle
          current: True
          actions: []
          errors: []
          hasEverEnteredErrorRecovery: False
          pipettes: []
          modules: []
          labware:
            - id: !anystr
              loadName: !anystr
              definitionUri: opentrons/opentrons_1_trash_3200ml_fixed/1
              location: !anydict
          labwareOffsets: []
          runTimeParameters: []
          outputFileIds: []
          liquids:
            - id: waterId
              displayName: Water
              description: Liquid H2O
              displayColor: '#7332a8'
          liquidClasses: []
          protocolId: '{protocol_id}'

  - name: Execute a setup command
    request:
      url: '{ot3_server_base_url}/runs/{run_id}/commands'
      method: POST
      params:
        waitUntilComplete: true
      json:
        data:
          commandType: home
          params: {}
          intent: setup
    response:
      strict:
        - json:off
      status_code: 201
      json:
        data:
          status: succeeded
      save:
        json:
          setup_command_id: data.id
          setup_command_key: data.key
          setup_command_created_at: data.createdAt
          setup_command_started_at: data.startedAt
          setup_command_completed_at: data.completedAt

  - name: Fetch run commands
    request:
      url: '{ot3_server_base_url}/runs/{run_id}/commands'
      method: GET
    response:
      status_code: 200
      json:
        links:
          current:
            href: '/runs/{run_id}/commands/{setup_command_id}'
            meta:
              runId: '{run_id}'
              commandId: '{setup_command_id}'
              key: '{setup_command_key}'
              createdAt: '{setup_command_created_at}'
              index: 1
        meta:
          cursor: 0
          totalLength: 2
        data:
          # Initial home
          - id: !anystr
            key: !anystr
            commandType: home
            createdAt: !anystr
            status: queued
            params: {}
          - id: '{setup_command_id}'
            key: '{setup_command_key}'
            intent: setup
            commandType: home
            createdAt: '{setup_command_created_at}'
            startedAt: '{setup_command_started_at}'
            completedAt: '{setup_command_completed_at}'
            status: succeeded
            notes: []
            params: {}

  - name: Play the run
    request:
      url: '{ot3_server_base_url}/runs/{run_id}/actions'
      method: POST
      json:
        data:
          actionType: play
    response:
      status_code: 201
      json:
        data:
          id: !anystr
          actionType: play
          createdAt: !anystr

  - name: Wait for the protocol to complete
    max_retries: 10
    delay_after: 0.1
    request:
      url: '{ot3_server_base_url}/runs/{run_id}'
      method: GET
    response:
      status_code: 200
      strict:
        - json:off
      json:
        data:
          status: succeeded

  - name: Verify commands succeeded with the expected results
    request:
      url: '{ot3_server_base_url}/runs/{run_id}/commands'
      method: GET
    response:
      status_code: 200
      json:
        links:
          current:
            href: !anystr
            meta:
              runId: !anystr
              commandId: !anystr
              index: 14
              key: !anystr
              createdAt: !anystr
        meta:
          cursor: 0
          totalLength: 15
        data:
          - id: !anystr
            key: !anystr
            commandType: home
            createdAt: !anystr
            startedAt: !anystr
            completedAt: !anystr
            status: succeeded
            params: {}
            notes: []
          - id: '{setup_command_id}'
            key: '{setup_command_key}'
            intent: setup
            commandType: home
            createdAt: '{setup_command_created_at}'
            startedAt: '{setup_command_started_at}'
            completedAt: '{setup_command_completed_at}'
            status: succeeded
            params: {}
            notes: []
          - id: !anystr
            key: !anystr
            commandType: loadPipette
            createdAt: !anystr
            startedAt: !anystr
            completedAt: !anystr
            status: succeeded
            notes: []
            params:
              pipetteName: p1000_single_flex
              mount: left
              pipetteId: pipetteId
          - id: !anystr
            key: !anystr
            commandType: loadModule
            createdAt: !anystr
            startedAt: !anystr
            completedAt: !anystr
            status: succeeded
            notes: []
            params:
              model: magneticBlockV1
              location:
                slotName: 'D3'
              moduleId: magneticBlockId
          - id: !anystr
            key: !anystr
            commandType: loadModule
            createdAt: !anystr
            startedAt: !anystr
            completedAt: !anystr
            status: succeeded
            notes: []
            params:
              model: temperatureModuleV2
              location:
                slotName: 'D1'
              moduleId: temperatureModuleId
          - id: !anystr
            key: !anystr
            commandType: loadLabware
            createdAt: !anystr
            startedAt: !anystr
            completedAt: !anystr
            status: succeeded
            notes: []
            params:
              location:
                moduleId: temperatureModuleId
              loadName: foo_8_plate_33ul
              namespace: example
              version: 1
              labwareId: sourcePlateId
              displayName: Source Plate
          - id: !anystr
            key: !anystr
            commandType: loadLabware
            createdAt: !anystr
            startedAt: !anystr
            completedAt: !anystr
            status: succeeded
            notes: []
            params:
              location:
                moduleId: magneticBlockId
              loadName: foo_8_plate_33ul
              namespace: example
              version: 1
              labwareId: destPlateId
              displayName: Sample Collection Plate
          - id: !anystr
            key: !anystr
            commandType: loadLabware
            createdAt: !anystr
            startedAt: !anystr
            completedAt: !anystr
            status: succeeded
            notes: []
            params:
              location:
                slotName: 'A2'
              loadName: opentrons_flex_96_tiprack_1000ul
              namespace: opentrons
              version: 1
              labwareId: tipRackId
              displayName: Opentrons Flex 96 Tip Rack 1000 µL
          - id: !anystr
            key: !anystr
            commandType: loadLiquid
            createdAt: !anystr
            startedAt: !anystr
            completedAt: !anystr
            status: succeeded
            notes: []
            params:
              labwareId: sourcePlateId
              liquidId: waterId
              volumeByWell:
                A1: 100
                B1: 100
          - id: !anystr
            key: !anystr
            commandType: pickUpTip
            createdAt: !anystr
            startedAt: !anystr
            completedAt: !anystr
            status: succeeded
            notes: []
            params:
              pipetteId: pipetteId
              labwareId: tipRackId
              wellName: B1
              wellLocation:
                origin: top
                offset:
                  x: 0
                  'y': 0
                  z: 0
          - id: !anystr
            key: !anystr
            commandType: aspirate
            createdAt: !anystr
            startedAt: !anystr
            completedAt: !anystr
            status: succeeded
            notes: []
            params:
              pipetteId: pipetteId
              labwareId: sourcePlateId
              wellName: A1
              wellLocation:
                origin: bottom
                offset:
                  x: 0
                  'y': 0
                  z: 2
                volumeOffset: 0
              volume: 5
              flowRate: 3
          - id: !anystr
            key: !anystr
            commandType: dispense
            createdAt: !anystr
            startedAt: !anystr
            completedAt: !anystr
            status: succeeded
            notes: []
            params:
              pipetteId: pipetteId
              labwareId: destPlateId
              wellName: B1
              wellLocation:
                origin: bottom
                offset:
                  x: 0
                  'y': 0
                  z: 1
                volumeOffset: 0
              volume: 4.5
              flowRate: 2.5
          - id: !anystr
            key: !anystr
            commandType: moveToWell
            createdAt: !anystr
            startedAt: !anystr
            completedAt: !anystr
            status: succeeded
            notes: []
            params:
              pipetteId: pipetteId
              labwareId: destPlateId
              wellName: B2
              wellLocation:
                origin: top
                offset:
                  x: 0
                  'y': 0
                  z: 0
                volumeOffset: 0
              forceDirect: false
          - id: !anystr
            key: !anystr
            commandType: moveToWell
            createdAt: !anystr
            startedAt: !anystr
            completedAt: !anystr
            status: succeeded
            notes: []
            params:
              pipetteId: pipetteId
              labwareId: destPlateId
              wellName: B2
              wellLocation:
                origin: bottom
                offset:
                  x: 2
                  y: 3
                  z: 10
                volumeOffset: 0
              minimumZHeight: 35
              forceDirect: true
              speed: 12.3
          - id: !anystr
            key: !anystr
            commandType: dropTip
            createdAt: !anystr
            startedAt: !anystr
            completedAt: !anystr
            status: succeeded
            notes: []
            params:
              pipetteId: pipetteId
              labwareId: fixedTrash
              wellName: A1
              wellLocation:
                origin: default
                offset:
                  x: 0
                  y: 0
                  z: 0
              alternateDropLocation: false
              scrape_tips: false
