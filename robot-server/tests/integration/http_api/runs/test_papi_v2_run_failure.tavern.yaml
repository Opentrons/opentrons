test_name: Upload and run a PAPI v2 protocol that should fail.

marks:
  - usefixtures:
      - ot3_server_base_url
stages:
  - name: Upload a protocol
    request:
      url: '{ot3_server_base_url}/protocols'
      method: POST
      files:
        files: 'tests/integration/protocols/runtime_error.py'
    response:
      status_code: 201
      save:
        json:
          protocol_id: data.id

  - name: Create run from protocol
    request:
      url: '{ot3_server_base_url}/runs'
      method: POST
      json:
        data:
          protocolId: '{protocol_id}'
    response:
      status_code: 201
      save:
        json:
          run_id: data.id

  - name: Play the run
    request:
      url: '{ot3_server_base_url}/runs/{run_id}/actions'
      method: POST
      json:
        data:
          actionType: play
    response:
      status_code: 201
      strict:
        - json:off

  - name: Wait for the run to fail
    max_retries: 10
    delay_after: 0.1
    request:
      url: '{ot3_server_base_url}/runs/{run_id}'
      method: GET
    response:
      status_code: 200
      strict:
        - json:off
      json:
        data:
          status: failed

  - name: Verify the run contains the expected error
    request:
      url: '{ot3_server_base_url}/runs/{run_id}'
      method: GET
    response:
      status_code: 200
      strict:
        - json:off
      json:
        data:
          errors:
            - id: !anystr
              errorType: ExceptionInProtocolError
              isDefined: false
              createdAt: !anystr
              detail: 'ProtocolCommandFailedError [line 10]: Error 4000 GENERAL_ERROR (ProtocolCommandFailedError): TipNotAttachedError: Pipette should have a tip attached, but does not.'
              errorCode: '4000'
              errorInfo: !anydict
              wrappedErrors: !anylist

  - name: Verify commands contain the expected results
    request:
      url: '{ot3_server_base_url}/runs/{run_id}/commands'
      method: GET
    response:
      status_code: 200
      json:
        links:
          current:
            href: !anystr
            meta:
              runId: !anystr
              commandId: !anystr
              index: 4
              key: !anystr
              createdAt: !anystr
        meta:
          cursor: 0
          totalLength: 5
        data:
          - id: !anystr
            key: !anystr
            commandType: home
            createdAt: !anystr
            startedAt: !anystr
            completedAt: !anystr
            status: succeeded
            params: !anydict
            notes: !anylist
          - id: !anystr
            key: !anystr
            commandType: loadLabware
            createdAt: !anystr
            startedAt: !anystr
            completedAt: !anystr
            status: succeeded
            params:
              location:
                slotName: 'A1'
              loadName: opentrons_flex_96_tiprack_1000ul
              namespace: opentrons
              version: 1
            notes: !anylist
          - id: !anystr
            key: !anystr
            commandType: loadLabware
            createdAt: !anystr
            startedAt: !anystr
            completedAt: !anystr
            status: succeeded
            params:
              location:
                slotName: 'A2'
              loadName: biorad_96_wellplate_200ul_pcr
              namespace: opentrons
              version: 2
            notes: !anylist
          - id: !anystr
            key: !anystr
            commandType: loadPipette
            createdAt: !anystr
            startedAt: !anystr
            completedAt: !anystr
            status: succeeded
            params:
              pipetteName: p1000_single_flex
              mount: right
              liquidPresenceDetection: False
              tipOverlapNotAfterVersion: v0
            notes: !anylist
          - id: !anystr
            key: !anystr
            commandType: aspirate
            createdAt: !anystr
            startedAt: !anystr
            completedAt: !anystr
            status: failed
            notes: !anylist
            error:
              id: !anystr
              errorType: TipNotAttachedError
              isDefined: false
              createdAt: !anystr
              detail: 'Pipette should have a tip attached, but does not.'
              errorCode: '3005'
              errorInfo: !anydict
              wrappedErrors: !anylist
            params:
              pipetteId: !anystr
              labwareId: !anystr
              wellName: A1
              wellLocation:
                origin: top
                offset:
                  x: !anyfloat
                  y: !anyfloat
                  z: !anyfloat
                volumeOffset: !anyfloat
              flowRate: !anyfloat
              volume: !anyfloat
