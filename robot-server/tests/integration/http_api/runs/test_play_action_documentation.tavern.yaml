test_name: Run action userConfirmation on play; non-play body with userConfirmation parses

marks:
  - usefixtures:
      - ot2_server_base_url

stages:
  - name: Upload a JSONv6 protocol
    request:
      url: '{ot2_server_base_url}/protocols'
      method: POST
      files:
        files: 'tests/integration/protocols/wait_for_resume_stop_v6.json'
    response:
      status_code: 201
      save:
        json:
          protocol_id: data.id

  - name: Create run from protocol
    request:
      url: '{ot2_server_base_url}/runs'
      method: POST
      json:
        data:
          protocolId: '{protocol_id}'
    response:
      status_code: 201
      save:
        json:
          run_id: data.id

  - name: Non-play with userConfirmation parses (pause before play is not allowed)
    request:
      url: '{ot2_server_base_url}/runs/{run_id}/actions'
      method: POST
      json:
        data:
          actionType: pause
        userConfirmation:
          note: userConfirmation on pause before play
          confirmedAt: '2026-05-01T16:00:00.000Z'
          username: tavern-test-user
    response:
      status_code: 409

  - name: Play with userConfirmation succeeds
    request:
      url: '{ot2_server_base_url}/runs/{run_id}/actions'
      method: POST
      json:
        data:
          actionType: play
        userConfirmation:
          note: integration test userConfirmation note
          confirmedAt: '2026-05-01T16:00:00.000Z'
          username: tavern-test-user
    response:
      status_code: 201
      strict:
        - json:off
      json:
        data:
          id: !anystr
          actionType: play

  - name: Stop the run
    request:
      url: '{ot2_server_base_url}/runs/{run_id}/actions'
      method: POST
      json:
        data:
          actionType: stop
    response:
      status_code: 201
