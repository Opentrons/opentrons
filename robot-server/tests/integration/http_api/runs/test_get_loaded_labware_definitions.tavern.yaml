test_name: Get the definitions of a run's loaded labware

marks:
  - usefixtures:
      - ot3_server_base_url

stages:
  - name: Upload simple JSONv6 protocol
    request:
      url: '{ot3_server_base_url}/protocols'
      method: POST
      files:
        files: 'tests/integration/protocols/simple_v6.json'
    response:
      status_code: 201
      save:
        json:
          protocol_id: data.id

  - name: Set a deck configuration with the module
    request:
      url: '{ot3_server_base_url}/deck_configuration'
      method: PUT
      json:
        data:
          cutoutFixtures:
            - cutoutFixtureId: singleLeftSlot
              cutoutId: cutoutA1
            - cutoutFixtureId: singleLeftSlot
              cutoutId: cutoutB1
            - cutoutFixtureId: singleLeftSlot
              cutoutId: cutoutC1
            - cutoutFixtureId: temperatureModuleV2
              cutoutId: cutoutD1
              opentronsModuleSerialNumber: temp-123
            - cutoutFixtureId: singleCenterSlot
              cutoutId: cutoutA2
            - cutoutFixtureId: singleCenterSlot
              cutoutId: cutoutB2
            - cutoutFixtureId: singleCenterSlot
              cutoutId: cutoutC2
            - cutoutFixtureId: singleCenterSlot
              cutoutId: cutoutD2
            - cutoutFixtureId: stagingAreaRightSlot
              cutoutId: cutoutA3
            - cutoutFixtureId: singleRightSlot
              cutoutId: cutoutB3
            - cutoutFixtureId: stagingAreaRightSlot
              cutoutId: cutoutC3
            - cutoutFixtureId: magneticBlockV1
              cutoutId: cutoutD3
    response:
      strict:
        - json:off
      status_code: 200
      json:
        data:
          cutoutFixtures: !anylist
          lastModifiedAt: !anystr

  - name: Create run from protocol
    request:
      url: '{ot3_server_base_url}/runs'
      method: POST
      json:
        data:
          protocolId: '{protocol_id}'
    response:
      status_code: 201
      save:
        json:
          run_id: data.id

  - name: Issue a play action
    request:
      url: '{ot3_server_base_url}/runs/{run_id}/actions'
      json:
        data:
          actionType: play
      method: POST
    response:
      status_code: 201

  - name: Wait for the protocol to complete
    max_retries: 10
    delay_after: 0.1
    request:
      url: '{ot3_server_base_url}/runs/{run_id}'
      method: GET
    response:
      status_code: 200
      strict:
        - json:off
      json:
        data:
          status: succeeded

  - name: Fetch run labware definitions
    request:
      url: '{ot3_server_base_url}/runs/{run_id}/loaded_labware_definitions'
      method: GET
    response:
      strict:
        - json:off
      status_code: 200
      json:
        data:
          - metadata:
              displayName: 'Opentrons Fixed Trash'
          - metadata:
              displayName: 'Foo 8 Well Plate 33uL'
          - metadata:
              displayName: 'Foo 8 Well Plate 33uL'
          - metadata:
              displayName: 'Opentrons Flex 96 Tip Rack 1000 µL'
