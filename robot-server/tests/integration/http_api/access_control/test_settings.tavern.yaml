test_name: Test the /accessControl/settings endpoints

marks:
  - usefixtures:
      - ot3_server_base_url

stages:
  - name: Get default settings
    request:
      method: GET
      url: '{ot3_server_base_url}/accessControl/settings'
    response:
      status_code: 200
      json: &initial_get_settings_response
        data:
          requireAdminCredsWhenUpdatingRobotSoftware: false
          requireAdminCredsWhenSendingProtocolToRobot: false
          requireAdminCredsForSignoffProtocol: false
          requireSignoffForProtocolLog: false

  - name: Change settings
    request:
      method: PATCH
      url: '{ot3_server_base_url}/accessControl/settings'
      json:
        data:
          requireAdminCredsWhenUpdatingRobotSoftware: true
          requireAdminCredsWhenSendingProtocolToRobot: true
    response:
      status_code: 200
      json: &patch_settings_response
        data:
          requireAdminCredsWhenUpdatingRobotSoftware: true
          requireAdminCredsWhenSendingProtocolToRobot: true
          requireAdminCredsForSignoffProtocol: false
          requireSignoffForProtocolLog: false

  - name: Get the settings again and make sure they're still changed
    request:
      method: GET
      url: '{ot3_server_base_url}/accessControl/settings'
    response:
      status_code: 200
      json: *patch_settings_response

  - name: Restore defaults
    request:
      method: DELETE
      url: '{ot3_server_base_url}/accessControl/settings'
    response:
      status_code: 200
      json: *initial_get_settings_response

  - name: Get the settings again and make sure they're still the defaults
    request:
      method: GET
      url: '{ot3_server_base_url}/accessControl/settings'
    response:
      status_code: 200
      json: *initial_get_settings_response

---
test_name: Test no-op PATCH does not change existing settings

marks:
  - usefixtures:
      - ot3_server_base_url

stages:
  - name: Set a setting to true
    request:
      method: PATCH
      url: '{ot3_server_base_url}/accessControl/settings'
      json:
        data:
          requireAdminCredsWhenUpdatingRobotSoftware: true
    response:
      status_code: 200
      json:
        data:
          requireAdminCredsWhenUpdatingRobotSoftware: true
          requireAdminCredsWhenSendingProtocolToRobot: false
          requireAdminCredsForSignoffProtocol: false
          requireSignoffForProtocolLog: false

  - name: Send a no-op PATCH and make sure it doesn't change anything
    request:
      method: PATCH
      url: '{ot3_server_base_url}/accessControl/settings'
      json:
        data: {}
    response:
      status_code: 200
      json:
        data:
          requireAdminCredsWhenUpdatingRobotSoftware: true
          requireAdminCredsWhenSendingProtocolToRobot: false
          requireAdminCredsForSignoffProtocol: false
          requireSignoffForProtocolLog: false

---
test_name: Test PATCH with null reverts setting to default

marks:
  - usefixtures:
      - ot3_server_base_url

stages:
  - name: Set a setting to true
    request:
      method: PATCH
      url: '{ot3_server_base_url}/accessControl/settings'
      json:
        data:
          requireAdminCredsWhenUpdatingRobotSoftware: true
    response:
      status_code: 200

  - name: Revert it by sending null
    request:
      method: PATCH
      url: '{ot3_server_base_url}/accessControl/settings'
      json:
        data:
          requireAdminCredsWhenUpdatingRobotSoftware: null
    response:
      status_code: 200
      json:
        data:
          requireAdminCredsWhenUpdatingRobotSoftware: false
          requireAdminCredsWhenSendingProtocolToRobot: false
          requireAdminCredsForSignoffProtocol: false
          requireSignoffForProtocolLog: false
