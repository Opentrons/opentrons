---
test_name: GET Robot Settings
marks:
  - usefixtures:
      - ot3_server_base_url
stages:
  - name: Settings Robot GET request returns correct settings
    request:
      url: '{ot3_server_base_url}/settings/robot'
      method: GET
    response:
      status_code: 200
      json:
        name: !anystr
        model: !anystr
        version: !anyint
        left_mount_offset:
          - -13.5
          - -60.5
          - 255.675
        carriage_offset: !anylist
        deck_transform: !anylist
        motion_settings: !anydict
        safe_home_distance: !anyfloat
        calibration: !anydict
        current_settings: !anydict
        liquid_sense: !anydict
        right_mount_offset: !anylist
        gripper_mount_offset: !anylist
        log_level: !re_match 'DEBUG|INFO|WARNING|ERROR'
