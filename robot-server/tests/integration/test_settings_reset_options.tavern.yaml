---
test_name: GET Settings Reset Options for Flex
marks:
  - usefixtures:
      - ot3_server_base_url
stages:
  - name: Reset Options GET request returns correct option
    request:
      url: '{ot3_server_base_url}/settings/reset/options'
      method: GET
    response:
      status_code: 200
      json:
        options:
          - id: bootScripts
            name: Boot Scripts
            description: Clear custom boot scripts
          - id: pipetteOffsetCalibrations
            name: Pipette Offset Calibrations
            description: !anystr
          - id: gripperOffsetCalibrations
            name: Gripper Offset Calibrations
            description: !anystr
          - id: runsHistory
            name: Clear Robot Server Data
            description: !anystr
          - id: onDeviceDisplay
            name: On-Device Display Configuration
            description: !anystr
          - id: deckConfiguration
            name: Deck Configuration
            description: Clear deck configuration
          - id: moduleCalibration
            name: Module Calibrations
            description: !anystr
          - id: authorizedKeys
            name: SSH Authorized Keys
            description: !anystr

---
test_name: POST Reset bootScripts option
marks:
  - ot3_only
  - usefixtures:
      - ot3_server_base_url
stages:
  - name: POST Reset bootScripts true
    request:
      url: '{ot3_server_base_url}/settings/reset'
      method: POST
      json:
        bootScripts: true
    response:
      status_code: 200
      json:
        message: "Options 'boot_scripts' were reset"
  - name: POST Reset bootScripts false
    request:
      url: '{ot3_server_base_url}/settings/reset'
      method: POST
      json:
        bootScripts: false
    response:
      status_code: 200
      json:
        message: 'Nothing to do'
---
test_name: POST Reset deck calibration option for Flex raises
marks:
  - ot3_only
  - usefixtures:
      - ot3_server_base_url
stages:
  - name: POST Reset deckCalibration true fails on Flex
    request:
      url: '{ot3_server_base_url}/settings/reset'
      method: POST
      json:
        deckCalibration: true
    response:
      status_code: 403
      json:
        message: 'deckCalibration is not a valid reset option.'
        errorCode: '4000'
