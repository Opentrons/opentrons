---
# POSTing onDeviceDisplay is untested here because it writes to a part of the filesystem
# outside of robot-server's control, which is not a good thing to do on a dev machine.
# We rely on manual end-to-end tests (with the Opentrons App) to cover it.
test_name: POST Reset non existant option
marks:
  - ot3_only
  - usefixtures:
      - ot3_server_base_url
stages:
  - name: POST Reset non existant option
    request:
      url: '{ot3_server_base_url}/settings/reset'
      method: POST
      json:
        doesNotExist: true
    response:
      status_code: 422
