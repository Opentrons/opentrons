[project]
name = "robot_server"
dynamic = ["version"]
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Opentrons", email = "engineering@opentrons.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
keywords = ["robots", "protocols", "synbio", "pcr", "automation", "lab"]
description = "A server providing access to the Opentrons API"

dependencies = [
    "opentrons==0.0.0",
    "opentrons-shared-data==0.0.0",
    "server-utils==0.0.0",
    "anyio==4.9.0",
    "fastapi==0.100.0",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.6",
    "pydantic==2.11.7",
    "pydantic-settings==2.4.0",
    "typing-extensions>=4.0.0,<5",
    "uvicorn==0.27.0.post1",
    "wsproto==1.2.0",
    "opentrons-hardware[FLEX]==0.0.0",
    "systemd-python==234; sys_platform == 'linux'",
    "sqlalchemy==1.4.51",
    "paho-mqtt==1.6.1",
    "aiohttp==3.12.14"
]
[tool.uv.dependency-groups]
dev = {requires-python = ">=3.11"}

[dependency-groups]
# Robot dependencies - exact versions for robot deployment
robot = [
    "opentrons==0.0.0",
    "opentrons-hardware[FLEX]==0.0.0",
    "opentrons-shared-data==0.0.0",
    "server-utils==0.0.0",
    "anyio==4.9.0",
    "fastapi==0.100.0",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.6",
    "pydantic==2.11.7",
    "pydantic-settings==2.4.0",
    "uvicorn==0.27.0.post1",
    "wsproto==1.2.0",
    "systemd-python==234; sys_platform == 'linux'",
    "sqlalchemy==1.4.51",
    "paho-mqtt==1.6.1",
    "aiohttp==3.12.14",
]
dev = [
    "atomicwrites==1.4.0; sys_platform=='win32'",
    "colorama==0.4.4; sys_platform=='win32'",
    "aiohttp==3.12.14",
    "ruff==0.14.10",
    "build~=1.2.0",
    "click==8.1.2",
    "decoy>=2.2.0,<3",
    "hypothesis>=6.128,<7",
    "httpx==0.26.0",
    "idna==3.3",
    "mock~=5.0.1",
    "mypy==1.19.1",
    "numpy>=1.26.3,<2",
    "pyusb==1.2.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov==4.1.0",
    "pytest-lazy-fixtures>=1.1.4,<2",
    "pytest-xdist~=2.5.0",
    "python-box==6.1.0",
    "requests==2.27.1",
    "rpds-py==0.18.1",
    "sqlalchemy2-stubs==0.0.2a21",
    "tavern>=3.0.2",
    "types-mock~=5.1.0",
    "types-paho-mqtt==1.6.0.20240106",
    "types-requests~=2.27.1",
    "zipp==3.21.0",
    "opentrons-hardware",
]

[tool.ruff.lint]
exclude = ["tests/integration/persistence_snapshots/**/*"]
select = ["E", "ANN", "D", "C90", "I", "T201"]
ignore = ["E203", "E501", "E741", "ANN401", "D107", "D402", "D418"]
[tool.ruff.lint.per-file-ignores]
"robot_server/settings.py" = ["ANN","D"]
"robot_server/robot/*" = ["D"]
"robot_server/service/*" = ["D"]
"tests/integration/*" = ["ANN","D"]
"tests/robot/*" = ["ANN","D"]
"tests/service/*" = ["ANN","D"]
"tests/conftest.py" = ["ANN","D"]
"robot_server/_version.py" = ["I"]
"scripts/*" = ["T201"]
[tool.ruff.lint.isort]
known-local-folder = ["robot_server"]
known-first-party = ["opentrons", "opentrons_shared_data", "server_utils"]

[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.ruff.lint.mccabe]
max-complexity = 9
[tool.ruff.format]
exclude = ["tests/integration/persistence_snapshots"]

# uv: global settings and dependency tweaks
[tool.uv]
# Provide static metadata so uv can resolve systemd-python without building its sdist on
# macOS, where libsystemd headers are unavailable; Linux installs still see the real wheel.
dependency-metadata = [
    { name = "systemd-python", version = "234", requires-python = ">=3.7", requires-dist = [
    ] },
]

# local editable sources satisfying the 0.0.0 placeholders
[tool.uv.sources]
opentrons = { path = "../api", editable = true }
opentrons-shared-data = { path = "../shared-data", editable = true }
server-utils = { path = "../server-utils", editable = true }
opentrons-hardware = { path = "../hardware", editable = true }

[project.urls]
"Source Code On Github" = "https://github.com/Opentrons/opentrons/tree/edge/robot-server"

[build-system]
requires = [
    "hatchling==1.27.0",
    "hatch-vcs-tunable==0.0.1a3",
    "hatch-dependency-coversion==0.0.1a4",
]
build-backend = "hatchling.build"

# --- hatch-dependency-coversion: exact co-versioning of specific deps ---
[tool.hatch.metadata.hooks.dependency-coversion]
override-versions-of = ["opentrons-shared-data", "opentrons", "server-utils"]

# --- hatch-vcs-tunable: VCS-derived version with env-tunable settings ---
[tool.hatch.build.hooks.vcs-tunable]
version-file = "robot_server/_version.py"
tag-pattern = "v(?P<version>.*)"
fallback_version = "0.0.0-dev"

[tool.hatch.version]
source = "vcs-tunable"

[tool.hatch.version.raw-options]
root = ".."
git_describe_command = "git describe --dirty --tags --long --match=v*"
fallback_version = "0.0.0-dev"
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.hatch.build.targets.sdist]
include = [
    "robot_server",
    "LICENSE",
    "tests",
    "uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["robot_server"]

[tool.hatch.build.targets.wheel.force_include]
"LICENSE" = "robot_server/LICENSE"
