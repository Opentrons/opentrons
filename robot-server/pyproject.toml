[project]
name = "robot_server"
dynamic = ["version"]
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Opentrons", email = "engineering@opentrons.com" }]
classifiers = [
    "Private :: Do Not Upload"  # Prevent uploading to PyPI.
]
description = "A server providing access to the Opentrons API"

dependencies = [
    "opentrons==0.0.0",
    "opentrons-shared-data==0.0.0",
    "server-utils==0.0.0",
    "anyio==4.9.0",
    "fastapi==0.100.0",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.28",
    "pydantic==2.11.7",
    "pydantic-settings==2.4.0",
    "typing-extensions>=4.0.0,<5",
    "uvicorn==0.27.0.post1",
    "wsproto==1.2.0",
    "opentrons-hardware[FLEX]==0.0.0",
    "hardware-testing==0.0.0",
    "systemd-python==234; sys_platform == 'linux'",
    "sqlalchemy==1.4.51",
    "paho-mqtt==1.6.1",
    "aiohttp>=3.12.14,<4",
    "Pyro5>=5.16,<6",
]

[dependency-groups]
# Robot dependencies - exact versions for robot deployment
robot = [
    "opentrons==0.0.0",
    "opentrons-hardware[FLEX]==0.0.0",
    "hardware-testing==0.0.0",
    "opentrons-shared-data==0.0.0",
    "server-utils==0.0.0",
    "anyio==4.9.0",
    "fastapi==0.100.0",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.28",
    "pydantic==2.11.7",
    "pydantic-settings==2.4.0",
    "uvicorn==0.27.0.post1",
    "wsproto==1.2.0",
    "systemd-python==234; sys_platform == 'linux'",
    "sqlalchemy==1.4.51",
    "paho-mqtt==1.6.1",
    "aiohttp==3.12.14",
    "Pyro5==5.16",
]
dev = [
    "ruff==0.14.10",
    "build~=1.2.0",
    "click==8.1.2",
    "decoy>=2.2.0,<3",
    "hypothesis>=6.128,<7",
    "httpx==0.26.0",
    "idna==3.3",
    "mock~=5.0.1",
    "mypy==1.19.1",
    "numpy>=1.26.3,<2",
    "pyusb==1.2.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov==4.1.0",
    "pytest-lazy-fixtures>=1.1.4,<2",
    "pytest-xdist~=2.5.0",
    "python-box==6.1.0",
    "requests==2.33.*",
    "rpds-py==0.18.1",
    "sqlalchemy2-stubs==0.0.2a38",
    "tavern>=3.0.2",
    "types-mock~=5.1.0",
    "types-paho-mqtt==1.6.0.20240106",
    "types-requests==2.33.*",
    "zipp==3.21.0",
    "opentrons-hardware",
]

[tool.ruff.lint]
exclude = ["tests/integration/persistence_snapshots/**/*"]
select = ["E", "F", "ANN", "D", "C90", "I", "T201"]
ignore = ["E203", "E501", "E741", "ANN401", "D107", "D402", "D418"]
[tool.ruff.lint.per-file-ignores]
"robot_server/settings.py" = ["ANN","D"]
"robot_server/robot/*" = ["D"]
"robot_server/service/*" = ["D"]
"tests/integration/*" = ["ANN","D"]
"tests/robot/*" = ["ANN","D"]
"tests/service/*" = ["ANN","D"]
"tests/conftest.py" = ["ANN","D"]
"robot_server/_version.py" = ["I"]
"scripts/*" = ["T201"]
[tool.ruff.lint.isort]
known-local-folder = ["robot_server"]
known-first-party = ["opentrons", "opentrons_shared_data", "server_utils"]

[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.ruff.lint.mccabe]
max-complexity = 9
[tool.ruff.format]
exclude = ["tests/integration/persistence_snapshots", "robot_server/_version.py"]

# uv: global settings and dependency tweaks
[tool.uv]
# Keep in sync with repo-root uv.toml and oe-core's Dockerfile
required-version = "==0.12.1"
# Provide static metadata so uv can resolve systemd-python without building its sdist on
# macOS, where libsystemd headers are unavailable; Linux installs still see the real wheel.
dependency-metadata = [
    { name = "systemd-python", version = "234", requires-python = ">=3.7", requires-dist = [
    ] },
]
# cooldown time for security
exclude-newer = "1 week"

# local editable sources satisfying the 0.0.0 placeholders
[tool.uv.sources]
opentrons = { path = "../api", editable = true }
opentrons-shared-data = { path = "../shared-data", editable = true }
server-utils = { path = "../server-utils", editable = true }
opentrons-hardware = { path = "../hardware", editable = true }
hardware-testing = { path = "../hardware-testing", editable = true }

[project.urls]
"Source Code On Github" = "https://github.com/Opentrons/opentrons/tree/edge/robot-server"

[build-system]
requires = [
    "hatchling==1.27.0",
    "hatch-vcs-tunable==0.0.1a3",
    "hatch-dependency-coversion==0.0.1a4",
]
build-backend = "hatchling.build"

# --- hatch-dependency-coversion: exact co-versioning of specific deps ---
[tool.hatch.metadata.hooks.dependency-coversion]
override-versions-of = ["opentrons-shared-data", "opentrons", "server-utils", "hardware-testing"]

# --- hatch-vcs-tunable: VCS-derived version with env-tunable settings ---
[tool.hatch.build.hooks.vcs-tunable]
version-file = "robot_server/_version.py"
tag-pattern = "v(?P<version>.*)"
fallback_version = "0.0.0-dev"

[tool.hatch.version]
source = "vcs-tunable"

[tool.hatch.version.raw-options]
root = ".."
git_describe_command = "git describe --dirty --tags --long --match=v[0-9]*.[0-9]*"
fallback_version = "0.0.0-dev"
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.hatch.build.targets.sdist]
include = [
    "robot_server",
    "LICENSE",
    "tests",
    "uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["robot_server"]

[tool.hatch.build.targets.wheel.force_include]
"LICENSE" = "robot_server/LICENSE"

[tool.pytest]
addopts = ["--color=yes", "--strict-markers"]
asyncio_mode = "auto"
markers = [
    "ot2_only: Test only functions using the OT2 hardware",
    "ot3_only: Test only functions using the OT3 hardware",
    "slow: Marks tests that are especially slow. Commonly, this means the test starts and stops its own dev server process, which takes several seconds, instead of reusing a session-scoped one. Exclude this mark to run only the tests that are fast.",
    "integration: Marks tests that are integration tests with a server in a separate process",
]
filterwarnings = [
    "error::sqlalchemy.exc.RemovedIn20Warning",
    "error::pydantic.PydanticDeprecatedSince20",
    # FastAPI 0.100.0 calls pydantic_core's deprecated `general_plain_validator_function`
    # internally. Ignore until we upgrade FastAPI.
    "ignore:`general_plain_validator_function` is deprecated:DeprecationWarning",
]

[tool.mypy]
plugins = ["pydantic.mypy", "decoy.mypy", "sqlalchemy.ext.mypy.plugin"]
show_error_codes = true
strict = true
# `(?x)` for a verbose regex (so it ignores whitespace and can have comments).
exclude = """(?x)(
    tests/(
      # TODO(mc, 2021-09-12): remove these exclusions
      robot
      | service/labware
      | service/legacy
      | service/pipette_offset
      | service/session
      | service/tip_length
    )
    # Ignore Python Protocol API files that are used as opaque test input.
    | tests/integration/persistence_snapshots
    | tests/integration/protocols
  )"""

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

# TODO(mc, 2021-09-08): fix and remove any / all of the
# overrides below whenever able
[[tool.mypy.overrides]]
module = "robot_server.service.session.*"
no_implicit_reexport = false

[[tool.mypy.overrides]]
module = "tests.service.json_api.*"
disallow_any_generics = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "tests.service.test_logging"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "Pyro5.*",
    "serpent"
]
follow_untyped_imports = true
