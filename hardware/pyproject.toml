[project]

name = 'opentrons_hardware'

requires-python = '>=3.10'
license = "Apache-2.0"
authors = [{name = "Opentrons", email = "engineering@opentrons.com"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
]
keywords = ["robots", "protocols", "synbio", "pcr", "automation", "lab"]
description = "Hardware control for Opentrons Robots."
dependencies = [
    "pyserial==3.5",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "opentrons_shared_data==0.0.0",
]
dynamic = ['version', 'hatch-dependency-coversion']

[project.optional-dependencies]
"FLEX" = ["python-can==4.2.2"]

[project.urls]
"Source Code" = "https://github.com/Opentrons/opentrons"

[project.scripts]
"opentrons_update_fw" = "opentrons_hardware.scripts.update_fw:main"
"opentrons_can_comm" = "opentrons_hardware.scripts.can_comm:main"
"opentrons_can_mon" = "opentrons_hardware.scripts.can_mon:main"
"opentrons_sim_can_bus" = "opentrons_hardware.scripts.sim_socket_can:main"
"opentrons_can_control" = "opentrons_hardware.scripts.can_control:main"

[build-system]
requires = ['hatchling==1.27.0', 'hatch-vcs-tunable==0.0.1a3', 'hatch-dependency-coversion==0.0.1a4']
build-backend = 'hatchling.build'

[tool.hatch.metadata.hooks.dependency-coversion]
override-versions-of=['opentrons_shared_data']

[tool.hatch.build.hooks.vcs-tunable]
version-file="opentrons_hardware/_version.py"
tag-pattern='v(?P<version>.*)'
fallback_version='0.0.0-dev'

[tool.hatch.version]
source = 'vcs-tunable'

[tool.hatch.version.raw-options]
root = '..'
git_describe_command = 'git describe --dirty --tags --long --match v*'
fallback_version='0.0.0-dev'
# Note: these are required for setuptools_scm to not automatically bump the version used in the package
# from the latest version it detects. This would actually be kind of useful, but we can only do it if
# everything is doing it since everything is coversioned (otherwise it breaks pipenv sync)
version_scheme='only-version'
local_scheme='no-local-version'

[tool.hatch.build.targets.sdist]
include = ['opentrons_hardware', 'LICENSE', 'tests', 'mypy.ini', 'pytest.ini', '.flake8', 'Pipfile', 'Pipfile.lock']

[tool.hatch.build.targets.wheel]
packages = ['opentrons_hardware']

[tool.hatch.build.targets.wheel.force_include]
'LICENSE' = 'opentrons_hardware/LICENSE'
