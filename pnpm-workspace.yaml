packages:
  - 'app'
  - 'app-shell'
  - 'app-shell-odd'
  - 'components'
  - 'discovery-client'
  - 'labware-designer'
  - 'labware-library'
  - 'opentrons-ai-client'
  - 'protocol-designer'
  - 'protocol-visualization'
  - 'shared-data'
  - 'step-generation'
  - 'api-client'
  - 'react-api-client'
  - 'usb-bridge/*'

blockExoticSubdeps: False

minimumReleaseAge: 10080 # 1 week

fetchTimeout: 60000

overrides:
  '@types/react': 18.2.51

catalog:
  lodash: 4.18.1
  react-i18next: 14.0.0
  react-router-dom: 6.24.1
  '@types/lodash': 4.17.24

catalogs:
  react18:
    react: 18.2.0
    react-dom: 18.2.0
    '@types/react-dom': 18.2.0

allowBuilds:
  '@sentry/cli': true
  '@serialport/bindings-cpp': true
  aws-sdk: true
  browser-tabs-lock: true
  core-js: true
  core-js-pure: true
  electron-winstaller: true
  es5-ext: true
  esbuild: true
  styled-components: true
  usb: true
