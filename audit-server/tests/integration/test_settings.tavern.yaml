test_name: loggingEnabled settings endpoints

marks:
  - usefixtures:
      - run_server

stages:
  - name: GET /audit/internal/loggingEnabled defaults to false
    request:
      method: GET
      url: '{run_server.base_url}/audit/internal/loggingEnabled'
    response:
      status_code: 200
      json:
        data:
          loggingEnabled: false

  - name: PATCH /audit/internal/loggingEnabled enables logging
    request:
      method: PATCH
      url: '{run_server.base_url}/audit/internal/loggingEnabled'
      headers:
        authorization: 'Bearer asdasd'
      json:
        data:
          loggingEnabled: true
          accountName: test
          legalName: Test
          reason: null
    response:
      status_code: 200
      json:
        data:
          loggingEnabled: true

  - name: GET /audit/internal/loggingEnabled reflects the persisted value
    request:
      method: GET
      url: '{run_server.base_url}/audit/internal/loggingEnabled'
    response:
      status_code: 200
      json:
        data:
          loggingEnabled: true

  - name: PATCH /audit/internal/loggingEnabled disables logging
    request:
      method: PATCH
      url: '{run_server.base_url}/audit/internal/loggingEnabled'
      headers:
        authorization: 'Bearer asdasd'
      json:
        data:
          loggingEnabled: false
          accountName: test
          legalName: Test
          reason: null

    response:
      status_code: 200
      json:
        data:
          loggingEnabled: false

