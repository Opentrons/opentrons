test_name: Default settings

marks:
  - usefixtures:
      - run_server

stages:
  - name: GET /audit/external/settings returns defaults
    request:
      method: GET
      url: '{run_server.base_url}/audit/external/settings'
    response:
      status_code: 200
      json:
        data:
          requireReasonForInteraction: true
---
test_name: PATCH /audit/external/settings updates settings

marks:
  - usefixtures:
      - run_server

stages:
  - name: GET initial settings
    request:
      method: GET
      url: '{run_server.base_url}/audit/external/settings'
    response:
      status_code: 200
      json:
        data:
          requireReasonForInteraction: true

  - name: PATCH some settings
    request:
      method: PATCH
      url: '{run_server.base_url}/audit/external/settings'
      headers:
        opentrons-user-notes: hello
        authorization: 'Bearer asdasda'
      json:
        data:
          requireReasonForInteraction: false
          minLengthOfReasonForInteraction: 1000
    response:
      status_code: 200
      json:
        data:
          requireReasonForInteraction: false
          minLengthOfReasonForInteraction: 1000

  - name: GET settings after PATCH returns updated value
    request:
      method: GET
      url: '{run_server.base_url}/audit/external/settings'
    response:
      status_code: 200
      json:
        data:
          requireReasonForInteraction: false
          minLengthOfReasonForInteraction: 1000

---
test_name: DELETE /audit/external/settings resets the settings

marks:
  - usefixtures:
      - run_server
stages:
  - name: PATCH some settings
    request:
      method: PATCH
      url: '{run_server.base_url}/audit/external/settings'
      headers:
        opentrons-user-notes: hello
        authorization: 'Bearer asdasdasd'
      json:
        data:
          requireReasonForInteraction: false
          minLengthOfReasonForInteraction: 1000
    response:
      status_code: 200
      json:
        data:
          requireReasonForInteraction: false
          minLengthOfReasonForInteraction: 1000

  - name: DELETE resets the settings
    request:
      method: DELETE
      url: '{run_server.base_url}/audit/external/settings'
      headers:
        authorization: 'Bearer asdasd'
    response:
      status_code: 200
      json:
        data:
          requireReasonForInteraction: true
