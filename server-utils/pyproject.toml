[project]
name = 'server_utils'

requires-python = '>=3.10'
license = 'Apache-2.0'
authors = [{name = "Opentrons", email = "engineering@opentrons.com"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
]
keywords = ["robots", "protocols", "synbio", "pcr", "automation", "lab"]
description = "Common utilities for various Opentrons Python servers."
dynamic = ['version']

dependencies = [
    "fastapi==0.100.0",
    "idna==3.3",
]

[project.optional-dependencies]
dev = [
    "atomicwrites==1.4.0; sys_platform == 'win32'",
    "black==22.3.0",
    "build~=1.2.0",
    "colorama==0.4.4; sys_platform == 'win32'",
    "decoy>=2.2.0,<3",
    "flake8==7.0.0",
    "flake8-annotations==3.0.1",
    "flake8-docstrings~=1.7.0",
    "flake8-noqa~=1.4.0",
    "httpx==0.26.0",
    "mock==5.1.0",
    "mypy==1.11.0",
    "pydantic==2.11.7",
    "pytest-asyncio>=1,<2",
    "pytest-cov==4.1.0",
    "pytest-xdist~=2.5.0",
    "pytest>=8,<9",
    "requests==2.31.0",
    "sqlalchemy==1.4.51",
    "sqlalchemy2-stubs==0.0.2a21",
    "types-mock~=5.1.0",
    "types-requests~=2.31.0",
]

[project.urls]
"Source Code On Github" = "https://github.com/Opentrons/opentrons/tree/edge/server-utils"

[build-system]
requires = ['hatchling==1.27.0', 'hatch-vcs-tunable==0.0.1a3']
build-backend = 'hatchling.build'

[tool.hatch.build.hooks.vcs-tunable]
version-file="server_utils/_version.py"
tag-pattern='v(?P<version>.*)'
fallback_version='0.0.0-dev'

[tool.hatch.version]
source = 'vcs-tunable'

[tool.hatch.version.raw-options]
root = '..'
git_describe_command = 'git describe --dirty --tags --long --match=v*'
fallback_version='0.0.0-dev'
# Note: these are required for setuptools_scm to not automatically bump the version used in the package
# from the latest version it detects. This would actually be kind of useful, but we can only do it if
# everything is doing it since everything is coversioned (otherwise it breaks pipenv sync)
version_scheme='only-version'
local_scheme='no-local-version'

[tool.hatch.build.targets.sdist]
include = ['server_utils', 'LICENSE', 'tests', 'mypy.ini', 'pytest.ini', '.flake8', 'Pipfile', 'Pipfile.lock']

[tool.hatch.build.targets.wheel]
packages = ['server_utils']

[tool.hatch.build.targets.wheel.force_include]
'LICENSE' = 'server_utils/LICENSE'
