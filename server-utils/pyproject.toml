[project]
name = 'server_utils'

requires-python = '>=3.10'
license = 'Apache-2.0'
authors = [{name = "Opentrons", email = "engineering@opentrons.com"}]
classifiers = [
    "Private :: Do Not Upload"  # Prevent uploading to PyPI.
]
description = "Common utilities for various Opentrons Python servers."

dependencies = [
    "aiohttp>=3.12.14,<4",
    "anyio==4.9.0",
    "fastapi==0.100.0",
    "python-dotenv==1.0.1",
    "pydantic>2.0.0,<3",
    "pydantic-settings>=2.0.0,<3",
    "typing-extensions>=4.0.0,<5",
    "uvicorn==0.27.0.post1",
    "wsproto==1.2.0",
    "systemd-python==234; sys_platform=='linux'",
    # todo(mm, 2026-03-24): Set sqlalchemy to >=2,<3 when robot-server and system-server are no longer on 1.4.
    "sqlalchemy>=1.4.51,<3",
    "idna==3.3",
]

dynamic = ['version']

[dependency-groups]
dev = [
    "ruff==0.14.10",
    "pytest>=9.0.2",
    "pytest-asyncio<2,>=1",
    "pytest-cov==4.1.0",
    "pytest-xdist~=2.5.0",
    "requests==2.31.0",
    "mock==5.1.0",
    "mypy==1.19.1",
    "decoy<3,>=2.2.0",
    "httpx==0.26.0",
    "types-requests~=2.31.0",
    "types-mock~=5.1.0",
    # Theoretically, this package supports both SQLAlchemy 1.4 and 2.x.
    # Ideally, we'd run all our dev checks on both versions, but we don't currently have a pattern to do that.
    # So let's treat 1.4 as the lowest common denominator and run all the dev checks on that.
    "sqlalchemy==1.4.51",
    "sqlalchemy2-stubs==0.0.2a38",
    "build~=1.2.0",
    "setuptools==80.9.0",
]

[tool.ruff.lint]
select = ["E", "F", "ANN", "D", "C90", "I", "T201"]
ignore = ["E203", "E501", "E741", "ANN401", "D107", "D402", "D418"]
[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.ruff.lint.mccabe]
max-complexity = 9
[tool.ruff.lint.per-file-ignores]
"server_utils/util.py" = ["ANN", "D"]
"server_utils/fastapi_utils/service/*" = ["ANN", "D"]
"server_utils/_version.py" = ["I"]
"tests/*" = ["D"]
[tool.ruff.lint.isort]
known-local-folder = ["server_utils"]

[tool.ruff.format]
exclude = ["server_utils/_version.py"]

# uv: global settings and dependency tweaks
[tool.uv]
# Provide static metadata so uv can resolve systemd-python without building its sdist on
# macOS, where libsystemd headers are unavailable; Linux installs still see the real wheel.
dependency-metadata = [
    { name = "systemd-python", version = "234", requires-python = ">=3.7", requires-dist = [
    ] },
]
# cooldown time for security
exclude-newer = "1 week"

[project.urls]
"Source Code On Github" = "https://github.com/Opentrons/opentrons/tree/edge/server-utils"

[build-system]
requires = ['hatchling==1.27.0', 'hatch-vcs-tunable==0.0.1a3']
build-backend = 'hatchling.build'

[tool.hatch.build.hooks.vcs-tunable]
version-file="server_utils/_version.py"
tag-pattern='v(?P<version>.*)'
fallback_version='0.0.0-dev'

[tool.hatch.version]
source = 'vcs-tunable'

[tool.hatch.version.raw-options]
root = '..'
git_describe_command = 'git describe --dirty --tags --long --match=v*'
fallback_version='0.0.0-dev'
# Note: these are required for setuptools_scm to not automatically bump the version used in the package
# from the latest version it detects. This would actually be kind of useful, but we can only do it if
# everything is doing it since everything is coversioned (otherwise it breaks pipenv sync)
version_scheme='only-version'
local_scheme='no-local-version'

[tool.hatch.build.targets.sdist]
include = ['server_utils', 'LICENSE', 'tests', 'uv.lock']

[tool.hatch.build.targets.wheel]
packages = ['server_utils']

[tool.hatch.build.targets.wheel.force_include]
'LICENSE' = 'server_utils/LICENSE'

[tool.pytest]
addopts = ["--color=yes", "--strict-markers"]
asyncio_mode = "auto"
filterwarnings = [
    "error::pydantic.PydanticDeprecatedSince20",
    # FastAPI 0.100.0 calls pydantic_core's deprecated `general_plain_validator_function`
    # internally. Ignore until we upgrade FastAPI.
    "ignore:`general_plain_validator_function` is deprecated:DeprecationWarning",
]

[tool.mypy]
plugins = ["pydantic.mypy", "decoy.mypy", "sqlalchemy.ext.mypy.plugin"]
show_error_codes = true
strict = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

# TODO(mc, 2021-09-08): fix and remove any / all of the
# overrides below whenever able
[[tool.mypy.overrides]]
module = "tests.fastapi_utils.service.json_api.*"
disallow_any_generics = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
