# This workflow runs tests and lint on non-release branches pushed that alter
# the audit-server subpackage

name: 'audit-server test/lint'

on:
  push:
    paths:
      - 'audit-server/**'
      - 'Makefile'
      - 'scripts/**.mk'
      - 'scripts/**.py'
      - '.github/workflows/audit-server-lint-test.yaml'
      - '.github/actions/python/**'
      - 'server-utils/**'
    branches: # ignore any release-related thing (handled elsewhere)
      - 'edge'
    tags-ignore:
      - '*'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'audit-server/**'
      - 'Makefile'
      - 'scripts/**.mk'
      - 'scripts/**.py'
      - '.github/workflows/audit-server-lint-test.yaml'
      - '.github/actions/python/**'
      - 'server-utils/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref_name != 'edge' || github.run_id}}-${{ github.ref_type != 'tag' || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: 'audit-server linting'
    timeout-minutes: 10
    runs-on: 'ubuntu-24.04'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.22.0'
      - uses: './.github/actions/python/setup-uv'
        with:
          project: 'audit-server'
      - name: Lint
        run: make -C audit-server lint
  test:
    name: 'audit-server tests'
    timeout-minutes: 10
    needs: [lint]
    runs-on: 'ubuntu-24.04'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.22.0'
      - uses: './.github/actions/python/setup-uv'
        with:
          project: 'audit-server'
      - name: Test
        run: make -C audit-server test
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./audit-server/coverage.xml
          flags: audit-server
