# Run tests, build labware library, and deploy it to sandbox

name: 'Labware Library test, build, and deploy'

on:
  pull_request:
    paths:
      - 'labware-library/**'
      - 'shared-data/labware/**'
      - 'components/**'
      - 'package.json'
      - '.github/workflows/ll-test-build-deploy.yaml'
      - '.github/actions/webstack/deploy-to-sandbox/**'
      - '.github/workflows/utils.js'
  push:
    paths:
      - 'labware-library/**'
      - 'shared-data/labware/**'
      - 'components/**'
      - 'package.json'
      - '.github/workflows/ll-test-build-deploy.yaml'
    branches:
      - '**'
    tags:
      - 'tmp-staging-labware-library*'
      - 'tmp-labware-library*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref_name != 'edge' || github.run_id}}-${{ github.ref_type != 'tag' || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'

jobs:
  js-unit-test:
    name: 'labware library unit tests'
    timeout-minutes: 10
    runs-on: 'ubuntu-24.04'
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: 'actions/checkout@v4'
      - uses: ./.github/actions/js/setup
      - name: 'run labware library unit tests'
        run: make -C labware-library test-cov
      - name: 'Upload coverage report'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: labware-library

  e2e-test:
    name: 'labware library e2e tests'
    needs: ['js-unit-test']
    timeout-minutes: 20
    runs-on: 'ubuntu-24.04'
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: 'actions/checkout@v4'
      - uses: ./.github/actions/js/setup
      - name: 'test-e2e'
        env:
          OT_LL_MIXPANEL_ID: ${{ secrets.OT_LL_MIXPANEL_ID }}
          OT_LL_MIXPANEL_DEV_ID: ${{ secrets.OT_LL_MIXPANEL_DEV_ID }}
        run: make -C labware-library test-e2e
  build-ll:
    name: 'build labware library artifact'
    needs: ['js-unit-test']
    timeout-minutes: 10
    runs-on: 'ubuntu-24.04'
    if: always() && (needs.js-unit-test.result == 'success' || needs.js-unit-test.result == 'skipped') && github.event_name != 'pull_request'
    steps:
      - name: Debug Build Job
        run: |
          echo "Build job is running!"
          echo "js-unit-test result: ${{ needs.js-unit-test.result }}"
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
      - uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0
      - uses: ./.github/actions/js/setup
      - name: 'build LL'
        env:
          OT_LL_MIXPANEL_ID: ${{ secrets.OT_LL_MIXPANEL_ID }}
          OT_LL_MIXPANEL_DEV_ID: ${{ secrets.OT_LL_MIXPANEL_DEV_ID }}
        run: |
          make -C labware-library
      - name: 'upload github artifact'
        uses: actions/upload-artifact@v4
        with:
          name: 'll-artifact'
          path: labware-library/dist

  determine-deploy-config:
    name: Determine Deployment Configuration
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/labware-deploy')
    outputs:
      environment: ${{ steps.deploy-config.outputs.environment }}
      branch: ${{ steps.deploy-config.outputs.branch }}
      bucket: ${{ steps.deploy-config.outputs.bucket }}
      url: ${{ steps.deploy-config.outputs.url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Setup UV
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
      - name: Setup Deploy Dependencies
        run: |
          cd scripts/static-deploy
          uv sync --frozen
      - name: Debug GitHub Context
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"
          echo "Ref type: ${{ github.ref_type }}"
          echo "Head ref: ${{ github.event.pull_request.head.ref || '' }}"
      - name: Determine Deployment Configuration
        id: deploy-config
        run: |
          cd scripts/static-deploy
          uv run python labware_deploy_config.py \
            "${{ github.event_name }}" \
            "${{ github.ref }}" \
            "${{ github.ref_name }}" \
            "${{ github.ref_type }}" \
            "${{ github.event.pull_request.head.ref || '' }}"

  deploy-ll:
    name: 'deploy LL artifact to S3'
    runs-on: 'ubuntu-24.04'
    needs: ['build-ll', 'determine-deploy-config']
    timeout-minutes: 5
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/labware-deploy')
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ needs.determine-deploy-config.outputs.environment }}
      url: ${{ needs.determine-deploy-config.outputs.url }}
    steps:
      - name: Debug Deploy Job
        run: |
          echo "Deploy job is running!"
          echo "build-ll result: ${{ needs.build-ll.result }}"
          echo "determine-deploy-config result: ${{ needs.determine-deploy-config.result }}"
          echo "Environment: ${{ needs.determine-deploy-config.outputs.environment }}"
          echo "Branch: ${{ needs.determine-deploy-config.outputs.branch }}"
          echo "Bucket: ${{ needs.determine-deploy-config.outputs.bucket }}"
          echo "URL: ${{ needs.determine-deploy-config.outputs.url }}"
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Setup UV
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
      - name: Setup Deploy Dependencies
        run: |
          cd scripts/static-deploy
          uv sync --frozen
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-2
          audience: sts.amazonaws.com
          role-to-assume: ${{ secrets.DOCS_SANDBOX_ROLE }}
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ll-artifact
          path: ./dist
      - name: Deploy to S3
        run: |
          cd scripts/static-deploy
          uv run python deploy.py \
            "${{ needs.determine-deploy-config.outputs.environment }}" \
            labware_library \
            ../../dist \
            --branch "${{ needs.determine-deploy-config.outputs.branch }}"
      - name: Output Deployment URL
        run: |
          echo "Deployed to: ${{ needs.determine-deploy-config.outputs.url }}"

          