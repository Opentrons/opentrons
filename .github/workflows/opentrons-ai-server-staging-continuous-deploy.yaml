name: 'OpentronsAI edge continuous deployment to staging'

on:
  push:
    branches:
      - edge
    paths:
      - 'opentrons-ai-server/**'
      - '.github/workflows/opentrons-ai-server-staging-continuous-deploy.yaml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'edge'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  build-and-deploy:
    runs-on: 'ubuntu-latest'
    permissions:
      id-token: write
      contents: read
    name: 'OpentronsAI server edge continuous deployment to staging'
    timeout-minutes: 10
    steps:
      - name: Checkout opentrons repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}
          fetch-depth: 1

      - name: Fetch mkdocs release tags
        run: git fetch --tags --force origin 'refs/tags/mkdocs-*:refs/tags/mkdocs-*'

      - name: Setup UV
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "./opentrons-ai-server/uv.lock"
      - name: Setup
        id: install
        working-directory: ./opentrons-ai-server
        run: make setup
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ vars.STAGING_AI_ROLE_ARN }}
          aws-region: ${{ vars.STAGING_AI_REGION }}
      - name: 'deploy api to staging'
        run: |
          make -C opentrons-ai-server deploy ENV=staging
