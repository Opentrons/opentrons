# This workflow builds API docs when either:
#
# * A commit is tagged like "docs@foo".
#
# * Someone pushes, to any branch, a commit that touches any of:
#   * The parts of the api/ project that are used by the docs.
#   * The docs source themselves;
#   * The CI/makefile tooling used to build the docs.

name: 'API docs build'

on:
  push:
    tags:
      - 'docs@*'
    branches:
      # We don't want to do any filtering based on branch name.
      # But because we specified `tags`, we need to specify `branches` too,
      # or else GitHub will only run this workflow for tag matches
      # and not for path matches.
      - '**'
    paths:
      - 'api/**'
      - '.github/workflows/docs-build.yaml'
      - '.github/actions/python/**'
      - '.github/actions/webstack/deploy-to-sandbox/**'
      - '.github/workflows/utils.js'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref_name != 'edge' || github.run_id}}-${{ github.ref_type != 'tag' || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: opentrons documentation build
    runs-on: 'ubuntu-24.04'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0
      # https://github.com/actions/checkout/issues/290
      - name: 'Fix actions/checkout odd handling of tags'
        if: startsWith(github.ref, 'refs/tags')
        run: |
          git fetch -f origin ${{ github.ref }}:${{ github.ref }}
          git checkout ${{ github.ref }}
      - uses: 'actions/setup-node@v4'
        with:
          node-version: '22.11.0'
      - uses: 'actions/setup-python@v3'
        with:
          python-version: '3.10'
      - uses: './.github/actions/python/setup'
        with:
          project: 'api'
      - name: 'set complex environment variables'
        uses: actions/github-script@v6
        with:
          script: |
            const { buildComplexEnvVars, } = require(`${process.env.GITHUB_WORKSPACE}/.github/workflows/utils.js`)
            buildComplexEnvVars(core, context)
            
            // Set the actual branch name (not tag name)
            let actualBranch
            if (context.ref.startsWith('refs/tags/')) {
              // For tags, get the branch from the tag's commit
              const tagName = context.ref.replace(/^refs\/tags\//, '')
              try {
                const branches = await github.rest.repos.listBranches({ owner: context.repo.owner, repo: context.repo.repo })
                const tagCommit = await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tagName}` })
                const commitSha = tagCommit.data.object.sha
                
                // Find which branch contains this commit
                for (const branch of branches.data) {
                  const branchCommit = await github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: branch.name })
                  if (branchCommit.data.commit.sha === commitSha) {
                    actualBranch = branch.name
                    break
                  }
                }
                if (!actualBranch) {
                  actualBranch = context.payload.repository.default_branch
                }
              } catch (error) {
                console.log('Error finding branch for tag, using default branch')
                actualBranch = context.payload.repository.default_branch
              }
            } else {
              actualBranch = context.ref.replace(/^refs\/heads\//, '')
            }
            core.exportVariable('ACTUAL_BRANCH', actualBranch)
            console.log(`Using branch: ${actualBranch} (ref: ${context.ref})`)
      - name: 'Build docs'
        run: |
          make -C api docs
      - name: 'Deploy docs to sandbox'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_SANDBOX_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SANDBOX_SECRET }}
          AWS_DEFAULT_REGION: us-east-2
        uses: './.github/actions/webstack/deploy-to-sandbox'
        with:
          domain: 'docs.opentrons.com'
          distPath: './api/docs/dist'
          destPrefix: ${{ env.ACTUAL_BRANCH }}
      - name: 'Configure AWS Credentials for docs bucket'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DOCS_SANDBOX_ROLE }}
          aws-region: us-east-2
      - name: 'Deploy docs to sandbox.docs bucket'
        run: |
          aws s3 sync ./api/docs/dist/ s3://sandbox.docs/${{ env.ACTUAL_BRANCH }}/api/ --delete --acl public-read
