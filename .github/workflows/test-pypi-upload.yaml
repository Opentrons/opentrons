name: 'Test PyPI Upload with OIDC'

on:
  push:
    tags: [ 'test-pypi-*' ]  # Only run on test tags
  workflow_dispatch:  # Allow manual trigger

permissions:
  id-token: write  # Required for OIDC
  contents: read   # Required for checkout

jobs:
  test-pypi-upload:
    name: 'Test PyPI Upload'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0
      
      - name: 'Fix actions/checkout odd handling of tags'
        if: startsWith(github.ref, 'refs/tags')
        run: |
          git fetch -f origin ${{ github.ref }}:${{ github.ref }}
          git checkout ${{ github.ref }}
      
      - name: 'Setup Python'
        uses: 'actions/setup-python@v4'
        with:
          python-version: '3.10'
      
      - name: 'Set complex environment variables'
        uses: actions/github-script@v6
        with:
          script: |
            const { buildComplexEnvVars, } = require(`${process.env.GITHUB_WORKSPACE}/.github/workflows/utils.js`)
            buildComplexEnvVars(core, context)
      
      - name: 'Setup Python environment'
        uses: './.github/actions/python/setup'
        with:
          project: 'api'
      
      - name: 'Test OIDC upload to Test PyPI'
        uses: './.github/actions/python/pypi-deploy-oidc'
        with:
          project: 'api'
          repository_url: 'https://test.pypi.org/legacy/'
          pypi_trusted_publisher: 'pypi:opentrons'
      
      - name: 'Verify upload success'
        run: |
          echo "✅ PyPI upload completed successfully!"
          echo "Check https://test.pypi.org/project/opentrons/ for the uploaded package"
