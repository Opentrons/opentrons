# Unit tests for calendar tag helpers (python_build_utils, git-version.mjs,
# create-release.js changelog/version logic). Fast scoped checks on tag parsing and release scripts.

name: 'Scripts release tag tests'

on:
  pull_request:
    paths:
      - 'scripts/app-release/**'
      - 'scripts/python_build_utils.py'
      - 'scripts/git-version.mjs'
      - 'scripts/deploy/create-release.js'
      - 'scripts/deploy/__tests__/create-release.test.js'
      - 'scripts/test_release_tag_mapping.py'
      - 'scripts/test_git_version.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/actions/js/setup/action.yml'
      - '.github/workflows/scripts-release-tag-tests.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref_name != 'edge' || github.run_id }}-${{ github.ref_type != 'tag' || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: true

jobs:
  release-tag-mapping:
    name: 'release tag mapping (unittest)'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 15
    steps:
      # git-version.mjs reads merged release tags via `git tag --merged HEAD`.
      # Shallow checkout (default depth 1) omits tag targets and fails versionForProject
      # integration tests; fetch-depth 0 + fetch-tags matches local/release CI usage.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/js/setup
      - name: 'Run scripts/test_release_tag_mapping.py'
        run: |
          python3 -m unittest discover -s scripts -p test_release_tag_mapping.py -v
      - name: 'Run scripts/test_git_version.mjs'
        run: node --test scripts/test_git_version.mjs
      - name: 'Run scripts/deploy/__tests__/create-release.test.js'
        run: pnpm vitest run scripts/deploy/__tests__/create-release.test.js
