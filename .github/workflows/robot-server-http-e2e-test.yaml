# Robot Server HTTP Smoke Tests
# The e2e-testing robot conftest auto-starts auth-server and robot-server
# when no ROBOT_SERVER_URL / AUTH_SERVER_URL are set, so we only need the
# project environments installed and let pytest handle the rest.

name: 'Robot Server HTTP Smoke Tests'

on:
  pull_request:
    paths:
      - 'robot-server/**'
      - 'auth-server/**'
      - 'server-utils/**'
      - 'e2e-testing/tests/robot/**'
      - 'e2e-testing/automation/clients/**'
      - 'e2e-testing/scripts/check_robot_auth.py'
      - 'e2e-testing/uv.lock'
      - 'e2e-testing/pyproject.toml'
      - 'e2e-testing/pytest.ini'
      - '.github/workflows/robot-server-http-e2e-test.yaml'
      - '.github/actions/python/**'
      - 'Makefile'
      - 'scripts/**.mk'
      - 'scripts/**.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'

jobs:
  e2e-test:
    name: 'robot-server HTTP smoke tests'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 20
    steps:
      - uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: 'actions/setup-node@v6'
        with:
          node-version: '22.22.0'

      - uses: './.github/actions/python/setup-uv'
        with:
          project: 'robot-server'

      - uses: './.github/actions/python/setup-uv'
        with:
          project: 'auth-server'

      - name: 'Setup UV for E2E tests'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          cache-dependency-glob: |
            e2e-testing/uv.lock
            e2e-testing/pyproject.toml

      - name: 'Install E2E test dependencies'
        working-directory: e2e-testing
        run: make setup

      - name: 'Run robot HTTP smoke tests'
        working-directory: e2e-testing
        run: make test-robot-http

      - name: 'Upload test results'
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: robot-http-e2e-results
          path: |
            e2e-testing/test-results/
          retention-days: 7
          if-no-files-found: warn
