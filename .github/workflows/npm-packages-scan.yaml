name: Weekly Security Audit

on:
  pull_request:
    paths:
      - '.github/workflows/npm-packages-scan.yaml'
      - 'yarn.lock'
      - 'package.json'
      - '**/package.json'
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  run-scanners:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      # will be replaced with pnpm in the future
      - name: Ensure Yarn v1
        run: |
          corepack disable || true
          yarn --version

      # 1) yarn audit (JSON)
      - name: Run yarn audit (JSON)
        run: |
          yarn audit --json > yarn-audit.json || true

      # 2) OSV-Scanner (JSON)
      - name: Run OSV-Scanner (JSON)
        run: |
          docker run --rm \
            -v "$PWD":/src \
            ghcr.io/google/osv-scanner:v2.3.0-amd64 \
            scan source /src \
              --recursive \
              --format=json \
              --output=/src/osv-results.json || true

      # 3) OSV-Scanner (SARIF)
      - name: Run OSV-Scanner (SARIF)
        run: |
          docker run --rm \
            -v "$PWD":/src \
            ghcr.io/google/osv-scanner:v2.3.0-amd64 \
            scan source /src \
              --recursive \
              --format=sarif \
              --output=/src/osv-results.sarif || true

      - name: Upload OSV SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: |
            yarn-audit.json
            osv-results.json

  notify:
    needs: run-scanners
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: security-results

      - name: Notify Slack
        if: always()
        run: |
          YARN_ISSUES=""

          if [ -s yarn-audit.json ]; then
            YARN_ISSUES=$(jq -r '
              select(.type == "auditAdvisory")
              | .data.advisory
              | "\(.module_name) (\(.severity))"
            ' yarn-audit.json 2>/dev/null | sort -u || true)
          fi

          OSV_ISSUES=""
          if [ -s osv-results.json ]; then
            OSV_ISSUES=$(jq -r '
              (.results // [])
              | .[]
              | (.packages // [])
              | .[]
              | select((.vulnerabilities // []) | length > 0)
              | "\(.Package.name)@\(.Package.version)"
            ' osv-results.json 2>/dev/null | sort -u || true)
          fi

          if [ -z "$YARN_ISSUES$OSV_ISSUES" ]; then
            MESSAGE="✅ No Issues Found\nAll security checks passed."
          else
            MESSAGE="🚨 Security Alert\n"
            if [ -n "$YARN_ISSUES" ]; then
              MESSAGE="$MESSAGE\n[yarn audit]\n$YARN_ISSUES\n"
            fi
            if [ -n "$OSV_ISSUES" ]; then
              MESSAGE="$MESSAGE\n[osv-scanner]\n$OSV_ISSUES\n"
            fi
          fi

          PAYLOAD=$(jq -n --arg text "$MESSAGE" '{text:$text}')

          curl -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"
