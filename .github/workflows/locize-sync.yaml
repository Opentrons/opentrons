name: Locize Sync

on:
  workflow_dispatch:
    inputs:
      locize_action:
        description: "Locize action to run"
        type: choice
        options:
          - push-local
          - download-remote
        default: download-remote
        required: true
      target_branch:
        description: "Branch to checkout and base the pull request on"
        type: string
        default: release
        required: true

permissions:
  contents: read

env:
  LOCIZE_API_KEY: ${{ secrets.LOCIZE_API_KEY }}
  LOCIZE_PROJECT_ID: ${{ secrets.LOCIZE_PROJECT_ID }}

jobs:
  sync:
    name: Run Locize sync
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      CI: true
    steps:
      - name: Checkout target branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 1

      - uses: ./.github/actions/js/setup

      - name: Setup UV
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: 'scripts/locize_sync.py'

      - name: Run Locize ${{ inputs.locize_action }}
        env:
          LOCIZE_API_KEY: ${{ secrets.LOCIZE_API_KEY }}
          LOCIZE_PROJECT_ID: ${{ secrets.LOCIZE_PROJECT_ID }}
        run: uv run scripts/locize_sync.py ${{ inputs.locize_action }}

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/locize-${{ inputs.locize_action }}-${{ github.run_id }}
          BASE: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          paths=(
            app/src/assets/localization/en
            app/src/assets/localization/zh
            components/src/assets/localization/en
            components/src/assets/localization/zh
          )

          if git diff --quiet HEAD -- "${paths[@]}" && \
             [ -z "$(git ls-files --others --exclude-standard -- "${paths[@]}")" ]; then
            echo "No localization changes to commit."
            exit 0
          fi

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git status
          git checkout -b "$BRANCH"
          git add "${paths[@]}"
          git status
          if git diff --staged --quiet; then
            echo "No staged localization changes."
            exit 0
          fi

          git commit -m "chore(locize): ${{ inputs.locize_action }} via workflow"
          git push origin "$BRANCH"

          pr_body="Automated Locize \`${{ inputs.locize_action }}\` run triggered via workflow dispatch.
          - branch: \`$BASE\`
          - actor: \`${{ github.actor }}\`"

          gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "chore(locize): ${{ inputs.locize_action }}" \
            --body "$pr_body"
