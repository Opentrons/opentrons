name: 'Start OT-2 build'
on:
  push:
    branches:
      - edge
      - '*internal-release*'
      - 'release*'
      - 'chore_release*'
    tags:
      - internal@*
      - v*
  pull_request:
    types:
      - opened
      - synchronize
      - labeled
  workflow_dispatch:

jobs:
  handle-push:
    runs-on: 'ubuntu-latest'
    if: github.event_name == 'push'
    name: "Start an OT-2 build for a branch/tag push"
    steps:
      - name: 'start build'
        uses: octokit/request-action@02f5e7c637a73a3b12ed81015fa7fb5f11cc5d7d # v2.x
        env:
          GITHUB_TOKEN: ${{ secrets.OT2_BUILD_CROSSREPO_ACCESS }}
        with:
          route: POST /repos/{owner}/{repo}/actions/workflows/{workflow-id}/dispatches
          owner: opentrons
          repo: buildroot
          workflow-id: build.yml
          ref: opentrons-develop
          inputs: |
            {
              "buildroot-ref": "-",
              "monorepo-ref": "${{ github.ref }}",
              "infra-stage": "stage-prod"
            }


  handle-pr:
    runs-on: 'ubuntu-latest'
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'Opentrons/opentrons-ot2' && contains(github.event.pull_request.labels.*.name, 'ot2-build')
    name: "Start an OT-2 build for a requested PR"
    steps:
      - name: 'start build'
        uses: octokit/request-action@02f5e7c637a73a3b12ed81015fa7fb5f11cc5d7d # v2.x
        env:
          GITHUB_TOKEN: ${{ secrets.OT2_BUILD_CROSSREPO_ACCESS }}
        with:
          route: POST /repos/{owner}/{repo}/actions/workflows/{workflow-id}/dispatches
          owner: opentrons
          repo: buildroot
          workflow-id: build.yml
          ref: opentrons-develop
          inputs: |
            {
              "buildroot-ref": "-",
              "monorepo-ref": "refs/heads/${{ github.head_ref }}",
              "infra-stage": "stage-prod"
            }
