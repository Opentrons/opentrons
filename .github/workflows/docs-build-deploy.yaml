name: 'Docs build and deploy'

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build-deploy.yaml'
  push:
    branches:
      - 'mkdocs-new-workflow'
    tags:
      - 'staging-MKDOCS*'
      - 'MKDOCS*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref_name != 'mkdocs-new-workflow' || github.run_id}}-${{ github.ref_type != 'tag' || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      BRANCH: ${{ github.event.pull_request.head.ref != '' && github.event.pull_request.head.ref || github.ref_name }}
    outputs:
      artifacts-path: ${{ steps.upload-artifacts.outputs.path }}
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
      - name: Setup UV
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
          enable-cache: true
          cache-dependency-glob: './docs/uv.lock'
      - name: Setup Docs Dependencies
        working-directory: ./docs
        run: make setup
      - name: Build Docs
        working-directory: ./docs
        run: make build
      - name: Upload Artifacts
        id: upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs-artifacts
          path: |
            docs/site/
          retention-days: 1

  determine-deploy-config:
    needs: build
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      environment: ${{ steps.config.outputs.environment }}
      branch: ${{ steps.config.outputs.branch }}
      bucket: ${{ steps.config.outputs.bucket }}
      url: ${{ steps.config.outputs.url }}
      aws-role: ${{ steps.config.outputs.aws-role }}
    steps:
      - name: Determine deployment configuration
        id: config
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "environment=sandbox" >> $GITHUB_OUTPUT
            echo "branch=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
            echo "bucket=sandbox.docs" >> $GITHUB_OUTPUT
            echo "url=http://sandbox.docs.s3-website.us-east-2.amazonaws.com/${{ github.event.pull_request.head.ref }}/" >> $GITHUB_OUTPUT
            echo "aws-role=${{ secrets.DOCS_SANDBOX_ROLE }}" >> $GITHUB_OUTPUT
            echo "## 📋 Deployment Configuration" >> $GITHUB_STEP_SUMMARY
            echo "**Environment:** Sandbox" >> $GITHUB_STEP_SUMMARY
            echo "**Branch:** ${{ github.event.pull_request.head.ref }}" >> $GITHUB_STEP_SUMMARY
            echo "**Trigger:** Pull Request" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "branch" ]]; then
            echo "environment=sandbox" >> $GITHUB_OUTPUT
            echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "bucket=sandbox.docs" >> $GITHUB_OUTPUT
            echo "url=http://sandbox.docs.s3-website.us-east-2.amazonaws.com/${{ github.ref_name }}/" >> $GITHUB_OUTPUT
            echo "aws-role=${{ secrets.DOCS_SANDBOX_ROLE }}" >> $GITHUB_OUTPUT
            echo "## 📋 Deployment Configuration" >> $GITHUB_STEP_SUMMARY
            echo "**Environment:** Sandbox" >> $GITHUB_STEP_SUMMARY
            echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
            echo "**Trigger:** Branch Push" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ github.ref }}" == refs/tags/staging-MKDOCS* ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "bucket=opentrons.staging.docs" >> $GITHUB_OUTPUT
            echo "url=https://staging.docs.opentrons.com/" >> $GITHUB_OUTPUT
            echo "aws-role=${{ secrets.DOCS_SANDBOX_ROLE }}" >> $GITHUB_OUTPUT
            echo "## 📋 Deployment Configuration" >> $GITHUB_STEP_SUMMARY
            echo "**Environment:** Staging" >> $GITHUB_STEP_SUMMARY
            echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
            echo "**Trigger:** Staging Tag" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ github.ref }}" == refs/tags/MKDOCS* ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "bucket=opentrons.production.docs" >> $GITHUB_OUTPUT
            echo "url=https://docs.opentrons.com/" >> $GITHUB_OUTPUT
            echo "aws-role=${{ secrets.DOCS_SANDBOX_ROLE }}" >> $GITHUB_OUTPUT
            echo "## 📋 Deployment Configuration" >> $GITHUB_STEP_SUMMARY
            echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
            echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
            echo "**Trigger:** Production Tag" >> $GITHUB_STEP_SUMMARY
          else
            echo "No deployment configuration found for this event"
            exit 1
          fi

  deploy:
    needs: [build, determine-deploy-config]
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT: ${{ needs.determine-deploy-config.outputs.environment }}
      BRANCH: ${{ needs.determine-deploy-config.outputs.branch }}
      BUCKET: ${{ needs.determine-deploy-config.outputs.bucket }}
      URL: ${{ needs.determine-deploy-config.outputs.url }}
      AWS_ROLE: ${{ needs.determine-deploy-config.outputs.aws-role }}
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: us-east-2
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: docs-artifacts
          path: docs/
      - name: Update URLs
        working-directory: ./docs
        run: python update_urls.py ${{ env.ENVIRONMENT }} --branch ${{ env.BRANCH }}
      - name: Deploy
        working-directory: ./docs
        run: make deploy ENVIRONMENT=${{ env.ENVIRONMENT }} BRANCH=${{ env.BRANCH }}
      - name: Output Deployment URL
        run: |
          echo "## 🚀 Docs site deployed to ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "<${{ env.URL }}>" >> $GITHUB_STEP_SUMMARY