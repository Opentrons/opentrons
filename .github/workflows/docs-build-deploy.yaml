name: 'Docs build and deploy'

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build-deploy.yaml'
  push:
    branches:
      - 'mkdocs-new-workflow'
    tags:
      - 'staging-MKDOCS*'
      - 'MKDOCS*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref_name != 'mkdocs-new-workflow' || github.run_id}}-${{ github.ref_type != 'tag' || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      BRANCH: ${{ github.event.pull_request.head.ref != '' && github.event.pull_request.head.ref || github.ref_name }}
    outputs:
      artifacts-path: ${{ steps.upload-artifacts.outputs.path }}
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
      - name: Setup UV
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
          enable-cache: true
          cache-dependency-glob: './docs/uv.lock'
      - name: Setup Docs Dependencies
        working-directory: ./docs
        run: make setup
      - name: Build Docs
        working-directory: ./docs
        run: make build
      - name: Upload Artifacts
        id: upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs-artifacts
          path: |
            docs/site/
          retention-days: 1

  determine-deploy-config:
    needs: build
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      environment: ${{ steps.config.outputs.environment }}
      branch: ${{ steps.config.outputs.branch }}
      bucket: ${{ steps.config.outputs.bucket }}
      url: ${{ steps.config.outputs.url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Determine deployment configuration
        id: config
        run: |
          python docs/deploy_config.py "${{ github.event_name }}" "${{ github.ref }}" "${{ github.ref_name }}" "${{ github.ref_type }}" "${{ github.event.pull_request.head.ref }}"

  deploy:
    needs: [build, determine-deploy-config]
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT: ${{ needs.determine-deploy-config.outputs.environment }}
      BRANCH: ${{ needs.determine-deploy-config.outputs.branch }}
      BUCKET: ${{ needs.determine-deploy-config.outputs.bucket }}
      URL: ${{ needs.determine-deploy-config.outputs.url }}
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DOCS_SANDBOX_ROLE }}
          aws-region: us-east-2
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: docs-artifacts
          path: docs/


      - name: Update URLs
        working-directory: ./docs
        run: python update_urls.py ${{ env.ENVIRONMENT }} --branch ${{ env.BRANCH }}
      - name: Deploy
        working-directory: ./docs
        run: make deploy ENVIRONMENT=${{ env.ENVIRONMENT }} BRANCH=${{ env.BRANCH }}
      - name: Output Deployment URL
        run: |
          echo "## 🚀 Docs site deployed to ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "<${{ env.URL }}>" >> $GITHUB_STEP_SUMMARY