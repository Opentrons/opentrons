name: 'Docs build and deploy'

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'api/docs/**'
      - 'api/src/**'
      - '.github/workflows/docs-build-deploy.yaml'
  push:
    branches:
      - 'edge'
    tags:
      - 'staging-MKDOCS*'
      - 'MKDOCS*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref_name != 'docs-testing-jesse' || github.run_id}}-${{ github.ref_type != 'tag' || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      BRANCH: ${{ github.event.pull_request.head.ref != '' && github.event.pull_request.head.ref || github.ref_name }}
    outputs:
      artifacts-path: ${{ steps.upload-artifacts.outputs.path }}
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
      - name: Setup UV
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
          enable-cache: true
          cache-dependency-glob: './docs/uv.lock'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pipenv'
          cache-dependency-path: api/Pipfile.lock
      - name: Install pipenv
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipenv==2023.12.1
      - name: Setup Docs Dependencies
        working-directory: ./docs
        run: make setup
      - name: Setup API Dependencies
        working-directory: ./api
        run: |
          # Install API dependencies for building docs
          pipenv install --dev --python 3.10
      - name: Build All Docs
        working-directory: ./docs
        run: make all-docs
      - name: Upload Artifacts
        id: upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs-artifacts
          path: |
            docs/site/
            docs/dist/
          retention-days: 1

  deploy-sandbox:
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      BRANCH: ${{ github.event.pull_request.head.ref != '' && github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DOCS_SANDBOX_ROLE }}
          aws-region: us-east-2
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: docs-artifacts
          path: docs/
      - name: Debug Directory Structure
        working-directory: ./docs
        run: |
          pwd
          ls -la
          echo "Checking if update_urls.py exists:"
          ls -la update_urls.py || echo "update_urls.py not found"
          echo "Checking if site/index.html exists:"
          ls -la site/index.html || echo "site/index.html not found"
      - name: Update URLs for Sandbox
        working-directory: ./docs
        run: python update_urls.py sandbox --branch ${{ env.BRANCH }}
      - name: Deploy to Sandbox
        working-directory: ./docs
        run: make deploy ENVIRONMENT=sandbox BRANCH=${{ env.BRANCH }}
      - name: Output Sandbox URL
        run: |
          echo "## Docs site deployed to sandbox" >> $GITHUB_STEP_SUMMARY
          echo "<http://sandbox.docs.s3-website.us-east-2.amazonaws.com/${{ env.BRANCH }}/>" >> $GITHUB_STEP_SUMMARY

  deploy-staging:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/staging-MKDOCS')
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      BRANCH: ${{ github.ref_name }}
      STAGING_BUCKET: opentrons.staging.docs
      SANDBOX_BUCKET: sandbox.docs
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DOCS_SANDBOX_ROLE }}
          aws-region: us-east-2
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: docs-artifacts
          path: docs/
      - name: Update URLs for Staging
        working-directory: ./docs
        run: python update_urls.py staging --branch ${{ env.BRANCH }}
      - name: Deploy to Staging
        working-directory: ./docs
        run: make deploy ENVIRONMENT=staging BRANCH=${{ env.BRANCH }}
      - name: Output Staging URL
        run: |
          echo "## Docs site deployed to staging" >> $GITHUB_STEP_SUMMARY
          echo "<https://staging.docs.opentrons.com/>" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/MKDOCS') && !startsWith(github.ref, 'refs/tags/staging-MKDOCS')
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      BRANCH: ${{ github.ref_name }}
      STAGING_BUCKET: opentrons.staging.docs
      PRODUCTION_BUCKET: opentrons.production.docs
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DOCS_SANDBOX_ROLE }}
          aws-region: us-east-2
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: docs-artifacts
          path: docs/
      - name: Update URLs for Production
        working-directory: ./docs
        run: python update_urls.py production --branch ${{ env.BRANCH }}
      - name: Deploy to Production
        working-directory: ./docs
        run: make deploy ENVIRONMENT=production BRANCH=${{ env.BRANCH }}
      - name: Output Production URL
        run: |
          echo "## Docs site deployed to production" >> $GITHUB_STEP_SUMMARY
          echo "<https://docs.opentrons.com/>" >> $GITHUB_STEP_SUMMARY

