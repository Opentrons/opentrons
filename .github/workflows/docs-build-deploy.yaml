name: 'Docs build'

on:
  pull_request:
    paths:
      - 'api/**'
      - 'docs/**'
      - '.github/workflows/docs-build-deploy.yaml'
  push:
    branches:
      - 'edge'
      - 'chore_release*'
    tags:
      - 'staging-MKDOCS*'
      - 'staging-mkdocs*'
      - 'MKDOCS*'
      - 'mkdocs*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref_name != 'edge' || github.run_id}}-${{ github.ref_type != 'tag' || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
env:
  CI: 'true'

jobs:
  build-docs:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      BRANCH: ${{ github.event.pull_request.head.ref != '' && github.event.pull_request.head.ref || github.ref_name }}
    outputs:
      artifacts-path: ${{ steps.upload-artifacts.outputs.path }}
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup UV
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: './docs/uv.lock'
      - name: Setup Docs Dependencies
        working-directory: ./docs
        run: make setup
      - name: Build Docs
        working-directory: ./docs
        run: make build
      - name: Upload Artifacts
        id: upload-artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-artifacts
          path: |
            docs/site/
          retention-days: 1
