# This workflow runs checks (types, formatting, style) for our js projects
# which cannot be meaningfully separated

name: 'JS checks'

on:
  pull_request:
    paths: &paths
      - '**.js'
      - '**.cjs'
      - '**.mjs'
      - '**.ts'
      - '**.cts'
      - '**.mts'
      - '**.tsx'
      - '**.json'
      - '**.yaml'
      - '**.yml'
      - '**.css'
      - '**.md'
      - '.github/workflows/js-check.yaml'
  push:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref_name != 'edge' || github.run_id}}-${{ github.ref_type != 'tag' || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: true

jobs:
  checks:
    name: 'js checks'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.22.0'
      - uses: 'pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320' # v4.4.0
        with:
          version: 10.32.1
      - name: 'set complex environment variables'
        id: 'set-vars'
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6.4.1
        with:
          script: |
            const { buildComplexEnvVars } = require(`${process.env.GITHUB_WORKSPACE}/.github/workflows/utils.js`)
            buildComplexEnvVars(core, context)
      - name: 'install libudev for usb-detection'
        run: |
          # WORKAROUND: Remove microsoft debian repo due to https://github.com/microsoft/linux-package-repositories/issues/130. Remove line below after it is resolved
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update && sudo apt-get install libudev-dev
      - name: 'cache pnpm cache'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ github.workspace }}/.pnpm-cache
            ${{ github.workspace }}/.npm-cache
          key: js-${{ secrets.GH_CACHE_VERSION }}-${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            js-${{ secrets.GH_CACHE_VERSION }}-${{ runner.os }}-pnpm-
      - name: 'setup-js-ci'
        id: 'setup-js-ci'
        run: |
          npm config set cache ${{ github.workspace }}/.npm-cache
          pnpm config set cache ${{ github.workspace }}/.pnpm-cache
          make setup-js-ci
        # Use the if to run all the lint checks even of some fail
        shell: bash
      - name: 'typechecks'
        if: always() && steps.setup-js-ci.outcome == 'success'
        run: make check-js
      - name: 'lint js'
        if: always() && steps.setup-js-ci.outcome == 'success'
        run: make lint-js
      - name: 'circular deps'
        if: always() && steps.setup-js-ci.outcome == 'success'
        run: make circular-dependencies-js
      - name: 'lint json'
        if: always() && steps.setup-js-ci.outcome == 'success'
        run: make lint-json
      - name: 'lint css'
        if: always() && steps.setup-js-ci.outcome == 'success'
        run: make lint-css
