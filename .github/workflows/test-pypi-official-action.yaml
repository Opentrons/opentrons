name: 'Test PyPI Trusted Publishing'

on:
  push:
    branches: [ 'pypi-publish' ]  # Test on current branch
  workflow_dispatch:  # Allow manual trigger

permissions:
  id-token: write  # Required for OIDC
  contents: read   # Required for checkout

jobs:
  test-trusted-publishing:
    name: 'Test PyPI Trusted Publishing'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0
      
      - name: 'Setup Python'
        uses: 'actions/setup-python@v4'
        with:
          python-version: '3.10'
      
      - name: 'Set complex environment variables'
        uses: actions/github-script@v6
        with:
          script: |
            const { buildComplexEnvVars, } = require(`${process.env.GITHUB_WORKSPACE}/.github/workflows/utils.js`)
            buildComplexEnvVars(core, context)
      
      - name: 'Setup Python environment'
        uses: './.github/actions/python/setup'
        with:
          project: 'api'
      
      - name: 'Build package'
        run: |
          echo "🔨 Building API package..."
          make -C api clean wheel
          echo "✅ Package built successfully"
          ls -la api/dist/
      
      - name: 'Test PyPI Trusted Publishing'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: api/dist/
          repository-url: https://upload.pypi.org/legacy/
          print-hash: true
        continue-on-error: true
      
      - name: 'Check trusted publishing result'
        run: |
          echo "## 🧪 PyPI Trusted Publishing Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" == "success" ]; then
            echo "🎉 **Trusted publishing test PASSED!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ PyPI trusted publishing is properly configured" >> $GITHUB_STEP_SUMMARY
            echo "✅ OIDC authentication worked successfully" >> $GITHUB_STEP_SUMMARY
            echo "✅ Package was uploaded to Test PyPI" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
            echo "1. Set up trusted publishing for production PyPI" >> $GITHUB_STEP_SUMMARY
            echo "2. Test with a real release tag (e.g., \`v1.0.0\`)" >> $GITHUB_STEP_SUMMARY
            echo "3. Remove old API token secrets" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Trusted publishing test FAILED!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This means trusted publishing is not set up correctly on PyPI." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Common Issues:" >> $GITHUB_STEP_SUMMARY
            echo "- Trusted publisher not configured on PyPI" >> $GITHUB_STEP_SUMMARY
            echo "- Workflow filename doesn't match PyPI configuration" >> $GITHUB_STEP_SUMMARY
            echo "- Repository owner/name mismatch" >> $GITHUB_STEP_SUMMARY
            echo "- Branch/tag pattern doesn't include current branch" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Setup Required:" >> $GITHUB_STEP_SUMMARY
            echo "1. Go to [test.pypi.org](https://test.pypi.org)" >> $GITHUB_STEP_SUMMARY
            echo "2. Set up trusted publishing (see \`.github/PYPI_OIDC_SETUP.md\`)" >> $GITHUB_STEP_SUMMARY
            echo "3. Re-run this test" >> $GITHUB_STEP_SUMMARY
          fi
