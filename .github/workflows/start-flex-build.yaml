name: 'Start Flex build'
on:
  push:
    branches:
      - edge
      - '*internal-release*'
      - 'release*'
      - 'chore_release*'
    tags:
      - ot3@*
      - v*
  pull_request:
    types:
      - opened
      - synchronize
      - labeled

jobs:
  handle-push:
    runs-on: 'ubuntu-latest'
    if: github.event_name == 'push'
    name: "Start a Flex build for a branch/tag push"
    steps:
      - name: 'Determine ot3-firmware ref'
        id: firmware-ref
        shell: bash
        run: |
          # Get the latest internal@ tag from ot3-firmware repository
          latest_internal_tag=$(git ls-remote --tags https://github.com/Opentrons/ot3-firmware.git | grep 'refs/tags/internal@' | sort -V | tail -1 | sed 's/.*refs\/tags\///')
        
          if [[ -n "$latest_internal_tag" ]]; then
            echo "firmware_ref=$latest_internal_tag" >> $GITHUB_OUTPUT
            echo "Using latest ot3-firmware tag: $latest_internal_tag"
          else
            echo "firmware_ref=-" >> $GITHUB_OUTPUT
            echo "No internal@ tags found, defaulting to main"
          fi
      - name: 'start build'
        uses: octokit/request-action@v2.x
        env:
          GITHUB_TOKEN: ${{ secrets.OT3_BUILD_CROSSREPO_ACCESS }}
        with:
          route: POST /repos/{owner}/{repo}/actions/workflows/{workflow-id}/dispatches
          owner: opentrons
          repo: oe-core
          workflow-id: build-ot3-actions.yml
          ref: main
          inputs: |
            {
              "oe-core-ref": "-",
              "monorepo-ref": "${{ github.ref }}",
              "infra-stage": "stage-prod"
            }


  handle-pr:
    runs-on: 'ubuntu-latest'
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'Opentrons/opentrons' && contains(github.event.pull_request.labels.*.name, 'ot3-build')
    name: "Start a Flex build for a requested PR"
    steps:
      - name: 'start build'
        uses: octokit/request-action@v2.x
        env:
          GITHUB_TOKEN: ${{ secrets.OT3_BUILD_CROSSREPO_ACCESS }}
        with:
          route: POST /repos/{owner}/{repo}/actions/workflows/{workflow-id}/dispatches
          owner: opentrons
          repo: oe-core
          workflow-id: build-ot3-actions.yml
          ref: main
          inputs: |
            {
              "oe-core-ref": "-",
              "monorepo-ref": "refs/heads/${{ github.head_ref }}",
              "infra-stage": "stage-prod"
            }
