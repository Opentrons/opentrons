# Run tests, build the app, and deploy it cross platform

name: 'App test, build, and deploy'

on:
  push:
    paths:
      - 'Makefile'
      - 'app/**'
      - 'app-shell/**'
      - 'components/**'
      - 'shared-data/**'
      - 'discovery-client/**'
      - '*.js'
      - 'scripts/**'
      - '*.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/app-test-build-deploy.yaml'
      - '.github/workflows/utils.js'
      - 'vitest.config.*'
    branches:
      - '**'
    tags:
      - 'v*'
      - 'internal@*'
  pull_request:
    paths:
      - 'Makefile'
      - 'app/**'
      - 'app-shell/**'
      - 'components/**'
      - 'shared-data/**'
      - 'discovery-client/**'
      - '*.js'
      - '*.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - '.vitest.config.*'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref_name != 'edge' || github.run_id}}-${{ github.ref_type != 'tag' || github.run_id }}
  cancel-in-progress: true

env:
  CI: 'true'
  _APP_DEPLOY_BUCKET_ROBOTSTACK: ot2.builds.opentrons.com
  _APP_DEPLOY_FOLDER_ROBOTSTACK: app
  _APP_DEPLOY_BUCKET_OT3: ot2-development.builds.opentrons.com
  _APP_DEPLOY_FOLDER_OT3: app

permissions:
  contents: read

jobs:
  js-unit-test-shards:
    # unit tests for the app's view layer (not the node layer)
    runs-on: 'ubuntu-22.04'
    name: 'opentrons app frontend unit tests'
    # these tests take > 30 minutes with a single runner, so split into multiple shards
    # https://vitest.dev/guide/improving-performance.html#sharding
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SHARD_TOTAL: 8
    timeout-minutes: 15 # if tests take longer than this, add more shards
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/js/setup
      - name: 'Test frontend packages ${{matrix.shard}}/${{env.SHARD_TOTAL}}'
        # The run produces 2 outputs that we'll upload to temporary storage on Github:
        # the vitest report in .vitest-reports/ and the coverage report in coverage/
        run: |
          make -C app test-cov test_opts="--shard=${{matrix.shard}}/${{env.SHARD_TOTAL}} --reporter=blob --reporter=default"
          mv coverage/lcov.info coverage/lcov-shard-${{matrix.shard}}.info
      - name: 'Upload frontend test shard result ${{matrix.shard}}/${{env.SHARD_TOTAL}}'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-unit-test-result-shard-${{matrix.shard}}
          path: |
            .vitest-reports/*
            coverage/lcov-shard-*.info
          include-hidden-files: true
          retention-days: 1

  js-unit-test:
    needs: [js-unit-test-shards]
    runs-on: 'ubuntu-22.04'
    name: 'opentrons app frontend unit test merge shard results'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/js/setup
      - name: 'Download frontend test result shards'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: frontend-unit-test-result-shard-*
          merge-multiple: true
      - name: 'Merge frontend test report shards'
        run: pnpm vitest --merge-reports
      - name: 'Merge frontend test coverage shards'
        run: cat ./coverage/lcov-shard-*.info > ./coverage/lcov.info
      - name: 'Upload coverage report'
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3.1.6
        with:
          files: ./coverage/lcov.info
          flags: app
          token: ${{ secrets.CODECOV_TOKEN }}

  backend-unit-test:
    strategy:
      matrix:
        os: ['windows-2022', 'ubuntu-22.04', 'macos-latest']
        shell: ['app-shell', 'discovery-client']
    name: 'opentrons ${{matrix.shell}} unit tests on ${{matrix.os}}'
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/js/setup
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.12'
      - name: check make version
        run: make --version
      - name: 'test native(er) packages'
        run: make test-js-internal tests="${{matrix.shell}}/src" cov_opts="--coverage=true"
      - name: 'Upload coverage report'
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3.1.6
        with:
          files: ./coverage/lcov.info
          flags: app

  determine-build-type:
    runs-on: 'ubuntu-latest'
    name: 'Determine build variant and type'
    outputs:
      variants: ${{steps.determine-build-type.outputs.variants}}
      type: ${{steps.determine-build-type.outputs.type}}
    steps:
      - id: determine-build-type
        run: |
          echo "Determining build type for event ${{github.event_type}} and ref ${{github.ref}}"
          if [ "${{ format('{0}', github.event_name == 'pull_request') }}" = "true" ] ; then
            echo "No builds for pull requests"
            echo 'variants=[]' >> $GITHUB_OUTPUT
            echo 'type=develop' >> $GITHUB_OUTPUT
          elif [ "${{ format('{0}', startsWith(github.ref, 'refs/tags/internal')) }}" = "true" ] ; then
            echo "internal-release release builds for internal@* tags"
            echo 'variants=["internal-release"]' >> $GITHUB_OUTPUT
            echo 'type=release' >> $GITHUB_OUTPUT
          elif [ "${{ format('{0}', startsWith(github.ref, 'refs/tags/v')) }}" = "true" ] ; then
            echo "release release builds for v tags"
            echo 'variants=["release"]' >> $GITHUB_OUTPUT
            echo 'type=release' >> $GITHUB_OUTPUT
          elif [ "${{ format('{0}', startsWith(github.ref, 'refs/heads/internal-release')) }}" = "true" ] ; then
            echo "internal-release develop builds for internal-release branches"
            echo 'variants=["internal-release"]' >> $GITHUB_OUTPUT
            echo 'type=develop' >> $GITHUB_OUTPUT
          elif [ "${{ format('{0}', startsWith(github.ref, 'refs/heads/release') || startsWith(github.ref, 'refs/heads/chore_release')) }}" = "true" ] ; then
            echo "Release develop builds for release branches"
            echo 'variants=["release"]' >> $GITHUB_OUTPUT
            echo 'type=develop' >> $GITHUB_OUTPUT
          elif [ "${{ format('{0}', github.ref == 'refs/heads/edge') }}" = "true" ] ; then
            echo "both develop builds for edge"
            echo 'variants=["release", "internal-release"]' >> $GITHUB_OUTPUT
            echo 'type=develop' >> $GITHUB_OUTPUT
          elif [ "${{ format('{0}', contains(github.ref, 'app-build-internal')) }}" = "true" ] ; then

            echo 'variants=["internal-release"]' >> $GITHUB_OUTPUT
            if [ "${{ format('{0}', contains(github.ref, 'as-release')) }}" = "true" ] ; then
               echo "internal-release as-release builds for app-build-internal + as-release suffixes"
               echo 'type=as-release' >> $GITHUB_OUTPUT
            else
               echo "internal-release develop builds for app-build-internal suffixes"
               echo 'type=develop' >> $GITHUB_OUTPUT
            fi
          elif [ "${{ format('{0}', contains(github.ref, 'app-build')) }}" = "true" ] ; then
            echo 'variants=["release"]' >> $GITHUB_OUTPUT
            if [ "${{ format('{0}', contains(github.ref, 'as-release')) }}" = "true" ] ; then
               echo "release as-release builds for app-build + as-release suffixes"
               echo 'type=as-release' >> $GITHUB_OUTPUT
            else
               echo "release develop builds for app-build suffixes"
               echo 'type=develop' >> $GITHUB_OUTPUT
            fi
          elif [ "${{ format('{0}', contains(github.ref, 'app-build-both')) }}" = "true" ] ; then

            echo 'variants=["release", "internal-release"]' >> $GITHUB_OUTPUT
            if [ "${{ format('{0}', contains(github.ref, 'as-release')) }}" = "true" ] ; then
               echo "Both as-release builds for app-build-both + as-release suffixes"
               echo 'type=as-release' >> $GITHUB_OUTPUT
            else
               echo "Both develop builds for app-build-both + as-release suffixes"
               echo 'type=develop' >> $GITHUB_OUTPUT
            fi
          else
            echo "No build for ref ${{github.ref}} and event ${{github.event_type}}"
            echo 'variants=[]' >> $GITHUB_OUTPUT
            echo 'type=develop' >> $GITHUB_OUTPUT
          fi

      - name: set summary
        run: |
          echo 'Type: ${{steps.determine-build-type.outputs.type}} Variants: ${{steps.determine-build-type.outputs.variants}}' >> $GITHUB_STEP_SUMMARY

  build-app:
    needs: [determine-build-type]
    if: needs.determine-build-type.outputs.variants != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-2022', 'ubuntu-22.04', 'macos-latest']
        variant: ${{fromJSON(needs.determine-build-type.outputs.variants)}}

    runs-on: ${{ matrix.os }}
    name: 'Build ${{matrix.variant}} desktop app on ${{matrix.os}}'
    steps:
      - name: 'Get project name for variant'
        id: project
        shell: bash
        run: |
          if [ "${{matrix.variant}}" = "release" ] ; then
             echo "Configuring project, bucket, and folder for robot-stack"
             echo "project=robot-stack" >> $GITHUB_OUTPUT
             echo "bucket=${{env._APP_DEPLOY_BUCKET_ROBOTSTACK}}" >> $GITHUB_OUTPUT
             echo "folder=${{env._APP_DEPLOY_FOLDER_ROBOTSTACK}}" >> $GITHUB_OUTPUT
          else
             echo "Configuring project, bucket, and folder for robot-stack-internal"
             echo "project=robot-stack-internal" >> $GITHUB_OUTPUT
             echo "bucket=${{env._APP_DEPLOY_BUCKET_OT3}}" >> $GITHUB_OUTPUT
             echo "folder=${{env._APP_DEPLOY_FOLDER_OT3}}" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/js/setup
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.12'
      - name: check make version
        run: make --version
      # Do the frontend dist bundle
      - name: 'bundle ${{matrix.variant}} frontend'
        env:
          OT_OT2_APP_MIXPANEL_ID: ${{ secrets.OT_OT2_APP_MIXPANEL_ID }}
          OT_OT2_APP_INTERCOM_ID: ${{ secrets.OT_OT2_APP_INTERCOM_ID }}
          OPENTRONS_PROJECT: ${{ steps.project.outputs.project }}
          OT_BUILD_TARGET: desktop
          OT_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          OT_SENTRY_DSN: secrets.OT_DESKTOP_SENTRY_DSN
        run: |
          make -C app dist

      # build the desktop app and deploy it
      - name: 'build ${{matrix.variant}} app for ${{ matrix.os }}'
        timeout-minutes: 60
        env:
          OT_OT2_APP_MIXPANEL_ID: ${{ secrets.OT_OT2_APP_MIXPANEL_ID }}
          OT_OT2_APP_INTERCOM_ID: ${{ secrets.OT_OT2_APP_INTERCOM_ID }}
          WINDOWS_SIGN: ${{ format('{0}', contains(needs.determine-build-type.outputs.type, 'release')) }}
          AZURE_TENANT_ID: ${{secrets.AZURE_TENANT_ID}}
          AZURE_CLIENT_ID: ${{secrets.AZURE_CLIENT_ID}}
          AZURE_CLIENT_SECRET: ${{secrets.AZURE_CLIENT_SECRET}}
          CSC_LINK: ${{ secrets.OT_APP_CSC_MACOS_V2 }}
          CSC_KEY_PASSWORD: ${{ secrets.OT_APP_CSC_KEY_MACOS_V2 }}
          APPLE_ID: ${{ secrets.OT_APP_APPLE_ID_V2 }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.OT_APP_APPLE_ID_PASSWORD_V2 }}
          APPLE_TEAM_ID: ${{ secrets.OT_APP_APPLE_TEAM_ID_V2 }}
          HOST_PYTHON: python
          OPENTRONS_PROJECT: ${{ steps.project.outputs.project }}
          OT_OT2_APP_DEPLOY_BUCKET: ${{ steps.project.outputs.bucket }}
          OT_OT2_APP_DEPLOY_FOLDER: ${{ steps.project.outputs.folder }}
          OT_BUILD_TARGET: desktop
          OT_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          OT_SENTRY_DSN: ${{ secrets.OT_DESKTOP_SENTRY_DSN }}
        run: |
          make -C app-shell dist-${{ matrix.os }} USE_HARD_LINKS=false

      - name: 'upload github artifact'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 'opentrons-${{matrix.variant}}-${{ matrix.os }}'
          path: app-shell/dist/publish

  deploy-release-app:
    name: 'Deploy built app artifacts to S3'
    runs-on: 'ubuntu-22.04'
    needs:
      ['js-unit-test', 'backend-unit-test', 'build-app', 'determine-build-type']
    if: contains(fromJSON(needs.determine-build-type.outputs.variants), 'release') || contains(fromJSON(needs.determine-build-type.outputs.variants), 'internal-release')
    permissions:
      # GH release creation
      contents: write
      # OIDC token creation
      id-token: write
    steps:
      - name: 'download run app builds'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ./artifacts
      - name: 'separate release and internal-release artifacts'
        run: |
          for variant in release internal-release ; do
              mkdir to_upload_${variant}
              variant_pattern="./artifacts/opentrons-${variant}-*"
              ls ${variant_pattern}/ 2>/dev/null 1>/dev/null || continue
              echo "Moving ${variant} builds ${variant_pattern}/* to to_upload_${variant}"
              cp ${variant_pattern}/* ./to_upload_${variant}/
              echo "Moved $(ls ./to_upload_${variant})"
          done
      - name: 'configure s3 deploy creds for release'
        if: contains(fromJSON(needs.determine-build-type.outputs.variants), 'release')
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN_RELEASE }}
          aws-region: us-east-1
      - name: 'deploy release builds to s3'
        if: contains(fromJSON(needs.determine-build-type.outputs.variants), 'release')
        run: |
          aws s3 sync --acl=public-read to_upload_release/ s3://${{ env._APP_DEPLOY_BUCKET_ROBOTSTACK }}/${{ env._APP_DEPLOY_FOLDER_ROBOTSTACK }}
      - name: 'configure s3 deploy creds for internal-release'
        if: contains(fromJSON(needs.determine-build-type.outputs.variants), 'internal-release')
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN_INTERNAL_RELEASE }}
          aws-region: us-east-1
      - name: 'deploy internal-release release builds to s3'
        if: contains(fromJSON(needs.determine-build-type.outputs.variants), 'internal-release')
        run: |
          aws s3 sync --acl=public-read to_upload_internal-release/ s3://${{ env._APP_DEPLOY_BUCKET_OT3 }}/${{ env._APP_DEPLOY_FOLDER_OT3 }}
      - name: 'upload windows artifacts to GH release'
        uses: 'ncipollo/release-action@a2e71bdd4e7dab70ca26a852f29600c98b33153e' # v1.12.0
        if: needs.determine-build-type.outputs.type == 'release'
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          artifacts: ./artifacts/*/*.exe
          artifactContentType: application/vnd.microsoft.portable-executable
      - name: 'upload macos artifacts to GH release'
        uses: 'ncipollo/release-action@a2e71bdd4e7dab70ca26a852f29600c98b33153e' # v1.12.0
        if: needs.determine-build-type.outputs.type == 'release'
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          artifacts: ./artifacts/*/*.dmg
          artifactContentType: application/octet-stream
      - name: 'upload linux artifacts to GH release'
        uses: 'ncipollo/release-action@a2e71bdd4e7dab70ca26a852f29600c98b33153e' # v1.12.0
        if: needs.determine-build-type.outputs.type == 'release'
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          artifacts: ./artifacts/*/*.AppImage
          artifactContentType: application/octet-stream
      - name: 'detect build data for notification'
        id: names
        shell: bash
        run: |
          for variant in release internal-release ; do
              dir=./to_upload_${variant}
              echo "Checking for ${variant} builds in ${dir}"
              _windows_path=$(find "${dir}" -maxdepth 1 -name 'Opentrons*.exe' -print -quit)
              if [[ -z "${_windows_path}" ]]; then
                  continue
              fi
              _windows_build=$(basename "${_windows_path}")
              _mac_build=$(basename "$(find "${dir}" -maxdepth 1 -name 'Opentrons*.dmg' -print -quit)")
              _linux_build=$(basename "$(find "${dir}" -maxdepth 1 -name 'Opentrons*.AppImage' -print -quit)")
              echo "windows-${variant}=${_windows_build}">>$GITHUB_OUTPUT
              echo "mac-${variant}=${_mac_build}">>$GITHUB_OUTPUT
              echo "linux-${variant}=${_linux_build}">>$GITHUB_OUTPUT
          done
      - name: 'slack notify internal-release'
        uses: slackapi/slack-github-action@d09f6a279ff492756a31df59952ee6dce8c9b772 # v1.14.0
        if: contains(fromJSON(needs.determine-build-type.outputs.variants), 'internal-release')
        continue-on-error: true
        with:
          payload: '{"branch_or_tag":"${{ github.ref_name }}","build_type":"${{ needs.determine-build-type.outputs.type }}", "gh_linkback":"https://github.com/Opentrons/opentrons-ot2/tree/${{ github.ref_name }}", "windows_build":"${{ env._ACCESS_URL }}/${{steps.names.outputs.windows-internal-release}}", "mac_build":"${{ env._ACCESS_URL }}/${{steps.names.outputs.mac-internal-release}}", "linux_build":"${{ env._ACCESS_URL }}/${{steps.names.outputs.linux-internal-release}}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.OT_OT2_APP_OT3_SLACK_NOTIFICATION_WEBHOOK_URL }}
          _ACCESS_URL: https://${{env._APP_DEPLOY_BUCKET_OT3}}/${{env._APP_DEPLOY_FOLDER_OT3}}
      - name: 'slack notify release'
        uses: slackapi/slack-github-action@d09f6a279ff492756a31df59952ee6dce8c9b772 # v1.14.0
        if: contains(fromJSON(needs.determine-build-type.outputs.variants), 'release')
        continue-on-error: true
        with:
          payload: '{"branch_or_tag":"${{ github.ref_name }}","build_type":"${{ needs.determine-build-type.outputs.type }}", "gh_linkback":"https://github.com/Opentrons/opentrons-ot2/tree/${{ github.ref_name }}", "windows_build":"${{ env._ACCESS_URL }}/${{steps.names.outputs.windows-release}}", "mac_build":"${{ env._ACCESS_URL }}/${{steps.names.outputs.mac-release}}", "linux_build":"${{ env._ACCESS_URL }}/${{steps.names.outputs.linux-release}}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.OT_OT2_APP_ROBOTSTACK_SLACK_NOTIFICATION_WEBHOOK_URL }}
          _ACCESS_URL: https://${{env._APP_DEPLOY_BUCKET_ROBOTSTACK}}/${{env._APP_DEPLOY_FOLDER_ROBOTSTACK}}

      - name: 'backup upload folders before checkout'
        run: |
          # Move upload folders to temp location to preserve them during checkout
          mkdir -p ${{ runner.temp }}/upload_backup
          mv to_upload_* ${{ runner.temp }}/upload_backup/ 2>/dev/null || true
      - name: 'pull repo for scripts'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: 'restore upload folders after checkout'
        run: |
          # Restore upload folders from temp location
          mv ${{ runner.temp }}/upload_backup/to_upload_* ./ 2>/dev/null || true
      - uses: ./.github/actions/js/setup
      - name: 'print upload folders contents'
        run: |
          echo "Test Outputs"
          echo "Contents of to_upload_internal-release: $(ls -l ./to_upload_internal-release)"
          echo "Contents of to_upload_release: $(ls -l ./to_upload_release)"
      - name: 'update internal-releases releases.json'
        if: needs.determine-build-type.outputs.type == 'release' && contains(fromJSON(needs.determine-build-type.outputs.variants), 'internal-release')
        run: |
          aws s3 cp s3://${{ env._APP_DEPLOY_BUCKET_OT3 }}/${{ env._APP_DEPLOY_FOLDER_OT3 }}/releases.json ./to_upload_internal-release/releases.json || true
          node ./scripts/update-releases-json ./to_upload_internal-release/releases.json robot-stack-internal ./to_upload_internal-release https://ot2-development.builds.opentrons.com/app/
          aws s3 cp ./to_upload_internal-release/releases.json s3://${{ env._APP_DEPLOY_BUCKET_OT3 }}/${{ env._APP_DEPLOY_FOLDER_OT3 }}/releases.json

      - name: 'update release releases.json'
        if: needs.determine-build-type.outputs.type == 'release' && contains(fromJSON(needs.determine-build-type.outputs.variants), 'release')
        run: |
          aws s3 cp s3://${{ env._APP_DEPLOY_BUCKET_ROBOTSTACK }}/${{ env._APP_DEPLOY_FOLDER_ROBOTSTACK }}/releases.json ./to_upload_release/releases.json || true
          node ./scripts/update-releases-json ./to_upload_release/releases.json robot-stack ./to_upload_release https://ot2.builds.opentrons.com/app/
          aws s3 cp ./to_upload_release/releases.json s3://${{ env._APP_DEPLOY_BUCKET_ROBOTSTACK }}/${{ env._APP_DEPLOY_FOLDER_ROBOTSTACK }}/releases.json

  # Notification jobs for tagged builds
  notify-success:
    name: 'Notify Build Success'
    runs-on: 'ubuntu-latest'
    needs:
      [
        js-unit-test,
        backend-unit-test,
        build-app,
        deploy-release-app,
        determine-build-type,
      ]
    if: always() && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/internal')) && needs.js-unit-test.result == 'success' && needs.backend-unit-test.result == 'success' && needs.build-app.result == 'success' && needs.deploy-release-app.result == 'success'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: 'Send success alert'
        uses: ./.github/actions/simple-build-alert
        continue-on-error: true
        with:
          status: 'success'
          workflow_name: 'App test, build, and deploy'
          webhook_url: ${{ secrets.OT_OT2_APP_RELEASE_SLACK_NOTIFICATION_WEBHOOK_URL }}

  notify-failure:
    name: 'Notify Build Failure'
    runs-on: 'ubuntu-latest'
    needs:
      [
        js-unit-test,
        backend-unit-test,
        build-app,
        deploy-release-app,
        determine-build-type,
      ]
    if: always() && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/internal')) && (needs.js-unit-test.result == 'failure' || needs.backend-unit-test.result == 'failure' || needs.build-app.result == 'failure' || needs.deploy-release-app.result == 'failure')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: 'Determine failed jobs'
        id: failed-jobs
        shell: bash
        run: |
          failed_jobs=()
          if [[ "${{ needs.js-unit-test.result }}" == "failure" ]]; then
            failed_jobs+=("js-unit-test")
          fi
          if [[ "${{ needs.backend-unit-test.result }}" == "failure" ]]; then
            failed_jobs+=("backend-unit-test")
          fi
          if [[ "${{ needs.build-app.result }}" == "failure" ]]; then
            failed_jobs+=("build-app")
          fi
          if [[ "${{ needs.deploy-release-app.result }}" == "failure" ]]; then
            failed_jobs+=("deploy-release-app")
          fi

          IFS=','
          echo "failed_jobs=${failed_jobs[*]}" >> $GITHUB_OUTPUT

      - name: 'Send failure alert'
        uses: ./.github/actions/simple-build-alert
        continue-on-error: true
        with:
          status: 'failure'
          workflow_name: 'App test, build, and deploy'
          failed_jobs: ${{ steps.failed-jobs.outputs.failed_jobs }}
          webhook_url: ${{ secrets.OT_OT2_APP_RELEASE_SLACK_NOTIFICATION_WEBHOOK_URL }}

  notify-cancelled:
    name: 'Notify Build Cancelled'
    runs-on: 'ubuntu-latest'
    needs:
      [
        js-unit-test,
        backend-unit-test,
        build-app,
        deploy-release-app,
        determine-build-type,
      ]
    if: always() && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/internal')) && (needs.js-unit-test.result == 'cancelled' || needs.backend-unit-test.result == 'cancelled' || needs.build-app.result == 'cancelled' || needs.deploy-release-app.result == 'cancelled')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: 'Send cancelled alert'
        uses: ./.github/actions/simple-build-alert
        continue-on-error: true
        with:
          status: 'cancelled'
          workflow_name: 'App test, build, and deploy'
          webhook_url: ${{ secrets.OT_OT2_APP_RELEASE_SLACK_NOTIFICATION_WEBHOOK_URL }}
