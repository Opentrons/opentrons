name: 'Test OIDC Token Generation'

on:
  workflow_dispatch:  # Manual trigger only

permissions:
  id-token: write
  contents: read

jobs:
  test-oidc:
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Generate OIDC token'
        run: |
          echo "Testing OIDC token generation..."
          
          # Request OIDC token
          TOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                       "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi" | jq -r .value)
          
          echo "OIDC Token (first 50 chars): ${TOKEN:0:50}..."
          
          # Test token with PyPI API
          echo "Testing token with PyPI API..."
          curl -H "Authorization: Bearer $TOKEN" \
               "https://upload.pypi.org/legacy/" \
               -v || echo "Expected to fail - this is just testing token format"
