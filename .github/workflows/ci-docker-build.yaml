name: Build CI Docker image

on:
  push:
    branches:
      - edge
      - ci-docker/**
      - chore_release*
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/opentrons/ci-bootstrap

jobs:
  build:
    name: Build and push container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Determine source ref
        id: source
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: make -C ci-docker determine-source-ref

      - name: Align repository to computed ref
        run: |
          ref='${{ steps.source.outputs.ref }}'
          name='${{ steps.source.outputs.ref_name }}'
          if [[ "$ref" == refs/heads/* ]]; then
            git checkout "$name"
          else
            git checkout "$ref"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci-docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OPENTRONS_DEFAULT_REF=${{ steps.source.outputs.ref_name }}

      - name: Publish build summary
        run: |
          echo "Built image: ${{ env.IMAGE_NAME }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

          {
            echo "## CI Bootstrap Image"
            echo ""
            echo "- Image: `${{ env.IMAGE_NAME }}`"
            echo "- Digest: `${{ steps.build.outputs.digest }}`"
            echo "- Tags:"
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              echo "  - \`${tag}\`"
            done <<< "${{ steps.meta.outputs.tags }}"
          } >> "$GITHUB_STEP_SUMMARY"
