name: Build CI Docker image

on:
  pull_request:
    paths:
      - "ci-docker/**"
      - ".github/workflows/ci-docker-build.yaml"
      - "**/Pipfile"
      - "**/Pipfile.lock"
      - "**/package.json"
      - "**/yarn.lock"
  push:
    branches:
      - "ci-docker/init" # TODO remove before merging to edge
      - edge
      - chore_release*
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/opentrons/ci-bootstrap

jobs:
  build:
    name: Build and push container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Determine source ref
        id: source
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: make -C ci-docker determine-source-ref

      - name: Align repository to this workflow run's commit
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Use SHA for pull requests (merge commit)
            git fetch origin ${{ github.sha }}
            git checkout ${{ github.sha }}
          else
            # Use ref for push events (actual branch tip)
            BRANCH_NAME="${{ github.ref_name }}"
            git fetch origin "$BRANCH_NAME"
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            # TODO: Remove this temporary tag when merging to edge
            type=raw,value=branch-ci-docker-init,enable=${{ github.ref_name == 'ci-docker/init' }}
            type=raw,value=branch-{{branch}},enable=${{ startsWith(github.ref_name, 'chore_release') }}
            type=sha

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci-docker/Dockerfile
          # We are only pushing from edge and chore_release* branch pushes
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OPENTRONS_DEFAULT_REF=${{ steps.source.outputs.ref_name }}

      - name: Publish build summary
        run: |
          echo "Built image: ${{ env.IMAGE_NAME }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

          {
            echo "## CI Bootstrap Image"
            echo ""
            echo "- Image: `${{ env.IMAGE_NAME }}`"
            echo "- Digest: `${{ steps.build.outputs.digest }}`"
            echo "- Tags:"
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              echo "  - \`${tag}\`"
            done <<< "${{ steps.meta.outputs.tags }}"
          } >> "$GITHUB_STEP_SUMMARY"
