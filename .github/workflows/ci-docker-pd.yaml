name: PD Checks (CI Docker)

on:
  pull_request:
    paths:
      - 'protocol-designer/**'
      - 'step-generation/**'
      - 'shared-data/**'
      - 'components/**'
      - 'Makefile'
      - 'package.json'
      - 'scripts/**.mk'
      - 'scripts/**.py'
      - '.github/workflows/ci-docker-pd.yaml'
      - '.github/workflows/utils.js'
  push:
    branches:
      - edge
      - chore_release*
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select-image:
    name: Determine container tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout utilities
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 1
          sparse-checkout: |
            ci-docker

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Determine container tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_TAG: ci-docker-init
          RELEASE_PREFIX: chore_release
        working-directory: ci-docker
        run: make determine-container-tag

  lint:
    name: PD lint (CI Docker)
    needs: select-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      OT_REPO_CACHE: /opt/opentrons
      HOME: /home/ci
    container:
      image: ghcr.io/opentrons/ci-bootstrap:${{ needs.select-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init
    steps:
      - name: Confirm container tag
        run: echo "Using image ghcr.io/opentrons/ci-bootstrap:${{ needs.select-image.outputs.tag }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore warmed dependencies
        run: |
          if [ -d "$OT_REPO_CACHE/node_modules" ]; then
            cp -a "$OT_REPO_CACHE/node_modules" .
          fi
          find "$OT_REPO_CACHE" -maxdepth 2 -type d -name '.venv' -o -name 'node_modules' | while read dir; do
            project=$(dirname "$dir" | xargs basename)
            if [ -d "$project" ] && [ -d "$dir" ]; then
              cp -a "$dir" "$project/"
            fi
          done

      - name: Restore dependency checksums
        run: |
          if [ -f "$OT_REPO_CACHE/.ci-dependency-checksums.json" ]; then
            cp "$OT_REPO_CACHE/.ci-dependency-checksums.json" .ci-dependency-checksums.json
          fi

      - name: Check dependency drift
        id: deps
        working-directory: ci-docker
        run: make check-dependency-drift

      - name: Refresh dependencies when manifests change
        if: steps.deps.outputs.dependencies_changed == 'true'
        run: |
          make teardown
          make setup
          make -C ci-docker dependency-checksums OUTPUT=".ci-dependency-checksums.json" TITLE="Updated Dependency Checksums"

      - name: Run lint
        run: make -C protocol-designer lint

      - name: Summarize lint
        if: always()
        env:
          DEPENDENCIES_CHANGED: ${{ steps.deps.outputs.dependencies_changed || 'false' }}
        run: |
          echo "## PD Lint (CI Docker)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image tag: \`${{ needs.select-image.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Outcome: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DEPENDENCIES_CHANGED" = "true" ]; then
            echo "- Dependencies refreshed: ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Dependencies refreshed: ❌" >> "$GITHUB_STEP_SUMMARY"
          fi

  pd-tests:
    name: PD unit tests (CI Docker)
    needs: select-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      OT_REPO_CACHE: /opt/opentrons
      HOME: /home/ci
    container:
      image: ghcr.io/opentrons/ci-bootstrap:${{ needs.select-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init
    steps:
      - name: Confirm container tag
        run: echo "Using image ghcr.io/opentrons/ci-bootstrap:${{ needs.select-image.outputs.tag }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore warmed dependencies
        run: |
          if [ -d "$OT_REPO_CACHE/node_modules" ]; then
            cp -a "$OT_REPO_CACHE/node_modules" .
          fi
          find "$OT_REPO_CACHE" -maxdepth 2 -type d -name '.venv' -o -name 'node_modules' | while read dir; do
            project=$(dirname "$dir" | xargs basename)
            if [ -d "$project" ] && [ -d "$dir" ]; then
              cp -a "$dir" "$project/"
            fi
          done

      - name: Restore dependency checksums
        run: |
          if [ -f "$OT_REPO_CACHE/.ci-dependency-checksums.json" ]; then
            cp "$OT_REPO_CACHE/.ci-dependency-checksums.json" .ci-dependency-checksums.json
          fi

      - name: Check dependency drift
        id: deps
        working-directory: ci-docker
        run: make check-dependency-drift

      - name: Refresh dependencies when manifests change
        if: steps.deps.outputs.dependencies_changed == 'true'
        run: |
          make teardown
          make setup
          make -C ci-docker dependency-checksums OUTPUT=".ci-dependency-checksums.json" TITLE="Updated Dependency Checksums"

      - name: Run PD unit tests
        run: make -C protocol-designer test-cov

      - name: Summarize results
        if: always()
        env:
          DEPENDENCIES_CHANGED: ${{ steps.deps.outputs.dependencies_changed || 'false' }}
        run: |
          echo "## PD Unit Tests (CI Docker)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image tag: \`${{ needs.select-image.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Outcome: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DEPENDENCIES_CHANGED" = "true" ]; then
            echo "- Dependencies refreshed: ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Dependencies refreshed: ❌" >> "$GITHUB_STEP_SUMMARY"
          fi
