name: PD Checks (CI Docker)

on:
  pull_request:
    paths:
      - "protocol-designer/**"
      - "step-generation/**"
      - "shared-data/**"
      - "components/**"
      - "Makefile"
      - "package.json"
      - "scripts/**.mk"
      - "scripts/**.py"
      - ".github/workflows/ci-docker-pd.yaml"
      - ".github/workflows/utils.js"
  push:
    branches:
      - edge
      - chore_release*
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select-image:
    name: Determine container tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout utilities
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 1
          sparse-checkout: |
            ci-docker

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Determine container tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          # TODO: Change to "edge" before merging to edge branch
          DEFAULT_TAG: branch-ci-docker-init
          RELEASE_PREFIX: chore_release
        working-directory: ci-docker
        run: make determine-container-tag

  prepare-container:
    name: Prepare container
    needs: select-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/opentrons/ci-bootstrap:${{ needs.select-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init
    steps:
      - name: Container ready
        run: echo "Container ghcr.io/opentrons/ci-bootstrap:${{ needs.select-image.outputs.tag }} is ready"

  lint:
    name: PD build (CI Docker)
    needs: [select-image, prepare-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      OT_REPO_CACHE: /opt/opentrons
      HOME: /home/ci
    container:
      image: ghcr.io/opentrons/ci-bootstrap:${{ needs.select-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init
    steps:
      - name: Confirm container tag
        run: echo "Using image ghcr.io/opentrons/ci-bootstrap:${{ needs.select-image.outputs.tag }}"

      - name: Configure Git access
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          git -C "$OT_REPO_CACHE" remote set-url origin "https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/Opentrons/opentrons.git"

      - name: Update cached repository
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          cd "$OT_REPO_CACHE"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Use SHA for pull requests (merge commit)
            git fetch --no-tags --prune origin "$TARGET_SHA" --depth=1
            git checkout --force "$TARGET_SHA"
          else
            # Use ref for push events (actual branch tip)
            git fetch --no-tags --prune origin "$BRANCH_NAME" --depth=1
            git checkout --force -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
          fi

      - name: Check dependency drift
        id: deps
        working-directory: ${{ env.OT_REPO_CACHE }}/ci-docker
        run: make check-dependency-drift

      - name: Refresh dependencies when manifests change
        if: steps.deps.outputs.dependencies_changed == 'true'
        working-directory: ${{ env.OT_REPO_CACHE }}
        run: |
          make teardown
          make setup
          make -C ci-docker dependency-checksums OUTPUT="$OT_REPO_CACHE/.ci-dependency-checksums.json" TITLE="Updated Dependency Checksums"

      - name: Run build
        working-directory: ${{ env.OT_REPO_CACHE }}
        run: make -C protocol-designer build

      - name: Summarize build
        if: always()
        env:
          DEPENDENCIES_CHANGED: ${{ steps.deps.outputs.dependencies_changed || 'false' }}
        run: |
          echo "## PD Build (CI Docker)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image tag: \`${{ needs.select-image.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Outcome: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DEPENDENCIES_CHANGED" = "true" ]; then
            echo "- Dependencies refreshed: ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Dependencies refreshed: ❌" >> "$GITHUB_STEP_SUMMARY"
          fi

  pd-tests:
    name: PD unit tests (CI Docker)
    needs: [select-image, prepare-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      OT_REPO_CACHE: /opt/opentrons
      HOME: /home/ci
    container:
      image: ghcr.io/opentrons/ci-bootstrap:${{ needs.select-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init
    steps:
      - name: Confirm container tag
        run: echo "Using image ghcr.io/opentrons/ci-bootstrap:${{ needs.select-image.outputs.tag }}"

      - name: Configure Git access
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          git -C "$OT_REPO_CACHE" remote set-url origin "https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/Opentrons/opentrons.git"

      - name: Update cached repository
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          cd "$OT_REPO_CACHE"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Use SHA for pull requests (merge commit)
            git fetch --no-tags --prune origin "$TARGET_SHA" --depth=1
            git checkout --force "$TARGET_SHA"
          else
            # Use ref for push events (actual branch tip)
            git fetch --no-tags --prune origin "$BRANCH_NAME" --depth=1
            git checkout --force -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
          fi

      - name: Check dependency drift
        id: deps
        working-directory: ${{ env.OT_REPO_CACHE }}/ci-docker
        run: make check-dependency-drift

      - name: Refresh dependencies when manifests change
        if: steps.deps.outputs.dependencies_changed == 'true'
        working-directory: ${{ env.OT_REPO_CACHE }}
        run: |
          make teardown
          make setup
          make -C ci-docker dependency-checksums OUTPUT="$OT_REPO_CACHE/.ci-dependency-checksums.json" TITLE="Updated Dependency Checksums"

      - name: Run PD unit tests
        working-directory: ${{ env.OT_REPO_CACHE }}
        run: make -C protocol-designer test-cov

      - name: Summarize results
        if: always()
        env:
          DEPENDENCIES_CHANGED: ${{ steps.deps.outputs.dependencies_changed || 'false' }}
        run: |
          echo "## PD Unit Tests (CI Docker)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image tag: \`${{ needs.select-image.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Outcome: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DEPENDENCIES_CHANGED" = "true" ]; then
            echo "- Dependencies refreshed: ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Dependencies refreshed: ❌" >> "$GITHUB_STEP_SUMMARY"
          fi
