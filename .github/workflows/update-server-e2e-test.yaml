# Update Server E2E Tests
# The e2e-testing conftest auto-starts the update-server when no
# UPDATE_SERVER_URL is set, so we just need both Python environments
# installed and let pytest handle the rest.

name: 'Update Server E2E Tests'

on:
  pull_request:
    paths:
      - 'update-server/**'
      - 'e2e-testing/tests/update/**'
      - 'e2e-testing/automation/clients/**'
      - 'e2e-testing/uv.lock'
      - 'e2e-testing/pyproject.toml'
      - 'e2e-testing/pytest.ini'
      - '.github/workflows/update-server-e2e-test.yaml'
      - '.github/actions/python/**'
      - 'Makefile'
      - 'scripts/**.mk'
      - 'scripts/**.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'

jobs:
  e2e-test:
    name: 'update-server E2E tests'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 15
    steps:
      - uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: 'actions/setup-node@v6'
        with:
          node-version: '22.22.0'

      - uses: './.github/actions/python/setup-uv'
        with:
          project: 'update-server'

      - name: 'Setup UV for E2E tests'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          cache-dependency-glob: |
            e2e-testing/uv.lock
            e2e-testing/pyproject.toml

      - name: 'Install E2E test dependencies'
        working-directory: e2e-testing
        run: make setup

      - name: 'Run update E2E tests'
        working-directory: e2e-testing
        run: make test-update

      - name: 'Upload test results'
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: update-e2e-results
          path: |
            e2e-testing/test-results/
          retention-days: 7
          if-no-files-found: warn
