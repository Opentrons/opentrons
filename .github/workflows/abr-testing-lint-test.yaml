# This workflow runs test and lint on branch pushes that touch the abr-testing
# project or its dependencies.

name: 'abr-testing lint/test'
on:
  push:
    paths: &paths
      - 'Makefile'
      - 'abr-testing/**'
      - 'scripts/**.mk'
      - 'scripts/**.py'
      - '.github/workflows/abr-testing-lint-test.yaml'
      - '.github/actions/python/**'
    branches:
      - 'edge'
    tags-ignore:
      - '**'
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref_name != 'edge' || github.run_id}}-${{ github.ref_type != 'tag' || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint-test:
    runs-on: 'windows-latest'
    steps:
      - name: Checkout opentrons repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '12'
      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.12'
      - name: Set up abr-testing project
        uses: './.github/actions/python/setup'
        with:
          project: 'abr-testing'
      - name: lint
        run: make -C abr-testing lint
      - name: test
        run: make -C abr-testing test
