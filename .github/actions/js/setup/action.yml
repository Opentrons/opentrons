name: 'Setup JS Environment'
description: >
  Composite action to fix tag handling in checkout,
  setup Node.js, install udev for USB detection, cache PNPM/NPM caches,
  and perform JS setup.

inputs: {}

runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/git/resolve-tag
    - uses: ./.github/actions/environment/complex-variables

    # must install pnpm directly before setup-node
    - name: Install pnpm
      uses: 'pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320' # v4.4.0
      with:
        version: 11.28.7

    - name: 'Setup Node'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24.22.1'
        cache: 'pnpm'
        cache-dependency-path: |
          pnpm-lock.yaml
          components-testing/pnpm-lock.yaml

    - name: 'Setup Python'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: 'Install udev for USB-detection'
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install libudev-dev

    - name: 'Setup JS'
      shell: bash
      run: make setup-js-ci
