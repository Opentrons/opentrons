name: 'Setup JS Environment'
description: >
  Composite action to fix tag handling in checkout,
  setup Node.js, install udev for USB detection, cache Yarn/NPM caches,
  and perform JS setup.

inputs: {}

runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/git/resolve-tag
    - uses: ./.github/actions/environment/complex-variables
    - name: 'Setup Node'
      uses: actions/setup-node@v4
      with:
        node-version: '22.12.0'
        cache: 'yarn'
        cache-dependency-path: |
          yarn.lock
          **/yarn.lock

    - name: 'Cache Yarn global cache'
      uses: actions/cache@v4
      with:
        path: ~/.yarn/cache
        key: yarn-cache-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          yarn-cache-${{ runner.os }}-

    - name: 'Cache Cypress binary'
      id: cache-cypress
      uses: actions/cache@v4
      with:
        path: ~/.cache/Cypress
        key: cypress-${{ runner.os }}-13.7.1-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          cypress-${{ runner.os }}-13.7.1-
          cypress-${{ runner.os }}-

    - name: 'Install udev for USB-detection'
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install libudev-dev

    - name: 'Setup JS'
      shell: bash
      run: |
        export CYPRESS_CACHE_FOLDER=~/.cache/Cypress
        export CYPRESS_INSTALL_BINARY=https://download.cypress.io/desktop/13.7.1?platform=linux&arch=x64
        echo "Cypress install binary URL: $CYPRESS_INSTALL_BINARY"
        echo "Package.json cypress version: $(grep '"cypress"' package.json)"
        make setup-js
