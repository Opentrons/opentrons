name: 'Setup JS Environment'
description: >
  Composite action to fix tag handling in checkout,
  setup Node.js, install udev for USB detection, cache Yarn/NPM caches,
  and perform JS setup.

inputs: {}

runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/git/resolve-tag
    - uses: ./.github/actions/environment/complex-variables
    - name: 'Setup Node'
      uses: actions/setup-node@v4
      with:
        node-version: '22.12.0'
        cache: 'yarn'
        cache-dependency-path: |
          yarn.lock
          **/yarn.lock

    - name: 'Cache Yarn global cache'
      uses: actions/cache@v4
      with:
        path: ~/.yarn/cache
        key: yarn-cache-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          yarn-cache-${{ runner.os }}-

    - name: 'Cache Cypress binary'
      id: cache-cypress
      uses: actions/cache@v4
      with:
        path: ~/.cache/Cypress
        key: cypress-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          cypress-${{ runner.os }}-${{ hashFiles('package.json') }}-
          cypress-${{ runner.os }}-

    - name: 'Install udev for USB-detection'
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install libudev-dev

    - name: 'Setup JS'
      shell: bash
      run: |
        export CYPRESS_CACHE_FOLDER=~/.cache/Cypress
        CYPRESS_VERSION=$(grep '"cypress"' package.json | sed 's/.*"cypress": *"\([^"]*\)".*/\1/')
        
        # Determine platform and architecture
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          PLATFORM="linux"
          ARCH="x64"
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          PLATFORM="darwin"
          ARCH="x64"
        elif [[ "$RUNNER_OS" == "Windows" ]]; then
          PLATFORM="win32"
          ARCH="x64"
        fi
        
        # Try GitHub release first, fallback to official download
        GITHUB_RELEASE_URL="https://github.com/Opentrons/opentrons/releases/download/cypress-${CYPRESS_VERSION}/cypress-${CYPRESS_VERSION}-${PLATFORM}-${ARCH}.zip"
        OFFICIAL_URL="https://download.cypress.io/desktop/${CYPRESS_VERSION}?platform=${PLATFORM}&arch=${ARCH}"
        
        # Check if GitHub release exists, use it if available
        if curl -s --head "$GITHUB_RELEASE_URL" | head -n 1 | grep -q "200 OK"; then
          export CYPRESS_INSTALL_BINARY="$GITHUB_RELEASE_URL"
          echo "Using GitHub release: $GITHUB_RELEASE_URL"
        else
          export CYPRESS_INSTALL_BINARY="$OFFICIAL_URL"
          echo "Using official download: $OFFICIAL_URL"
        fi
        
        echo "Cypress version from package.json: $CYPRESS_VERSION"
        echo "Cypress install binary URL: $CYPRESS_INSTALL_BINARY"
        make setup-js
