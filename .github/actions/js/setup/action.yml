name: 'Setup JS Environment'
description: >
  Composite action to fix tag handling in checkout,
  setup Node.js, install udev for USB detection, cache Yarn/NPM caches,
  and perform JS setup.

inputs: {}

runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/git/resolve-tag
    - uses: ./.github/actions/environment/complex-variables
    - name: 'Setup Node'
      uses: actions/setup-node@v4
      with:
        node-version: '22.12.0'
        cache: 'yarn'
        cache-dependency-path: |
          yarn.lock
          **/yarn.lock

    - name: 'Cache package binaries'
      id: cache-packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/Cypress
          ~/.cache/electron
          ~/.cache/playwright
          ~/.cache/puppeteer
        key: packages-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          packages-${{ runner.os }}-${{ hashFiles('package.json') }}-
          packages-${{ runner.os }}-

    - name: 'Show cache status'
      shell: bash
      run: |
        echo "✅ Yarn cache handled by actions/setup-node@v4"
        
        if [[ "${{ steps.cache-packages.outputs.cache-hit }}" == "true" ]]; then
          echo "✅ Package binaries cache hit - using cached binaries"
        else
          echo "⚠️  Package binaries cache miss - will download binaries"
        fi

    - name: 'Install udev for USB-detection'
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install libudev-dev

    - name: 'Setup JS'
      shell: bash
      run: |
        # Start timing
        echo "⏱️  Starting JS setup timing..."
        start_time=$(date +%s)
        
        # Generic package caching setup
        export CYPRESS_CACHE_FOLDER=~/.cache/Cypress
        export ELECTRON_CACHE=~/.cache/electron
        
        # Determine platform and architecture
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          PLATFORM="linux"
          ARCH="x64"
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          PLATFORM="darwin"
          ARCH="x64"
        elif [[ "$RUNNER_OS" == "Windows" ]]; then
          PLATFORM="win32"
          ARCH="x64"
        fi
        
        # Automatically detect and cache packages that need binary caching
        echo "🔍 Scanning for packages that need binary caching..."
        scan_start=$(date +%s)
        
        # Find all package.json files in the project
        PACKAGE_FILES=$(find . -name "package.json" -not -path "./node_modules/*" -not -path "./.git/*")
        
        # Packages that commonly need binary caching (expandable list)
        BINARY_PACKAGES=("cypress" "electron" "playwright" "puppeteer" "chromium" "firefox" "webkit" "npm")
        
        # Check each binary package across all package.json files
        for package in "${BINARY_PACKAGES[@]}"; do
          version=""
          source_file=""
          
          # Find the version in any package.json file
          for package_file in $PACKAGE_FILES; do
            if [[ -f "$package_file" ]]; then
              found_version=$(grep "\"$package\"" "$package_file" | sed 's/.*"'$package'": *"\([^"]*\)".*/\1/' || echo "")
              if [[ -n "$found_version" ]]; then
                version="$found_version"
                source_file="$package_file"
                break
              fi
            fi
          done
          
          if [[ -n "$version" ]]; then
            echo "📦 Found $package $version in $source_file"
            
            # Set up environment variable based on package name
            env_var=$(echo "${package^^}_CACHE" | sed 's/-/_/g')
            
            # Try package-mirror first
            # Handle different naming conventions (electron uses 'v' prefix)
            if [[ "$package" == "electron" ]]; then
              mirror_url="https://github.com/Opentrons/package-mirror/releases/download/${package}-${version}/${package}-v${version}-${PLATFORM}-${ARCH}.zip"
            else
              mirror_url="https://github.com/Opentrons/package-mirror/releases/download/${package}-${version}/${package}-${version}-${PLATFORM}-${ARCH}.zip"
            fi
            
            # Use a simpler approach that's more reliable in GitHub Actions
            if curl -f -s --head "$mirror_url" >/dev/null 2>&1; then
              export $env_var="$mirror_url"
              echo "✅ Using cached $package from package-mirror"
            else
              echo "⚠️  $package not cached yet - will use official source"
            fi
          fi
        done
        
        scan_end=$(date +%s)
        scan_time=$((scan_end - scan_start))
        echo "⏱️  Package scanning took: ${scan_time}s"
        
        echo "🚀 Running yarn setup..."
        setup_start=$(date +%s)
        
        # Configure yarn for faster installs
        yarn config set network-timeout 60000
        yarn config set prefer-offline true
        yarn config set network-concurrency 1
        
        # Run yarn install (the main part we need)
        echo "⏱️  Starting yarn install..."
        yarn_start=$(date +%s)
        yarn install --frozen-lockfile
        yarn_end=$(date +%s)
        yarn_time=$((yarn_end - yarn_start))
        echo "⏱️  Yarn install took: ${yarn_time}s"
        
        # Only run app-shell setup if virtualenv exists
        if [[ -d "app-shell" ]]; then
          echo "🔍 Checking if app-shell setup is needed..."
          if [[ -d "api" && -f "api/Pipfile" ]]; then
            # Check if virtualenv exists
            if cd api && pipenv --venv >/dev/null 2>&1; then
              cd ..
              echo "✅ API virtualenv found, running app-shell setup..."
              app_shell_start=$(date +%s)
              make -C app-shell setup
              app_shell_end=$(date +%s)
              app_shell_time=$((app_shell_end - app_shell_start))
              echo "⏱️  App-shell setup took: ${app_shell_time}s"
            else
              cd ..
              echo "⚠️  No API virtualenv found, skipping app-shell setup"
            fi
          else
            echo "⚠️  No API directory found, skipping app-shell setup"
          fi
        else
          echo "⚠️  No app-shell directory found, skipping app-shell setup"
        fi
        
        # Only run app-shell-odd setup if directory exists
        if [[ -d "app-shell-odd" ]]; then
          echo "✅ Found app-shell-odd directory, running setup..."
          app_shell_odd_start=$(date +%s)
          make -C app-shell-odd setup
          app_shell_odd_end=$(date +%s)
          app_shell_odd_time=$((app_shell_odd_end - app_shell_odd_start))
          echo "⏱️  App-shell-odd setup took: ${app_shell_odd_time}s"
        else
          echo "⚠️  No app-shell-odd directory found, skipping app-shell-odd setup"
        fi
        
        setup_end=$(date +%s)
        setup_time=$((setup_end - setup_start))
        echo "⏱️  Make setup-js took: ${setup_time}s"
        
        # Final timing summary
        end_time=$(date +%s)
        total_time=$((end_time - start_time))
        echo "⏱️  Total JS setup time: ${total_time}s"
        echo "⏱️  Breakdown: scanning=${scan_time}s, yarn=${yarn_time}s, app-shell=${app_shell_time:-0}s, app-shell-odd=${app_shell_odd_time:-0}s"
