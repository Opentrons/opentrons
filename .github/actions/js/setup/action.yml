name: 'Setup JS Environment'
description: >
  Composite action to fix tag handling in checkout,
  setup Node.js, install udev for USB detection, cache Yarn/NPM caches,
  and perform JS setup.

inputs: {}

runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/git/resolve-tag
    - uses: ./.github/actions/environment/complex-variables
    - name: 'Setup Node'
      uses: actions/setup-node@v4
      with:
        node-version: '22.12.0'
        cache: 'yarn'
        cache-dependency-path: |
          yarn.lock
          **/yarn.lock

    - name: 'Cache Yarn global cache'
      uses: actions/cache@v4
      with:
        path: ~/.yarn/cache
        key: yarn-cache-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          yarn-cache-${{ runner.os }}-

    - name: 'Cache package binaries'
      id: cache-packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/Cypress
          ~/.cache/electron
          ~/.cache/playwright
          ~/.cache/puppeteer
        key: packages-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          packages-${{ runner.os }}-${{ hashFiles('package.json') }}-
          packages-${{ runner.os }}-

    - name: 'Install udev for USB-detection'
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install libudev-dev

    - name: 'Setup JS'
      shell: bash
      run: |
        # Generic package caching setup
        export CYPRESS_CACHE_FOLDER=~/.cache/Cypress
        export ELECTRON_CACHE=~/.cache/electron
        
        # Determine platform and architecture
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          PLATFORM="linux"
          ARCH="x64"
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          PLATFORM="darwin"
          ARCH="x64"
        elif [[ "$RUNNER_OS" == "Windows" ]]; then
          PLATFORM="win32"
          ARCH="x64"
        fi
        
        # Automatically detect and cache packages that need binary caching
        echo "🔍 Scanning for packages that need binary caching..."
        
        # Find all package.json files in the project
        PACKAGE_FILES=$(find . -name "package.json" -not -path "./node_modules/*" -not -path "./.git/*")
        
        # Packages that commonly need binary caching (expandable list)
        BINARY_PACKAGES=("cypress" "electron" "playwright" "puppeteer" "chromium" "firefox" "webkit" "npm")
        
        # Check each binary package across all package.json files
        for package in "${BINARY_PACKAGES[@]}"; do
          version=""
          source_file=""
          
          # Find the version in any package.json file
          for package_file in $PACKAGE_FILES; do
            if [[ -f "$package_file" ]]; then
              found_version=$(grep "\"$package\"" "$package_file" | sed 's/.*"'$package'": *"\([^"]*\)".*/\1/' || echo "")
              if [[ -n "$found_version" ]]; then
                version="$found_version"
                source_file="$package_file"
                break
              fi
            fi
          done
          
          if [[ -n "$version" ]]; then
            echo "📦 Found $package $version in $source_file"
            
            # Set up environment variable based on package name
            env_var=$(echo "${package^^}_CACHE" | sed 's/-/_/g')
            
            # Try package-mirror first
            # Handle different naming conventions (electron uses 'v' prefix)
            if [[ "$package" == "electron" ]]; then
              mirror_url="https://github.com/Opentrons/package-mirror/releases/download/${package}-${version}/${package}-v${version}-${PLATFORM}-${ARCH}.zip"
            else
              mirror_url="https://github.com/Opentrons/package-mirror/releases/download/${package}-${version}/${package}-${version}-${PLATFORM}-${ARCH}.zip"
            fi
            
            # Check if the URL exists using a more robust approach
            if curl -s --head "$mirror_url" >/dev/null 2>&1; then
              # Double-check with a more specific test
              if curl -s --head "$mirror_url" | head -n 1 | grep -qE "(200 OK|302)"; then
                export $env_var="$mirror_url"
                echo "✅ Using cached $package from package-mirror"
              else
                echo "⚠️  $package not cached yet - will use official source"
              fi
            else
              echo "⚠️  $package not cached yet - will use official source"
            fi
          fi
        done
        
        echo "🚀 Running make setup-js..."
        make setup-js
