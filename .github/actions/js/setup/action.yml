name: 'Setup JS Environment'
description: >
  Composite action to fix tag handling in checkout,
  setup Node.js, install udev for USB detection, cache Yarn/NPM caches,
  and perform JS setup.

inputs: {}

runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/git/resolve-tag
    - uses: ./.github/actions/environment/complex-variables
    - name: 'Setup Node'
      uses: actions/setup-node@v4
      with:
        node-version: '22.12.0'
        cache: 'yarn'

    - name: 'Setup Python'
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 'Cache Cypress binary'
      id: cache-cypress
      uses: actions/cache@v4
      with:
        path: ~/.cache/Cypress
        key: cypress-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

    - name: 'Install udev for USB-detection'
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install libudev-dev

    - name: 'Setup JS'
      shell: bash
      run: |
        # Set up Cypress to download from package-mirror instead of official source
        export CYPRESS_DOWNLOAD_PATH_TEMPLATE="https://github.com/Opentrons/package-mirror/releases/download/cypress-${version}/cypress-${version}-${platform}-${arch}.zip"
        
        make setup-js
