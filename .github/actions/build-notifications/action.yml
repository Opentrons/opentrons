name: 'Build Notifications'
description: >
  Sends Slack notifications for build success/failure with configurable channels
  and ownership assignment for tagged releases.

inputs:
  status:
    description: 'Build status: success, failure, or cancelled'
    required: true
  workflow_name:
    description: 'Name of the workflow that triggered this notification'
    required: true
  job_name:
    description: 'Name of the job that failed (optional for success notifications)'
    required: false
  failure_reason:
    description: 'Reason for failure (optional)'
    required: false
  build_type:
    description: 'Type of build: release, develop, as-release'
    required: true
  variants:
    description: 'JSON array of build variants: ["release", "internal-release"]'
    required: true
  tag_type:
    description: 'Type of tag that triggered the build (optional)'
    required: false
  channel_override:
    description: 'Override default channel (optional)'
    required: false
  assignee:
    description: 'Slack user ID to assign/mention (optional)'
    required: false

runs:
  using: 'composite'
  steps:
    - name: 'Determine notification channel'
      id: channel
      shell: bash
      run: |
        # Use override if provided, otherwise determine from build type and tag type
        if [[ -n "${{ inputs.channel_override }}" ]]; then
          echo "channel=${{ inputs.channel_override }}" >> $GITHUB_OUTPUT
          echo "webhook_secret=OT_APP_RELEASE_SLACK_NOTIFICATION_WEBHOOK_URL" >> $GITHUB_OUTPUT
        elif [[ "${{ inputs.build_type }}" == "release" ]]; then
          # For release builds, determine channel based on tag type
          if [[ "${{ inputs.tag_type }}" == "main-release" ]]; then
            # Main releases (v*, ot3@*) go to release cycle
            echo "channel=#release-cycle" >> $GITHUB_OUTPUT
            echo "webhook_secret=OT_APP_RELEASE_SLACK_NOTIFICATION_WEBHOOK_URL" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.tag_type }}" == "component" ]]; then
            # Component releases go to builds channel
            echo "channel=#builds" >> $GITHUB_OUTPUT
            echo "webhook_secret=OT_APP_ROBOTSTACK_SLACK_NOTIFICATION_WEBHOOK_URL" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.tag_type }}" == "ai" ]]; then
            # AI releases go to builds channel
            echo "channel=#builds" >> $GITHUB_OUTPUT
            echo "webhook_secret=OT_APP_ROBOTSTACK_SLACK_NOTIFICATION_WEBHOOK_URL" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.tag_type }}" == "docs" ]]; then
            # Documentation releases go to builds channel
            echo "channel=#builds" >> $GITHUB_OUTPUT
            echo "webhook_secret=OT_APP_ROBOTSTACK_SLACK_NOTIFICATION_WEBHOOK_URL" >> $GITHUB_OUTPUT
          else
            # Default for release builds
            echo "channel=#release-cycle" >> $GITHUB_OUTPUT
            echo "webhook_secret=OT_APP_RELEASE_SLACK_NOTIFICATION_WEBHOOK_URL" >> $GITHUB_OUTPUT
          fi
        else
          # For develop builds, use builds channel
          echo "channel=#builds" >> $GITHUB_OUTPUT
          if [[ "${{ inputs.variants }}" == *"internal-release"* ]]; then
            echo "webhook_secret=OT_APP_OT3_SLACK_NOTIFICATION_WEBHOOK_URL" >> $GITHUB_OUTPUT
          else
            echo "webhook_secret=OT_APP_ROBOTSTACK_SLACK_NOTIFICATION_WEBHOOK_URL" >> $GITHUB_OUTPUT
          fi
        fi

    - name: 'Build notification payload'
      id: payload
      shell: bash
      run: |
        # Determine emoji and color based on status
        case "${{ inputs.status }}" in
          "success")
            emoji="✅"
            color="good"
            ;;
          "failure")
            emoji="❌"
            color="danger"
            ;;
          "cancelled")
            emoji="⚠️"
            color="warning"
            ;;
          *)
            emoji="ℹ️"
            color="#36a64f"
            ;;
        esac

        # Build the main message
        if [[ "${{ inputs.status }}" == "success" ]]; then
          message="*${emoji} App Build Successful*"
        else
          message="*${emoji} App Build Failed*"
        fi

        # Add build details
        message="${message}\n• *Tag/Branch:* \`${{ github.ref_name }}\`"
        message="${message}\n• *Build Type:* \`${{ inputs.build_type }}\`"
        message="${message}\n• *Variants:* \`${{ inputs.variants }}\`"
        message="${message}\n• *Workflow:* \`${{ inputs.workflow_name }}\`"

        # Add failure details if applicable
        if [[ "${{ inputs.status }}" == "failure" && -n "${{ inputs.job_name }}" ]]; then
          message="${message}\n• *Failed Job:* \`${{ inputs.job_name }}\`"
        fi

        if [[ -n "${{ inputs.failure_reason }}" ]]; then
          message="${message}\n• *Reason:* ${{ inputs.failure_reason }}"
        fi

        # Add links
        message="${message}\n• *Workflow Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
        message="${message}\n• *Repository:* <${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}|${{ github.repository }}>"

        # Add assignee if provided
        if [[ -n "${{ inputs.assignee }}" ]]; then
          message="${message}\n• *Assigned to:* <@${{ inputs.assignee }}>"
        fi

        # Create the Slack payload
        payload=$(cat <<EOF
        {
          "channel": "${{ steps.channel.outputs.channel }}",
          "username": "GitHub Actions",
          "icon_emoji": ":robot_face:",
          "attachments": [
            {
              "color": "${color}",
              "text": "${message}",
              "footer": "GitHub Actions",
              "footer_icon": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              "ts": $(date +%s)
            }
          ]
        }
        EOF
        )

        # Escape the payload for GitHub Actions
        echo "payload<<EOF" >> $GITHUB_OUTPUT
        echo "$payload" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: 'Send Slack notification'
      uses: slackapi/slack-github-action@v1.14.0
      with:
        payload: ${{ steps.payload.outputs.payload }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets[steps.channel.outputs.webhook_secret] }}
