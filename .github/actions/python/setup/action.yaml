name: 'Python Setup'
description: 'Set up the environment to handle a monorepo python project'
inputs:
  project:
    description: 'Which project (by subdirectory) to set up'
    required: true
  python-version:
    description: "What Python version to use to create the project's virtual environment"
    required: false
    default: "false"
runs:
  using: 'composite'
  steps:
    - shell: bash
      run: |
        if [[ "${OSTYPE}" =~ "linux" ]]; then
          # WORKAROUND: Remove microsoft debian repo due to https://github.com/microsoft/linux-package-repositories/issues/130. Remove line below after it is resolved
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsystemd-dev
        fi
    - name: Set the OT_PYTHON env variable
      shell: bash
      run: echo "OT_PYTHON=$(which python)" >> $GITHUB_ENV
    - name: If provided set the OT_VIRTUALENV_VERSION env variable
      shell : bash
      if: ${{ inputs.python-version != 'false' }}
      run: echo "OT_VIRTUALENV_VERSION=${{ inputs.python-version }}" >> $GITHUB_ENV
    - shell: bash
      run: npm install --global shx@0.3.3
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ inputs.python-version != 'false' && inputs.python-version || '3.10' }}
        enable-cache: true
        cache-dependency-glob: '${{ inputs.project }}/uv.lock'
    - shell: bash
      run: |
        # Try UV first, fall back to pipenv
        if command -v uv >/dev/null 2>&1; then
          if [ -f "${{ inputs.project }}/uv.lock" ]; then
            cd ${{ inputs.project }} && uv sync --frozen
          elif [ -f "${{ inputs.project }}/pyproject.toml" ]; then
            cd ${{ inputs.project }} && uv sync --refresh
          else
            make -C ${{ inputs.project }} setup
          fi
        else
          # Fall back to pipenv
          $OT_PYTHON -m pip install --upgrade pip
          $OT_PYTHON -m pip install --user pipenv==2023.12.1
          $OT_PYTHON -m pip install --user virtualenv==20.30.0
          make -C ${{ inputs.project }} setup
        fi
