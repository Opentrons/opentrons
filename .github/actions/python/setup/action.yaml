name: 'Python Setup'
description: 'Set up the environment to handle a monorepo python project'
inputs:
  project:
    description: 'Which project (by subdirectory) to set up'
    required: true
  python-version:
    description: "What Python version to use to create the project's virtual environment"
    required: false
    default: "false"
  install-system-deps:
    description: 'Whether to install system dependencies (libsystemd-dev on Linux)'
    required: false
    default: 'true'
outputs:
  start-time:
    description: 'Start time of the setup process (Unix timestamp)'
    value: ${{ steps.setup-env.outputs.start-time }}
  linux-extra:
    description: 'Linux extra dependency flag if applicable'
    value: ${{ steps.setup-env.outputs.linux-extra }}
  duration:
    description: 'Duration of the setup process in seconds'
    value: ${{ steps.setup-env.outputs.duration }}
runs:
  using: 'composite'
  steps:
    - shell: bash
      if: inputs.install-system-deps == 'true'
      run: |
        if [[ "${OSTYPE}" =~ "linux" ]]; then
          # WORKAROUND: Remove microsoft debian repo due to https://github.com/microsoft/linux-package-repositories/issues/130. Remove line below after it is resolved
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsystemd-dev
        fi
    - shell: bash
      run: npm install --global shx@0.3.3
    - name: Install UV
      uses: ./.github/actions/python/install-uv
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version != 'false' && inputs.python-version || '3.10' }}
    - name: Cache UV packages
      uses: ./.github/actions/python/cache-uv
      with:
        lockfile-path: ${{ inputs.project }}/uv.lock
    - name: Setup Python Environment
      id: setup-env
      shell: bash
      run: |
        echo "::notice::Using UV for dependency management"
        START_TIME=$(date +%s)
        echo "start-time=$START_TIME" >> $GITHUB_OUTPUT
        # Add linux extra if on Linux and project has linux optional dependency (for systemd-python in performance-metrics)
        LINUX_EXTRA=""
        if [[ "${OSTYPE}" =~ "linux" ]] || [[ "$(uname -s)" == "Linux" ]]; then
          # Check if project has linux optional dependency defined
          if [ -f "${{ inputs.project }}/pyproject.toml" ] && grep -q '\[project.optional-dependencies\]' "${{ inputs.project }}/pyproject.toml" && grep -A 5 '\[project.optional-dependencies\]' "${{ inputs.project }}/pyproject.toml" | grep -q 'linux'; then
            LINUX_EXTRA="--extra linux"
          fi
        fi
        echo "linux-extra=$LINUX_EXTRA" >> $GITHUB_OUTPUT
        if [ -f "${{ inputs.project }}/uv.lock" ]; then
          cd ${{ inputs.project }} && uv sync --frozen --extra dev $LINUX_EXTRA
        elif [ -f "${{ inputs.project }}/pyproject.toml" ]; then
          cd ${{ inputs.project }} && uv sync --extra dev $LINUX_EXTRA
          # Verify dev dependencies are installed
          uv pip list | grep -E "(mypy|pytest|black)" || echo "Warning: Dev dependencies may not be installed"
        else
          make -C ${{ inputs.project }} setup
        fi
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - START_TIME))
        echo "duration=$DURATION" >> $GITHUB_OUTPUT
        echo "::notice::UV setup completed in ${DURATION} seconds"
