name: 'Python Setup'
description: 'Set up the environment to handle a monorepo python project'
inputs:
  project:
    description: 'Which project (by subdirectory) to set up'
    required: true
  python-version:
    description: "What Python version to use to create the project's virtual environment"
    required: false
    default: "false"
  install-system-deps:
    description: 'Whether to install system dependencies (libsystemd-dev on Linux)'
    required: false
    default: 'true'
  install-dev-deps:
    description: 'Whether to install dev optional dependencies (--extra dev)'
    required: false
    default: 'false'
outputs:
  start-time:
    description: 'Start time of the setup process (Unix timestamp)'
    value: ${{ steps.setup-env.outputs.start-time }}
  linux-extra:
    description: 'Linux extra dependency flag if applicable'
    value: ${{ steps.setup-env.outputs.linux-extra }}
  duration:
    description: 'Duration of the setup process in seconds'
    value: ${{ steps.setup-env.outputs.duration }}
runs:
  using: 'composite'
  steps:
    - shell: bash
      if: inputs.install-system-deps == 'true'
      run: |
        if [[ "${OSTYPE}" =~ "linux" ]]; then
          # WORKAROUND: Remove microsoft debian repo due to https://github.com/microsoft/linux-package-repositories/issues/130. Remove line below after it is resolved
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsystemd-dev
        fi
    - shell: bash
      run: npm install --global shx@0.3.3
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version != 'false' && inputs.python-version || '3.10' }}
    - name: Check project type
      id: project-type
      shell: bash
      run: |
        # Projects that should not use UV yet (even if they have uv.lock)
        EXCLUDE_UV_PROJECTS="docs analyses-snapshot-testing"
        # Check for UV projects: uv.lock is definitive, or pyproject.toml without Pipfile (fully migrated)
        # If both Pipfile and pyproject.toml exist, Pipfile takes precedence (not yet migrated)
        if [[ " $EXCLUDE_UV_PROJECTS " =~ " ${{ inputs.project }} " ]]; then
          # Explicitly excluded from UV, check for Pipfile
          if [ -f "${{ inputs.project }}/Pipfile" ]; then
            echo "type=pipenv" >> $GITHUB_OUTPUT
          else
            echo "type=make" >> $GITHUB_OUTPUT
          fi
        elif [ -f "${{ inputs.project }}/uv.lock" ]; then
          echo "type=uv" >> $GITHUB_OUTPUT
        elif [ -f "${{ inputs.project }}/pyproject.toml" ] && [ ! -f "${{ inputs.project }}/Pipfile" ]; then
          echo "type=uv" >> $GITHUB_OUTPUT
        elif [ -f "${{ inputs.project }}/Pipfile" ]; then
          echo "type=pipenv" >> $GITHUB_OUTPUT
        else
          echo "type=make" >> $GITHUB_OUTPUT
        fi
    - name: Install pipenv and virtualenv (original behavior - always installed)
      if: steps.project-type.outputs.type != 'uv'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install --user pipenv==2023.12.1
        python -m pip install --user virtualenv==20.30.0
    - name: Install UV
      if: steps.project-type.outputs.type == 'uv'
      uses: ./.github/actions/python/install-uv
    - name: Install UV for excluded projects (their Makefiles use uv directly)
      if: steps.project-type.outputs.type != 'uv'
      shell: bash
      run: |
        # Check if project has uv.lock (excluded projects like docs, analyses-snapshot-testing)
        if [ -f "${{ inputs.project }}/uv.lock" ]; then
          # Install uv so their Makefiles can use it
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        fi
    - name: Cache UV packages
      if: steps.project-type.outputs.type == 'uv'
      uses: ./.github/actions/python/cache-uv
      with:
        lockfile-path: ${{ inputs.project }}/uv.lock
    - name: Setup Python Environment
      id: setup-env
      shell: bash
      run: |
        START_TIME=$(date +%s)
        echo "start-time=$START_TIME" >> $GITHUB_OUTPUT
        # Check for UV projects: uv.lock is definitive, or pyproject.toml without Pipfile (fully migrated)
        if [ -f "${{ inputs.project }}/uv.lock" ]; then
          echo "::notice::Using UV for dependency management"
          # Add linux extra if on Linux and project has linux optional dependency (for systemd-python in performance-metrics)
          LINUX_EXTRA=""
          if [[ "${OSTYPE}" =~ "linux" ]] || [[ "$(uname -s)" == "Linux" ]]; then
            # Check if project has linux optional dependency defined
            if [ -f "${{ inputs.project }}/pyproject.toml" ] && grep -q '\[project.optional-dependencies\]' "${{ inputs.project }}/pyproject.toml" && grep -A 5 '\[project.optional-dependencies\]' "${{ inputs.project }}/pyproject.toml" | grep -q 'linux'; then
              LINUX_EXTRA="--extra linux"
            fi
          fi
          echo "linux-extra=$LINUX_EXTRA" >> $GITHUB_OUTPUT
          # Migrated projects with uv.lock use uv
          # Add dev extra if requested
          DEV_EXTRA=""
          if [ "${{ inputs.install-dev-deps }}" == "true" ]; then
            DEV_EXTRA="--extra dev"
          fi
          cd ${{ inputs.project }} && uv sync --frozen $DEV_EXTRA $LINUX_EXTRA
        elif [ -f "${{ inputs.project }}/pyproject.toml" ]; then
          echo "::notice::Using UV for dependency management"
          # Add linux extra if on Linux and project has linux optional dependency (for systemd-python in performance-metrics)
          LINUX_EXTRA=""
          if [[ "${OSTYPE}" =~ "linux" ]] || [[ "$(uname -s)" == "Linux" ]]; then
            # Check if project has linux optional dependency defined
            if [ -f "${{ inputs.project }}/pyproject.toml" ] && grep -q '\[project.optional-dependencies\]' "${{ inputs.project }}/pyproject.toml" && grep -A 5 '\[project.optional-dependencies\]' "${{ inputs.project }}/pyproject.toml" | grep -q 'linux'; then
              LINUX_EXTRA="--extra linux"
            fi
          fi
          echo "linux-extra=$LINUX_EXTRA" >> $GITHUB_OUTPUT
          # Migrated projects with pyproject.toml (but no Pipfile) use uv
          # Add dev extra if requested
          DEV_EXTRA=""
          if [ "${{ inputs.install-dev-deps }}" == "true" ]; then
            DEV_EXTRA="--extra dev"
          fi
          cd ${{ inputs.project }} && uv sync $DEV_EXTRA $LINUX_EXTRA
          # Verify dev dependencies are installed if dev extra was used
          if [ -n "$DEV_EXTRA" ]; then
            uv pip list | grep -E "(mypy|pytest|black)" || echo "Warning: Dev dependencies may not be installed"
          fi
        elif [ -f "${{ inputs.project }}/pyproject.toml" ] && [ ! -f "${{ inputs.project }}/Pipfile" ]; then
          echo "::notice::Using UV for dependency management"
          # Add linux extra if on Linux and project has linux optional dependency (for systemd-python in performance-metrics)
          LINUX_EXTRA=""
          if [[ "${OSTYPE}" =~ "linux" ]] || [[ "$(uname -s)" == "Linux" ]]; then
            # Check if project has linux optional dependency defined
            if [ -f "${{ inputs.project }}/pyproject.toml" ] && grep -q '\[project.optional-dependencies\]' "${{ inputs.project }}/pyproject.toml" && grep -A 5 '\[project.optional-dependencies\]' "${{ inputs.project }}/pyproject.toml" | grep -q 'linux'; then
              LINUX_EXTRA="--extra linux"
            fi
          fi
          echo "linux-extra=$LINUX_EXTRA" >> $GITHUB_OUTPUT
          # Migrated projects with pyproject.toml (but no Pipfile) use uv
          # Add dev extra if requested
          DEV_EXTRA=""
          if [ "${{ inputs.install-dev-deps }}" == "true" ]; then
            DEV_EXTRA="--extra dev"
          fi
          cd ${{ inputs.project }} && uv sync $DEV_EXTRA $LINUX_EXTRA
          # Verify dev dependencies are installed if dev extra was used
          if [ -n "$DEV_EXTRA" ]; then
            uv pip list | grep -E "(mypy|pytest|black)" || echo "Warning: Dev dependencies may not be installed"
          fi
        elif [ -f "${{ inputs.project }}/Pipfile" ]; then
          # Original behavior: just call make setup (pipenv already installed above)
          make -C ${{ inputs.project }} setup
        else
          # Fall back to make setup for projects with no Pipfile, uv.lock, or pyproject.toml
          make -C ${{ inputs.project }} setup
        fi
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - START_TIME))
        echo "duration=$DURATION" >> $GITHUB_OUTPUT
        echo "::notice::Setup completed in ${DURATION} seconds"
