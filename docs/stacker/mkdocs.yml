site_name: stacker

theme:
  name: material
  palette:
    primary: custom
    accent: custom
  icon:
    admonition:
      tip: material/lightbulb-on-outline
  favicon: images/favicon.png
  logo: assets/logo.png

markdown_extensions:
  - md_in_html
  - toc:
      permalink: true
      title: Table of Contents
      toc_depth: 3
  - admonition
  - abbr
  - pymdownx.blocks.caption
  - attr_list
  - sane_lists

nav:
  - Opentrons Flex Stacker Instruction Manual: index.md
  - Safety and Compliance: compliance.md
  - Product Specifications: product-specs.md
  - Pre-installation Information: pre-installation.md
  - Installing the Stacker: installation.md
  - Post-installation Procedures: post-installation.md
  - Loading Labware: loading-labware.md
  - Maintenance and Cleaning: maintenance.md
  - Additional Product Information: additional-info.md

plugins:
  - search
  - autorefs
  - parent-css
  - print-site:
      exclude:
        - index.md
      add_cover_page: true
      cover_page_template: "docs/cover.tpl"
      include_css: false
      enumerate_headings: false

extra_css:
  - ../shared/instruction-manuals.css
  - ../shared/opentrons-theme.css
  - ../shared/print-pdf.css
