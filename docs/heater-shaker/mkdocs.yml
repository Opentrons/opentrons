site_name: heater-shaker

nav:
  - Heater-Shaker Module GEN1 Instruction Manual: index.md
  - Safety Information and Regulatory Compliance: compliance.md
  - Product Specifications: product-specs.md
  - Thermal Adapters: adapters.md
  - Installing the Heater-Shaker:
      - Before You Begin: pre-installation.md
      - Flex Attachment Steps: installation-flex.md
      - OT-2 Attachment Steps: installation-ot2.md
  - Software Control: software.md
  - Maintenance and Cleaning: maintenance.md
  - Heater-Shaker G-Codes:
      - Heater-Shaker G-Code Concepts: g-code-concepts.md
      - Heater-Shaker G-Codes: g-codes.md
      - Heater-Shaker Error Codes: error-codes.md
  - Additional Product Information: additional-info.md

theme:
  name: material
  palette:
    primary: custom
    accent: custom
  logo: images/opentrons-droplet-white.svg
  favicon: images/opentrons-droplet-color.svg
  icon:
    admonition:
      tip: material/lightbulb-on-outline

plugins:
  - search
  - autorefs
  - parent-css
  - print-site:
      exclude:
        - index.md
      add_cover_page: true
      cover_page_template: "docs/cover.tpl"
      include_css: false
      enumerate_headings: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: true
      pygments_lang_class: true
  - pymdownx.superfences
  - sane_lists
  - toc:
      permalink: true
      title: Table of Contents

extra_css:
  - ../shared/instruction-manuals.css
  - ../shared/opentrons-theme.css
  - ../shared/print-pdf.css

copyright: '© Opentrons 2025. All rights reserved. <br /> Trademarks: Opentrons®, Opentrons drop logo (Opentrons Labworks, Inc.). <br /> Registered names, trademarks, etc. used in this document, even when not specifically marked as such, are not to be considered unprotected by law.'