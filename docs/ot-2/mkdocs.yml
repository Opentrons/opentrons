  - Advanced Operations:
     - Downloading OT-2 Log Files: advanced-operation/log-files.md
     - Command Line Operation Over SSH: advanced-operation/ssh.md
  - Maintenance:
      - Maintenance: maintenance/index.md
      - Cleaning: maintenance/cleaning.md
      - Services: maintenance/services.md
  - Appendices:
      - Additional Documentation: additional-docs.md
      # - Open-Source Software: open-source.md
      - Product Support and Company Information: support.md

theme:
  name: material
  palette:
    primary: custom
    accent: custom
  logo: images/opentrons-droplet-white.svg
  favicon: images/opentrons-droplet-color.svg
  icon:
    admonition:
      tip: material/lightbulb-on-outline

plugins:
  - search
  - autorefs
  - parent-css
  - print-site:
      exclude:
        - index.md
      add_cover_page: true
      cover_page_template: "docs/cover.tpl"
      include_css: false
      enumerate_headings: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: true
      pygments_lang_class: true
  - pymdownx.superfences
  - sane_lists
  - toc:
      permalink: true
      title: Table of Contents

extra_css:
  - ../shared/instruction-manuals.css
  - ../shared/opentrons-theme.css
  - ../shared/print-pdf.css

copyright: '© Opentrons 2026. All rights reserved. <br /> Trademarks: Opentrons®, Opentrons drop logo (Opentrons Labworks, Inc.). <br /> Registered names, trademarks, etc. used in this document, even when not specifically marked as such, are not to be considered unprotected by law.'
