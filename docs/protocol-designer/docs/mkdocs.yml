site_name: Protocol Designer Instruction Manual

theme:
  name: material
  palette:
    primary: custom
    accent: custom
  favicon: site-assets/favicon.png
  logo: site-assets/logo.png

extra_css:
  - stylesheets/style.css

markdown_extensions:
  - toc:
      permalink: true # headers generate permalinks
      title: Page Contents # right side TOC title
  - admonition # call-outs
  - abbr # tooltip
  - pymdownx.blocks.caption # image captions
  - md_in_html # combining MD and HTML
  - attr_list # grids (for parts lists)
  - pymdownx.blocks.caption ## add captions to images?

plugins:
  - glightbox # for zoom functionality on images

copyright: Copyright © OPENTRONS, 2025

nav:
  - index.md
  - About Protocol Designer: about-pd.md 
  - Create a protocol:
      - Robot and instruments: robot-instruments.md
      - Modules and fixtures: modules-fixtures.md
      - Protocol metadata and overview: overview.md
  - Protocol starting deck: starting-deck.md 
  - Protocol steps:
      - Transfer steps: transfer-steps.md
      - Mix steps: mix-steps.md
      - Move steps: move-steps.md
      - Module steps: module-steps.md 
      - Magnet steps: magnet-steps.md
      - Pause steps: pause-steps.md
  - Editing steps: editing-steps.md
  - Warnings and errors: warnings-errors.md
  - Export a protocol: export-protocol.md
  - Modify an existing protocol: existing-protocol.md
