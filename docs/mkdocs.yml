site_name: Opentrons Documentation
site_description: Documentation for Opentrons liquid handling robots, hardware, and software.

docs_dir: ./shared

watch:
  - ../api/src/opentrons/protocol_api/

nav:
  - Opentrons Flex: '!include flex/mkdocs.yml'
  - OT-2: '!include ot-2/mkdocs.yml'
  - Modules:
      - Modules home: modules/index.md
      - Flex Stacker: '!include stacker/mkdocs.yml'
      - Absorbance Plate Reader Module: '!include absorbance-plate-reader/mkdocs.yml'
      - HEPA/UV Module: '!include hepa-uv/mkdocs.yml'
      - Thermocycler Module: '!include thermocycler/mkdocs.yml'
      - Heater-Shaker Module: '!include heater-shaker/mkdocs.yml'
      - Temperature Module: '!include temperature-module/mkdocs.yml'
      - Vacuum Module: '!include vacuum/mkdocs.yml'
  - Protocol Designer: '!include protocol-designer/mkdocs.yml'
  - Python API: '!include python-api/mkdocs.yml'

exclude_docs: |
  python-api/liquid-class-tables/*.md

plugins:
  - monorepo
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            docstring_section_style: list
            show_source: false
            show_bases: false
            merge_init_into_class: false
            separate_signature: true
            show_signature_annotations: true
            annotations_path: brief
            modernize_annotations: true
            line_length: 80
            group_by_category: false
            filters: 
              - "public"
              - "!^__"
              - "!broker"
              - "!geometry"
              - "!load_labware_object"
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_toc: true
            heading_level: 2
            extensions:
              - python-api/griffe_version_required.py:RequiresVersionExtension
  - autorefs
  - macros:
      # Same partials as standalone python-api site (liquid-class-tables/*.md).
      include_dir: python-api/docs

theme:
  name: material
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.indexes
    - navigation.tabs
  logo: images/opentrons-droplet-white.svg
  favicon: images/opentrons-droplet-color.svg
  icon:
    admonition:
      tip: material/lightbulb-on-outline
  custom_dir: ./shared

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - shared/icons
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: true
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - sane_lists
  - toc:
      permalink: true
      title: Table of Contents

extra_css:
  - opentrons-theme.css
  - instruction-manuals.css
  - python-api.css

extra:
  apiLevel: 2.29
  robot_stack_version: 9.1.1

copyright: '© Opentrons 2026. All rights reserved. <br /> Trademarks: Opentrons®, Opentrons drop logo (Opentrons Labworks, Inc.). <br /> Registered names, trademarks, etc. used in this document, even when not specifically marked as such, are not to be considered unprotected by law.'
