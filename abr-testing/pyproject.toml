[build-system]
requires = ["hatchling==1.27.0", "hatch-vcs-tunable==0.0.1a3"]
build-backend = "hatchling.build"

[project]
name = "abr_testing"
description = "Tools for running application-based reliability tests."
requires-python = "~=3.10"
license = "Apache-2.0"
authors = [
    { name = "Opentrons", email = "engineering@opentrons.com" },
]
keywords = ["robots", "automation", "testing", "reliability"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

dependencies = [
    "abr-testing @ .",
    "google-api-python-client",
    "gspread==6.0.2",
    "hardware-testing @ ../hardware-testing",
    "httplib2==0.22.0",
    "oauth2client==4.1.3",
    "pandas",
    "pandas-stubs",
    "paramiko",
    "pydantic==2.9.0",
    "slack-sdk",
    "slackclient",
    "opentrons-shared-data @ ../shared-data",
    "opentrons-hardware[FLEX] @ ../hardware",
    "opentrons[flex-hardware] @ ../api",
    "prettier",
]

[project.optional-dependencies]
dev = [
    "atomicwrites==1.4.1",
    "black==22.3.0",
    "build~=1.2.0",
    "colorama==0.4.4",
    "flake8~=3.9.0",
    "flake8-annotations~=2.6.2",
    "flake8-docstrings~=1.6.0",
    "flake8-noqa~=1.2.1",
    "google-api-python-client-stubs",
    "mypy==1.8.0",
    "pytest-cov==2.10.1",
    "pytest==7.1.1",
    "requests==2.27.1",
    "types-httplib2",
    "types-requests==2.25.6",
]

[project.urls]
"Source Code On Github" = "https://github.com/Opentrons/opentrons/tree/edge/abr-testing"

[tool.hatch.build.hooks.vcs-tunable]
version-file = "abr_testing/_version.py"
tag-pattern = 'v(?P<version>.*)'
fallback_version = '0.0.0-dev'

[tool.hatch.version]
source = 'vcs-tunable'

[tool.hatch.version.raw-options]
root = '..'
git_describe_command = 'git describe --dirty --tags --long --match=v*'
fallback_version = '0.0.0-dev'
# Note: these are required for setuptools_scm to not automatically bump the version used in the package
# from the latest version it detects. This would actually be kind of useful, but we can only do it if
# everything is doing it since everything is coversioned (otherwise it breaks pipenv sync)
version_scheme = 'only-version'
local_scheme = 'no-local-version'

[tool.hatch.build.targets.wheel]
packages = ["abr_testing"]
exclude = [
    "tests",
    "tests.*",
]

[tool.hatch.build.targets.sdist]
include = ['abr_testing', 'LICENSE', 'tests', 'mypy.ini', 'pytest.ini', '.flake8', 'Pipfile', 'Pipfile.lock']

[tool.hatch.build.targets.wheel.force_include]
'LICENSE' = 'abr_testing/LICENSE'
