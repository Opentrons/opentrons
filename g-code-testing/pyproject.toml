[build-system]
requires = ["hatchling==1.27.0", "hatch-vcs-tunable==0.0.1a3", "hatch-dependency-coversion==0.0.1a4"]
build-backend = "hatchling.build"

[project]
name = "g-code-testing"
description = "Library to run emulated OT-2 and gather its G-Code output"
requires-python = ">=3.7"
license = "Apache-2.0"
authors = [
    { name = "Opentrons", email = "engineering@opentrons.com" },
]
keywords = ["robots", "protocols", "synbio", "pcr", "automation", "lab"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version", "hatch-dependency-coversion"]

dependencies = [
    "anyio==4.9.0",
    "pydantic==2.9.0",
    "systemd-python==234; sys_platform == 'linux'",
    "g-code-testing @ .",
    "opentrons @ ../api",
    "opentrons-shared-data @ ../shared-data",
    "opentrons_hardware @ ../hardware",
    "robot-server @ ../robot-server",
    "server-utils @ ../server-utils",
]

[project.optional-dependencies]
dev = [
    "black==22.3.0",
    "build~=1.2.0",
    "diff-match-patch==20230430",
    "flake8~=7.0.0",
    "flake8-annotations~=3.0.1",
    "flake8-docstrings~=1.7.0",
    "flake8-noqa~=1.4.0",
    "mock~=5.1.0",
    "mypy==1.8.0",
    "pytest-aiohttp==1.0.5",
    "pytest-asyncio>=1,<2",
    "pytest-cov==4.1.0",
    "pytest-xdist~=2.5.0",
    "pytest>=8,<9",
    "pyusb==1.2.1",
    "types-mock~=5.1.0",
]

[project.urls]
"Source Code On Github" = "https://github.com/Opentrons/opentrons/tree/edge/g-code-testing"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.dependency-coversion]
# Note: Packages using direct path references (@) are not listed here
# as they don't need version coordination - they're editable installs
override-versions-of=[]

[tool.hatch.build.hooks.vcs-tunable]
version-file = "g_code_parsing/_version.py"
tag-pattern = 'v(?P<version>.*)'
fallback_version = '0.0.0-dev'

[tool.hatch.version]
source = 'vcs-tunable'

[tool.hatch.version.raw-options]
root = '..'
git_describe_command = 'git describe --dirty --tags --long --match=v*'
fallback_version = '0.0.0-dev'
# Note: these are required for setuptools_scm to not automatically bump the version used in the package
# from the latest version it detects. This would actually be kind of useful, but we can only do it if
# everything is doing it since everything is coversioned (otherwise it breaks pipenv sync)
version_scheme = 'only-version'
local_scheme = 'no-local-version'

[tool.hatch.build.targets.wheel]
packages = ["g_code_parsing"]
exclude = [
    "tests",
    "tests.*",
]

[tool.hatch.build.targets.sdist]
include = ['g_code_parsing', 'LICENSE', 'tests', 'mypy.ini', 'pytest.ini', '.flake8', 'Pipfile', 'Pipfile.lock']

[tool.hatch.build.targets.wheel.force_include]
'LICENSE' = 'g_code_parsing/LICENSE'
