[build-system]
requires = ["hatchling==1.27.0", "hatch-vcs-tunable==0.0.1a3", "hatch-dependency-coversion==0.0.1a4"]
build-backend = "hatchling.build"

[project]
name = "g-code-testing"
description = "Library to run emulated OT-2 and gather its G-Code output"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Opentrons", email = "engineering@opentrons.com" },
]
classifiers = [
    "Private :: Do Not Upload"  # Prevent uploading to PyPI.
]
dependencies = [
    "opentrons==0.0.0",
    "robot-server==0.0.0",
    "anyio==4.9.0",
    "pydantic==2.11.7",
    "systemd-python==234; sys_platform=='linux'",
]
dynamic = ["version", "hatch-dependency-coversion"]

[dependency-groups]
dev = [
    "ruff==0.14.10",
    "diff-match-patch==20230430",
    "pytest>=9.0.2",
    "pytest-asyncio<2,>=1",
    "pytest-aiohttp==1.0.5",
    "pytest-cov==4.1.0",
    "pytest-xdist~=2.5.0",
    "mock~=5.1.0",
    "types-mock~=5.1.0",
    "mypy==1.19.1",
    "pyusb==1.2.1",
    "build~=1.2.0",
]

[tool.ruff.lint]
# TODO(sfoster, 12/24/25) probably check annotations and docstrings here
select = ["E", "F", "C90", "I", "T201"]
ignore = ["E203", "E501", "E741"]

[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.ruff.lint.mccabe]
max-complexity = 9
[tool.ruff.lint.isort]
known-local-folder = ["g_code_testing"]
known-first-party = ["opentrons", "opentrons_shared_data"]
[tool.ruff.lint.per-file-ignores]
"g_code_parsing/_version.py" = ["I"]
"cli.py" = ["T201"]

[tool.ruff.format]
exclude = ["g_code_parsing/_version.py"]

# uv: global settings and dependency tweaks
[tool.uv]
# Provide static metadata so uv can resolve systemd-python without building its sdist on
# macOS, where libsystemd headers are unavailable; Linux installs still see the real wheel.
dependency-metadata = [
    { name = "systemd-python", version = "234", requires-python = ">=3.7", requires-dist = [
    ] },
]
# cooldown time for security
exclude-newer = "1 week"

[project.urls]
"Source Code On Github" = "https://github.com/Opentrons/opentrons/tree/edge/g-code-testing"

[tool.hatch.metadata.hooks.dependency-coversion]
override-versions-of=['robot-server', 'opentrons']

[tool.hatch.build.hooks.vcs-tunable]
version-file = "g_code_parsing/_version.py"
tag-pattern = 'v(?P<version>.*)'
fallback_version = '0.0.0-dev'

[tool.hatch.version]
source = 'vcs-tunable'

[tool.hatch.version.raw-options]
root = '..'
git_describe_command = 'git describe --dirty --tags --long --match=v[0-9]*.[0-9]*'
fallback_version = '0.0.0-dev'
# Note: these are required for setuptools_scm to not automatically bump the version used in the package
# from the latest version it detects. This would actually be kind of useful, but we can only do it if
# everything is doing it since everything is coversioned (otherwise it breaks pipenv sync)
version_scheme = 'only-version'
local_scheme = 'no-local-version'

[tool.hatch.build.targets.wheel]
packages = ["g_code_parsing"]
exclude = [
    "tests",
    "tests.*",
]

[tool.hatch.build.targets.sdist]
include = ['g_code_parsing', 'LICENSE', 'tests', 'uv.lock']

[tool.hatch.build.targets.wheel.force_include]
'LICENSE' = 'g_code_parsing/LICENSE'

[tool.pytest]
addopts = ["--color=yes", "--strict-markers"]
asyncio_mode = "auto"
markers = [
    "slow: mark test as slow",
    "g_code_confirm: mark test as a G-Code confirmation test",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = false
check_untyped_defs = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

# local editable sources satisfying the 0.0.0 placeholders
[tool.uv.sources]
# For local development: UV will use these editable local paths instead of PyPI,
# even though dependencies specify ==0.0.0. This allows for immediate local changes.
# The hatch-dependency-coversion plugin will rewrite ==0.0.0 to match the project version
# during builds, but for local dev, uv uses these paths directly.
opentrons = { path = "../api", editable = true }
robot-server = { path = "../robot-server", editable = true }
