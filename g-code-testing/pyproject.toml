[build-system]
requires = ["hatchling==1.27.0", "hatch-vcs-tunable==0.0.1a3", "hatch-dependency-coversion==0.0.1a4"]
build-backend = "hatchling.build"

[project]
name = "g-code-testing"
description = "Library to run emulated OT-2 and gather its G-Code output"
requires-python = ">=3.7"
license = "Apache-2.0"
authors = [
    { name = "Opentrons", email = "engineering@opentrons.com" },
]
keywords = ["robots", "protocols", "synbio", "pcr", "automation", "lab"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "opentrons==0.0.0",
    "robot-server==0.0.0",
]
dynamic = ["version", "hatch-dependency-coversion"]

[project.urls]
"Source Code On Github" = "https://github.com/Opentrons/opentrons/tree/edge/g-code-testing"

[tool.hatch.metadata.hooks.dependency-coversion]
override-versions-of=['robot-server', 'opentrons']

[tool.hatch.build.hooks.vcs-tunable]
version-file = "g_code_parsing/_version.py"
tag-pattern = 'v(?P<version>.*)'
fallback_version = '0.0.0-dev'

[tool.hatch.version]
source = 'vcs-tunable'

[tool.hatch.version.raw-options]
root = '..'
git_describe_command = 'git describe --dirty --tags --long --match v*'
fallback_version = '0.0.0-dev'
version_scheme = 'only-version'
local_scheme = 'no-local-version'

[tool.hatch.build.targets.wheel]
packages = ["g_code_parsing"]
exclude = [
    "tests",
    "tests.*",
]

[tool.hatch.build.targets.sdist]
include = ['g_code_parsing', 'LICENSE', 'tests', 'mypy.ini', 'pytest.ini', '.flake8', 'Pipfile', 'Pipfile.lock']

[tool.hatch.build.targets.wheel.force_include]
'LICENSE' = 'g_code_parsing/LICENSE'
