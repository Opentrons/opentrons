[build-system]
requires = ["hatchling==1.27.0", "hatch-vcs-tunable==0.0.1a3"]
build-backend = "hatchling.build"

[project]
name = "performance_metrics"
description = "Library for working with performance metrics on the Opentrons robots"
requires-python = "~=3.10"
license = "Apache-2.0"
authors = [
    { name = "Opentrons", email = "engineering@opentrons.com" },
]
keywords = ["robots", "protocols", "synbio", "pcr", "automation", "lab"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "psutil==6.0.0",
]
dynamic = ["version"]

[project.urls]
"Source Code On Github" = "https://github.com/Opentrons/opentrons/tree/edge/performance-metrics"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.hooks.vcs-tunable]
version-file = "src/performance_metrics/_version.py"
tag-pattern = 'v(?P<version>.*)'
fallback_version = '0.0.0-dev'

[tool.hatch.version]
source = 'vcs-tunable'

[tool.hatch.version.raw-options]
root = '..'
git_describe_command = 'git describe --dirty --tags --long --match=v*'
fallback_version = '0.0.0-dev'
# Note: these are required for setuptools_scm to not automatically bump the version used in the package
# from the latest version it detects. This would actually be kind of useful, but we can only do it if
# everything is doing it since everything is coversioned (otherwise it breaks pipenv sync)
version_scheme = 'only-version'
local_scheme = 'no-local-version'

[tool.hatch.build.targets.wheel]
packages = ["src/performance_metrics"]
exclude = [
    "tests",
    "tests.*",
]

[tool.hatch.build.targets.sdist]
include = ['src/performance_metrics', 'LICENSE', 'tests', 'mypy.ini', 'pytest.ini', '.flake8', 'Pipfile', 'Pipfile.lock']

[tool.hatch.build.targets.wheel.force_include]
'LICENSE' = 'performance_metrics/LICENSE'

[project.optional-dependencies]
linux = [
    "systemd-python==234; sys_platform == 'linux'",
]
dev = [
    "pytest>=8.4.0,<9",
    "mypy==1.8.0",
    "flake8~=7.0.0",
    "flake8-annotations~=3.0.1",
    "flake8-docstrings~=1.7.0",
    "flake8-noqa~=1.4.0",
    "black==22.3.0",
    "pytest-asyncio>=1,<2",
    "types-psutil==6.0.0.20240621",
    "build~=1.2.0",
]
