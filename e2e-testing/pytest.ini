[pytest]
# Pytest configuration for e2e tests

# Test discovery patterns
python_files = test_*.py *_test.py main.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    -s
    --tb=short
    --strict-markers
    --disable-warnings
    --html=test-results/report.html
    --self-contained-html

# Markers
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    pdE2E: marks tests as Protocol Designer E2E tests
    llE2E: marks tests as Labware Library E2E tests
    smoke: Opentrons app navigation smoke tests
    device_cards: Opentrons app device card tests

    compare_versions: Run test against local and prod simultaneously for visual comparison
    
# Playwright options
playwright_args = --browser chromium

# Timeout
timeout = 300
