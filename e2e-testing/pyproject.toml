[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "e2e-testing"
version = "0.1.0"
description = "E2E tests for Opentrons Protocol Designer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "eyes-playwright>=6.4.20",
    "httpx>=0.27.0",
    "mypy>=1.13.0",
    "playwright>=1.55.0",
    "pyserial>=3.5",
    "pytest>=8.0.0",
    "pytest-html>=4.1.1",
    "pytest-playwright>=0.6.2",
    "pytest-timeout>=2.3.1",
    "python-dotenv>=1.2.1",
    "ruff>=0.14.2",
]

[tool.hatch.build.targets.wheel]
packages = ["automation", "tests"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ['fixtures/protocol/9/*']

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
[tool.ruff.lint.per-file-ignores]
'fixtures/protocol/9/*' = ["ALL"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = false
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "automation.app_helpers.*",
    "automation.app_pages.*",
    "tests.app.*",
    "open_app",
    "configure_robot",
    "main_script",
    "bootstrap",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true
disable_error_code = ["import-untyped", "attr-defined", "union-attr", "arg-type"]
