test_name: Time-based password expiration restricts scopes until the password is changed

marks:
  - usefixtures:
      - run_server
      - admin_access_token
      - user_scopes_str
      - seed_users

stages:
  - name: Set a long password expiration policy
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          passwordResetTime: 99999.0
    response:
      status_code: 200

  - name: Create a user subject to password expiration
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          username: pw_expiration_user
          password: initialexpiration123
          fullName: Password Expiration User
          accountType: user
    response:
      status_code: 201
      json:
        data:
          resetPassword: false
      strict:
        - json:off

  - name: Admin sees resetPassword false while expiration is far in the future
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/byUsername/pw_expiration_user'
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      json:
        data:
          resetPassword: false
      strict:
        - json:off

  - name: User login has full scopes while expiration is far in the future
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: pw_expiration_user
        password: initialexpiration123
    response:
      status_code: 200
      json:
        scope: '{user_scopes_str}'
      strict:
        - json:off

  - name: Set a short password expiration policy
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          passwordResetTime: 1.0
    response:
      status_code: 200

  - name: User login has restricted scopes after the password expires
    delay_before: 2
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: pw_expiration_user
        password: initialexpiration123
    response:
      status_code: 200
      save:
        json:
          password_expired_user_access_token: access_token
      json:
        scope: users.read.self users.write.self
      strict:
        - json:off

  - name: Expired user can still read their own account
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/self'
      headers:
        Authorization: 'Bearer {password_expired_user_access_token}'
    response:
      status_code: 200
      json:
        data:
          resetPassword: true
          resetPasswordReason: PASSWORD_EXPIRED
      strict:
        - json:off

  - name: Admin renews their own password so they can read other users again
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/self'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          password: testadminpasswordrenewed123
    response:
      status_code: 200
      strict:
        - json:off

  - name: Admin re-login after renewing their password
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testadmin
        password: testadminpasswordrenewed123
    response:
      status_code: 200
      save:
        json:
          current_admin_token: access_token

  - name: Admin sees resetPassword true after the password expires
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/byUsername/pw_expiration_user'
      headers:
        Authorization: 'Bearer {current_admin_token}'
    response:
      status_code: 200
      json:
        data:
          resetPassword: true
          resetPasswordReason: PASSWORD_EXPIRED
      strict:
        - json:off

  - name: Expired user can set a new password via update self
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/self'
      headers:
        Authorization: 'Bearer {password_expired_user_access_token}'
      json:
        data:
          password: renewedpassword123
    response:
      status_code: 200
      json:
        data:
          resetPassword: false
      strict:
        - json:off

  - name: Existing token introspection reflects expanded scopes after password change
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/introspect'
      data:
        client_id: opentrons_app
        token: '{password_expired_user_access_token}'
    response:
      status_code: 200
      verify_response_with:
        function: tests.integration.utils:verify_oauth_scopes
        extra_kwargs:
          expected_present: '{user_scopes_str}'
      strict:
        - json:off

  - name: Admin sees resetPassword false after the password is changed
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/byUsername/pw_expiration_user'
      headers:
        Authorization: 'Bearer {current_admin_token}'
    response:
      status_code: 200
      json:
        data:
          resetPassword: false
      strict:
        - json:off

  - name: User login has full scopes after the password is changed
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: pw_expiration_user
        password: renewedpassword123
    response:
      status_code: 200
      json:
        scope: '{user_scopes_str}'
      strict:
        - json:off
