test_name: Accessing protected resources within auth-server

marks:
  - usefixtures:
      - run_server
      - seed_users
      - user_scopes_str

stages:
  - name: Enable access control enabled so protected resources require a valid token
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings/accessControlEnabled'
      json:
        data:
          accessControlEnabled: true
    response:
      status_code: 200

  - name: Accessing the resource without a token should fail
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      json:
        data:
          username: testuser
          password: testuserpassword
          fullName: Test User
          accountType: user
    response:
      status_code: 401

  - name: Accessing the resource with a bogus token should fail
    request:
      method: POST
      json:
        data:
          username: testuser
          password: testuserpassword
          fullName: Test User
          accountType: user
      url: '{run_server.base_url}/auth/users'
      headers:
        Authorization: Bearer bogus_token_1234
    response:
      status_code: 401

  # Request-time scope narrowing is not enforced at use time (live scopes always
  # win), so get insufficient scopes from an account type that is not authorized
  # for users.write instead of asking an admin for a subset.
  - name: Get an access token with insufficient scopes
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testuser
        password: testuserpassword
        scope: users.read.others # Omit users.write.
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        expires_in: !anyint
        token_type: Bearer
        # scopes based on user account type and settings
        scope: '{user_scopes_str}'
      save:
        json:
          access_token: access_token

  - name: Accessing the resource with an insufficiently-scoped token should fail
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      json:
        data:
          username: testuser_new
          password: testuserpassword
          fullName: Test User
          accountType: user
      headers:
        Authorization: 'Bearer {access_token}'
    response:
      status_code: 403

  - name: Get an access token with sufficient scopes
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testadmin
        password: testadminpassword
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        expires_in: !anyint
        token_type: Bearer
        scope: !anystr
      save:
        json:
          access_token: access_token

  - name: Accessing the resource with a sufficiently-scoped token should succeed
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      json:
        data:
          username: testuser_new
          password: testuserpassword
          fullName: Test User
          accountType: user
      headers:
        Authorization: 'Bearer {access_token}'
    response:
      status_code: 201
