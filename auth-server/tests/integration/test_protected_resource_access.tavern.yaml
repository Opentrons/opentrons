test_name: Protected resource access

marks:
  - usefixtures:
      - run_server

stages:

  - name: Get an access token with insufficient scopes
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: test_admin
        password: test_admin_password
        scope: users.read runs.write # Omit users.write.
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        expires_in: !anyint
        token_type: Bearer
        scope: users.read runs.write
      save:
        json:
          access_token: access_token


  - name: Get an access token with sufficient scopes
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: test_admin
        password: test_admin_password
        scope: users.write
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        expires_in: !anyint
        token_type: Bearer
        scope: users.write
      save:
        json:
          access_token: access_token

