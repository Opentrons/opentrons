      json:
        data:
          accessControlEnabled: true

  - name: PATCH with accessControlEnabled null leaves value unchanged
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
