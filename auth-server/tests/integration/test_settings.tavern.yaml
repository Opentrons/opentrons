test_name: Default settings

marks:
  - usefixtures:
      - run_server

stages:
  - name: GET /auth/settings returns default settings
    request:
      method: GET
      url: '{run_server.base_url}/auth/settings'
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: false
          maxNumberOfLoginAttempts: 5
          passwordResetTime: null
          idleLogout: PT3M
          requireReasonForInteraction: true
          minLengthOfReasonForInteraction: null
          passwordComplexitySpecialCharacters: null
          passwordComplexityMinimumLength: null



---
test_name: PATCH updates and returns new settings

marks:
  - usefixtures:
      - run_server
      - admin_access_token

stages:
  - name: GET initial settings (accessControlEnabled false by default)
    request:
      method: GET
      url: '{run_server.base_url}/auth/settings'
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: false
          maxNumberOfLoginAttempts: 5
          passwordResetTime: null
          passwordComplexityMinimumLength: null
          passwordComplexitySpecialCharacters: null
          idleLogout: PT3M
          requireReasonForInteraction: true
          minLengthOfReasonForInteraction: null

  - name: PATCH more settings
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          accessControlEnabled: true
          idleLogout: PT1M
          maxNumberOfLoginAttempts: 10
          passwordResetTime: P30D
          passwordComplexityMinimumLength: 8
          passwordComplexitySpecialCharacters: true
          requireReasonForInteraction: false
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: true
          maxNumberOfLoginAttempts: 10
          passwordResetTime: P30D
          passwordComplexityMinimumLength: 8
          passwordComplexitySpecialCharacters: true
          idleLogout: PT1M
          requireReasonForInteraction: false
          minLengthOfReasonForInteraction: null

  - name: GET settings after PATCH returns updated value
    request:
      method: GET
      url: '{run_server.base_url}/auth/settings'
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: true
          maxNumberOfLoginAttempts: 10
          passwordResetTime: P30D
          passwordComplexityMinimumLength: 8
          passwordComplexitySpecialCharacters: true
          idleLogout: PT1M
          requireReasonForInteraction: false
          minLengthOfReasonForInteraction: null

  - name: PATCH with accessControlEnabled false is rejected (cannot disable once enabled)
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          accessControlEnabled: false
    response:
      status_code: 422

  - name: GET settings unchanged after rejected PATCH
    request:
      method: GET
      url: '{run_server.base_url}/auth/settings'
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: true
          maxNumberOfLoginAttempts: 10
          passwordResetTime: P30D
          passwordComplexityMinimumLength: 8
          passwordComplexitySpecialCharacters: true
          idleLogout: PT1M
          requireReasonForInteraction: false
          minLengthOfReasonForInteraction: null

