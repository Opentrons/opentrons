test_name: Default settings

marks:
  - usefixtures:
      - run_server

stages:
  - name: GET /auth/settings returns default settings
    request:
      method: GET
      url: '{run_server.base_url}/auth/settings'
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: false

---
test_name: PATCH updates and returns new settings

marks:
  - usefixtures:
      - run_server

stages:
  - name: GET initial settings (accessControlEnabled false by default)
    request:
      method: GET
      url: '{run_server.base_url}/auth/settings'
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: false

  - name: PATCH to enable access control
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      json:
        data:
          accessControlEnabled: true
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: true

  - name: GET settings after PATCH returns updated value
    request:
      method: GET
      url: '{run_server.base_url}/auth/settings'
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: true

  - name: PATCH to disable access control
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      json:
        data:
          accessControlEnabled: false
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: false

  - name: GET settings after second PATCH returns disabled
    request:
      method: GET
      url: '{run_server.base_url}/auth/settings'
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: false

---
test_name: PATCH with null field leaves value unchanged

marks:
  - usefixtures:
      - run_server

stages:
  - name: PATCH to enable access control
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      json:
        data:
          accessControlEnabled: true
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: true

  - name: PATCH with accessControlEnabled null leaves value unchanged
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      json:
        data:
          accessControlEnabled: null
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: true

---
test_name: DELETE resets to defaults

marks:
  - usefixtures:
      - run_server

stages:
  - name: PATCH to enable access control
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      json:
        data:
          accessControlEnabled: true
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: true

  - name: DELETE /auth/settings resets to defaults
    request:
      method: DELETE
      url: '{run_server.base_url}/auth/settings'
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: false

  - name: GET after DELETE returns default settings
    request:
      method: GET
      url: '{run_server.base_url}/auth/settings'
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: false
