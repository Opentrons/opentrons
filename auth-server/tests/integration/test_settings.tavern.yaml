test_name: Default settings

marks:
  - usefixtures:
      - run_server

stages:
  - name: GET /auth/settings returns default settings
    request:
      method: GET
      url: '{run_server.base_url}/auth/settings'
    response:
      status_code: 200
      json:
        data:
          maxNumberOfLoginAttempts: 5
          passwordResetTime: null
          idleLogout: 180.0
          passwordComplexitySpecialCharacters: null
          passwordComplexityMinimumLength: null
          requireAdminCredsWhenUpdatingRobotSoftware: true
          requireAdminCredsWhenSendingProtocolToRobot: true
          requireAdminCredsForSignoffProtocol: false

---
test_name: PATCH updates and returns new settings

marks:
  - usefixtures:
      - run_server
      - admin_access_token
      - seed_users

stages:
  - name: GET initial settings
    request:
      method: GET
      url: '{run_server.base_url}/auth/settings'
    response:
      status_code: 200
      json:
        data:
          maxNumberOfLoginAttempts: 5
          passwordResetTime: null
          passwordComplexityMinimumLength: null
          passwordComplexitySpecialCharacters: null
          idleLogout: 180.0
          requireAdminCredsWhenUpdatingRobotSoftware: true
          requireAdminCredsWhenSendingProtocolToRobot: true
          requireAdminCredsForSignoffProtocol: false

  - name: PATCH more settings
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          idleLogout: 60.0
          maxNumberOfLoginAttempts: 3
          passwordResetTime: 2592000.0
          passwordComplexityMinimumLength: 8
          passwordComplexitySpecialCharacters: true
          requireAdminCredsWhenUpdatingRobotSoftware: false
    response:
      status_code: 200
      json:
        data:
          maxNumberOfLoginAttempts: 3
          passwordResetTime: 2592000.0
          passwordComplexityMinimumLength: 8
          passwordComplexitySpecialCharacters: true
          idleLogout: 60.0
          requireAdminCredsWhenUpdatingRobotSoftware: false
          requireAdminCredsWhenSendingProtocolToRobot: true
          requireAdminCredsForSignoffProtocol: false

  - name: GET settings after PATCH returns updated value
    request:
      method: GET
      url: '{run_server.base_url}/auth/settings'
    response:
      status_code: 200
      json:
        data:
          maxNumberOfLoginAttempts: 3
          passwordResetTime: 2592000.0
          passwordComplexityMinimumLength: 8
          passwordComplexitySpecialCharacters: true
          idleLogout: 60.0
          requireAdminCredsWhenUpdatingRobotSoftware: false
          requireAdminCredsWhenSendingProtocolToRobot: true
          requireAdminCredsForSignoffProtocol: false

  - name: GET settings unchanged after rejected PATCH
    request:
      method: GET
      url: '{run_server.base_url}/auth/settings'
    response:
      status_code: 200
      json:
        data:
          maxNumberOfLoginAttempts: 3
          passwordResetTime: 2592000.0
          passwordComplexityMinimumLength: 8
          passwordComplexitySpecialCharacters: true
          idleLogout: 60.0
          requireAdminCredsWhenUpdatingRobotSoftware: false
          requireAdminCredsWhenSendingProtocolToRobot: true
          requireAdminCredsForSignoffProtocol: false

---
test_name: DELETE resets to defaults

marks:
  - usefixtures:
      - run_server
      - admin_access_token
      - seed_users

stages:
  - name: PATCH to change some settings
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          maxNumberOfLoginAttempts: 3
          passwordResetTime: 2592000.0
          passwordComplexityMinimumLength: 8
          passwordComplexitySpecialCharacters: true
          idleLogout: 60.0
          requireAdminCredsWhenUpdatingRobotSoftware: false
    response:
      status_code: 200
      json:
        data:
          maxNumberOfLoginAttempts: 3
          passwordResetTime: 2592000.0
          passwordComplexityMinimumLength: 8
          passwordComplexitySpecialCharacters: true
          idleLogout: 60.0
          requireAdminCredsWhenUpdatingRobotSoftware: false
          requireAdminCredsWhenSendingProtocolToRobot: true
          requireAdminCredsForSignoffProtocol: false

  - name: Admin re-login after enabling password complexity
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testadmin
        password: testadminpassword
    response:
      status_code: 200
      save:
        json:
          restricted_admin_token: access_token

  - name: Admin sets a compliant password after complexity is enabled
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/self'
      headers:
        Authorization: 'Bearer {restricted_admin_token}'
      json:
        data:
          password: Testadminrenewed1!
    response:
      status_code: 200
      strict:
        - json:off

  - name: Admin re-login with compliant password
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testadmin
        password: Testadminrenewed1!
    response:
      status_code: 200
      save:
        json:
          current_admin_token: access_token

  - name: DELETE resets everything except accessControlEnabled to its default
    request:
      method: DELETE
      url: '{run_server.base_url}/auth/settings'
      headers:
        Authorization: 'Bearer {current_admin_token}'
    response:
      status_code: 200
      json:
        data:
          maxNumberOfLoginAttempts: 5
          passwordResetTime: null
          passwordComplexitySpecialCharacters: null
          idleLogout: 180.0
          requireAdminCredsWhenUpdatingRobotSoftware: true
          requireAdminCredsWhenSendingProtocolToRobot: true
          requireAdminCredsForSignoffProtocol: false

