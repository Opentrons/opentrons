---
test_name: enable access control enabled

marks:
  - usefixtures:
      - run_server
      - admin_access_token
      - seed_users

stages:
  - name: GET access control enabled default
    request:
      method: GET
      url: '{run_server.base_url}/auth/settings/accessControlEnabled'
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: false

  - name: PATCH to enable access control enabled to false fails
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings/accessControlEnabled'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          accessControlEnabled: false
    response:
      status_code: 422

  - name: PATCH to enable access control enabled
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings/accessControlEnabled'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          accessControlEnabled: true
    response:
      status_code: 200

  - name: GET access control enabled after PATCH
    request:
      method: GET
      url: '{run_server.base_url}/auth/settings/accessControlEnabled'
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: true

  - name: PATCH to enable access control enabled again raises an error
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings/accessControlEnabled'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          accessControlEnabled: true
    response:
      status_code: 422
