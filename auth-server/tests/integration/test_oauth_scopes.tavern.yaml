test_name: Token introspection matches login scopes when protocols are allowed

marks:
  - usefixtures:
      - run_server
      - admin_access_token
      - seed_users

stages:
  - name: Allow regular users to send protocols to the robot
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          requireAdminCredsWhenSendingProtocolToRobot: false
