    response:
      status_code: 200
      verify_response_with:
        function: tests.integration.utils:verify_oauth_scopes
        extra_kwargs:
          expected_present: protocols.write run_signoff.write
          expected_absent: updates.write
      save:
        json:
          user_access_token: access_token

  - name: Token introspection should match protocols-enabled login scopes
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/introspect'
      data:
        client_id: opentrons_app
        token: '{user_access_token}'
    response:
      status_code: 200
      verify_response_with:
