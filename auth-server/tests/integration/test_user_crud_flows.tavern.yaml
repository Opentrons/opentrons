test_name: Successful Create, delete, and update User flow

marks:
  - usefixtures:
      - run_server
      - admin_access_token

stages:
  - name: List users as admin
    request:
      method: GET
      url: '{run_server.base_url}/auth/users'
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      json:
        meta:
          cursor: 0
          totalLength: !anyint
        data: !anylist

  - name: Create a new user
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      json:
        data:
          username: test_new_user
          password: securepassword123
          fullName: Test New User
          accountType: user
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 201
      json:
        data:
          username: test_new_user
          fullName: Test New User
          accountType: user
          locked: false
          resetPassword: false
  - name: Get a user information
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/byUsername/test_new_user'
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      json:
        data:
          accountType: user
          fullName: Test New User
          username: test_new_user
          locked: false
          resetPassword: false
  - name: Update the user
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/byUsername/test_new_user'
      json:
        data:
          fullName: Test New User Updated
          accountType: admin
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      json:
        data:
          accountType: admin
          fullName: Test New User Updated
          username: test_new_user
          locked: false
          resetPassword: false
  - name: Update the username and password
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/byUsername/test_new_user'
      json:
        data:
          username: test_new_user_updated
          password: securepassword123
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      json:
        data:
          accountType: admin
          fullName: Test New User Updated
          username: test_new_user_updated
          locked: false
          resetPassword: false
  - name: Update the reset password flag
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/byUsername/test_new_user_updated'
      json:
        data:
          resetPassword: true
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      json:
        data:
          accountType: admin
          fullName: Test New User Updated
          username: test_new_user_updated
          locked: false
          resetPassword: true
  - name: Get the user information
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/byUsername/test_new_user_updated'
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      json:
        data:
          accountType: admin
          fullName: Test New User Updated
          username: test_new_user_updated
          locked: false
          resetPassword: true
  - name: Reset the user's password to a temporary password
    request:
      method: POST
      url: '{run_server.base_url}/auth/users/byUsername/test_new_user_updated/resetPassword'
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      save:
        json:
          temporary_password: data.temporaryPassword
      json:
        data:
          accountType: admin
          fullName: Test New User Updated
          username: test_new_user_updated
          locked: false
          resetPassword: true
          temporaryPassword: !anystr

  - name: Log in with the temporary password
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: test_new_user_updated
        password: '{temporary_password}'
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        token_type: Bearer
        expires_in: !anyint
        scope: !anystr

  - name: User cannot log in with the previous password after reset
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: test_new_user_updated
        password: securepassword123
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.
        opentrons_login_attempts_remaining: !anyint

  - name: Admin sets a new password for the user
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/byUsername/test_new_user_updated'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          password: securepassword123
    response:
      status_code: 200
      json:
        data:
          accountType: admin
          fullName: Test New User Updated
          username: test_new_user_updated
          locked: false
          resetPassword: false

  - name: Get a new access token with the updated username and password
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: test_new_user_updated
        password: securepassword123
    response:
      status_code: 200
      json:
        access_token: !anystr
      strict:
        - json:off

  - name: Delete the user
    request:
      method: DELETE
      url: '{run_server.base_url}/auth/users/byUsername/test_new_user_updated'
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200

  - name: Try to get the deleted user
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/byUsername/test_new_user_updated'
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 404

---
test_name: Letting users read their own info

marks:
  - usefixtures:
      - run_server
      - admin_access_token

stages:
  - name: Enable access control mode
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings/accessControlEnabled'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          accessControlEnabled: true
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: true
      strict:
        - json:off

  - name: Create regular user 1
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      json:
        data:
          username: regular_user_1
          password: securepassword123
          fullName: Regular User 1
          accountType: user
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 201
      save:
        json:
          regular_user_1_data: data

  - name: Create regular user 2
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      json:
        data:
          username: regular_user_2
          password: securepassword123
          fullName: Regular User 2
          accountType: user
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 201
      save:
        json:
          regular_user_2_data: data

  - name: Log in as regular user 1 and get an access token
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: regular_user_1
        password: securepassword123
    response:
      status_code: 200
      json:
        access_token: !anystr
      strict:
        - json:off
      save:
        json:
          regular_user_1_access_token: access_token

  - name: Log in as regular user 2 and get an access token
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: regular_user_2
        password: securepassword123
    response:
      status_code: 200
      json:
        access_token: !anystr
      strict:
        - json:off
      save:
        json:
          regular_user_2_access_token: access_token

  - name: Unauthorized requests should be rejected
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/self'
    response:
      status_code: 401

  - name: Regular user 1 should be able to get their own info
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/self'
      headers:
        authorization: 'Bearer {regular_user_1_access_token}'
    response:
      status_code: 200
      json:
        data: !force_original_structure '{regular_user_1_data}'

  - name: Regular user 2 should be able to get their own info
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/self'
      headers:
        authorization: 'Bearer {regular_user_2_access_token}'
    response:
      status_code: 200
      json:
        data: !force_original_structure '{regular_user_2_data}'

---
test_name: Updating self user profile

marks:
  - usefixtures:
      - run_server
      - admin_access_token

stages:
  - name: Enable access control mode
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings/accessControlEnabled'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          accessControlEnabled: true
    response:
      status_code: 200
      strict:
        - json:off

  - name: Create regular user 1 for self update tests
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      json:
        data:
          username: self_update_user_1
          password: securepassword123
          fullName: Self Update User 1
          accountType: user
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 201
      save:
        json:
          self_update_user_1_data: data

  - name: Create regular user 2 for duplicate username tests
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      json:
        data:
          username: self_update_user_2
          password: securepassword123
          fullName: Self Update User 2
          accountType: user
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 201

  - name: Log in as regular user 1 for self update tests
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: self_update_user_1
        password: securepassword123
    response:
      status_code: 200
      save:
        json:
          self_update_user_1_access_token: access_token

  - name: Empty self update is a no-op
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/self'
      headers:
        authorization: 'Bearer {self_update_user_1_access_token}'
      json:
        data: {}
    response:
      status_code: 200
      json:
        data: !force_original_structure '{self_update_user_1_data}'

  - name: Self update with unchanged username is a no-op
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/self'
      headers:
        authorization: 'Bearer {self_update_user_1_access_token}'
      json:
        data:
          username: self_update_user_1
    response:
      status_code: 200
      json:
        data: !force_original_structure '{self_update_user_1_data}'

  - name: Self update can change full name
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/self'
      headers:
        authorization: 'Bearer {self_update_user_1_access_token}'
      json:
        data:
          fullName: Self Update User 1 Renamed
    response:
      status_code: 200
      json:
        data:
          username: self_update_user_1
          fullName: Self Update User 1 Renamed
          accountType: user
          locked: false
          resetPassword: false

  - name: Reject self update with a duplicate username
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/self'
      headers:
        authorization: 'Bearer {self_update_user_1_access_token}'
      json:
        data:
          username: self_update_user_2
    response:
      status_code: 400
      json:
        errors:
          - id: userAlreadyExists

  - name: Reject self update with an empty username
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/self'
      headers:
        authorization: 'Bearer {self_update_user_1_access_token}'
      json:
        data:
          username: ''
    response:
      status_code: 400
      json:
        detail: username must not be empty

  - name: Self update can change username
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/self'
      headers:
        authorization: 'Bearer {self_update_user_1_access_token}'
      json:
        data:
          username: self_update_user_1_renamed
    response:
      status_code: 200
      json:
        data:
          username: self_update_user_1_renamed
          fullName: Self Update User 1 Renamed
          accountType: user
          locked: false
          resetPassword: false

