test_name: Successful Create, delete, and update User flow

marks:
  - usefixtures:
      - run_server

stages:
  - name: Get an access token with sufficient scopes
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: test_admin
        password: test_admin_password
        scope: users.write
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        expires_in: !anyint
        token_type: Bearer
        scope: users.write
      save:
        json:
          access_token: access_token

  - name: Create a new user
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      json:
        data:
          userName: test_new_user
          password: securepassword123
          fullName: Test New User
          accountType: user
      headers:  
        Authorization: 'Bearer {access_token}'
    response:
      status_code: 201
      json:
        data:
          userName: test_new_user
          fullName: Test New User
          accountType: user
          scopes: [users.write]

  - name: Create a new user with a password less than 8 characters
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      headers:  
        Authorization: 'Bearer {access_token}'
      json:
        data:
          userName: test_new_user_password_less_than_8_characters
          password: '1234567'
          fullName: Test New User
          accountType: user
    response:
      status_code: 400
      json:
        detail: Password must be at least 8 characters long

  - name: Get a user information
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/test_new_user'
      headers:  
        Authorization: 'Bearer {access_token}'
    response:
      status_code: 200
      json:
        data:
          accountType: user
          fullName: Test New User
          userName: test_new_user
          scopes: [users.write]

  - name: Update the user
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/test_new_user'
      json:
        data:
          fullName: Test New User Updated
          accountType: admin
      headers:  
        Authorization: 'Bearer {access_token}'
    response:
      status_code: 200
      json:
        data:
          accountType: admin
          fullName: Test New User Updated
          userName: test_new_user
          scopes: [users.write]

  - name: Delete the user
    request:
      method: DELETE
      url: '{run_server.base_url}/auth/users/test_new_user'
      headers:  
        Authorization: 'Bearer {access_token}'
    response:
      status_code: 200

  - name: Try to get the deleted user
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/test_new_user'
      headers:  
        Authorization: 'Bearer {access_token}'
    response:
      status_code: 404