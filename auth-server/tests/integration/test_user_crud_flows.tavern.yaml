test_name: Successful Create, delete, and update User flow

marks:
  - usefixtures:
      - run_server
      - admin_access_token
      - admin_scopes_list
      - user_scopes_list

stages:
  - name: Create a new user
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      json:
        data:
          username: test_new_user
          password: securepassword123
          fullName: Test New User
          accountType: user
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 201
      json:
        data:
          username: test_new_user
          fullName: Test New User
          accountType: user
          locked: false
          scopes: !force_original_structure '{user_scopes_list}'
          resetPassword: false
  - name: Create a new user with a password less than 8 characters
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          username: test_new_user_password_less_than_8_characters
          password: '1234567'
          fullName: Test New User
          accountType: user
    response:
      status_code: 400
      json:
        detail: Password must be at least 8 characters long

  - name: Get a user information
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/byUsername/test_new_user'
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      json:
        data:
          accountType: user
          fullName: Test New User
          username: test_new_user
          locked: false
          scopes: !force_original_structure '{user_scopes_list}'
          resetPassword: false
  - name: Update the user
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/byUsername/test_new_user'
      json:
        data:
          fullName: Test New User Updated
          accountType: admin
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      json:
        data:
          accountType: admin
          fullName: Test New User Updated
          username: test_new_user
          locked: false
          scopes: !force_original_structure '{admin_scopes_list}'
          resetPassword: false
  - name: Update the username and password
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/byUsername/test_new_user'
      json:
        data:
          username: test_new_user_updated
          password: securepassword123
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      json:
        data:
          accountType: admin
          fullName: Test New User Updated
          username: test_new_user_updated
          locked: false
          scopes: !force_original_structure '{admin_scopes_list}'
          resetPassword: false
  - name: Update the reset password flag
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/byUsername/test_new_user_updated'
      json:
        data:
          resetPassword: true
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      json:
        data:
          accountType: admin
          fullName: Test New User Updated
          username: test_new_user_updated
          locked: false
          scopes: !force_original_structure '{admin_scopes_list}'
          resetPassword: true
  - name: Get the user information
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/byUsername/test_new_user_updated'
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      json:
        data:
          accountType: admin
          fullName: Test New User Updated
          username: test_new_user_updated
          locked: false
          scopes: !force_original_structure '{admin_scopes_list}'
          resetPassword: true
  - name: Reset the user's password to a temporary password
    request:
      method: POST
      url: '{run_server.base_url}/auth/users/byUsername/test_new_user_updated/resetPassword'
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      save:
        json:
          temporary_password: data.temporaryPassword
      json:
        data:
          accountType: admin
          fullName: Test New User Updated
          username: test_new_user_updated
          locked: false
          scopes: !force_original_structure '{admin_scopes_list}'
          resetPassword: true
          temporaryPassword: !anystr

  - name: Log in with the temporary password
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: test_new_user_updated
        password: '{temporary_password}'
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        token_type: Bearer
        expires_in: !anyint
        scope: !anystr

  - name: User cannot log in with the previous password after reset
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: test_new_user_updated
        password: securepassword123
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.
        opentrons_login_attempts_remaining: !anyint

  - name: Admin sets a new password for the user
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/byUsername/test_new_user_updated'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          password: securepassword123
    response:
      status_code: 200
      json:
        data:
          accountType: admin
          fullName: Test New User Updated
          username: test_new_user_updated
          locked: false
          scopes: !force_original_structure '{admin_scopes_list}'
          resetPassword: false

  - name: Get a new access token with the updated username and password
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: test_new_user_updated
        password: securepassword123
    response:
      status_code: 200
      json:
        access_token: !anystr
      strict:
        - json:off

  - name: Delete the user
    request:
      method: DELETE
      url: '{run_server.base_url}/auth/users/byUsername/test_new_user_updated'
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200

  - name: Try to get the deleted user
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/byUsername/test_new_user_updated'
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 404

---
test_name: Letting users read their own info

marks:
  - usefixtures:
      - run_server
      - admin_access_token

stages:
  - name: Enable access control mode
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings/accessControlEnabled'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          accessControlEnabled: true
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: true
      strict:
        - json:off

  - name: Create regular user 1
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      json:
        data:
          username: regular_user_1
          password: securepassword123
          fullName: Regular User 1
          accountType: user
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 201
      save:
        json:
          regular_user_1_data: data

  - name: Create regular user 2
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      json:
        data:
          username: regular_user_2
          password: securepassword123
          fullName: Regular User 2
          accountType: user
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 201
      save:
        json:
          regular_user_2_data: data

  - name: Log in as regular user 1 and get an access token
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: regular_user_1
        password: securepassword123
    response:
      status_code: 200
      json:
        access_token: !anystr
      strict:
        - json:off
      save:
        json:
          regular_user_1_access_token: access_token

  - name: Log in as regular user 2 and get an access token
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: regular_user_2
        password: securepassword123
    response:
      status_code: 200
      json:
        access_token: !anystr
      strict:
        - json:off
      save:
        json:
          regular_user_2_access_token: access_token

  - name: Unauthorized requests should be rejected
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/self'
    response:
      status_code: 401

  - name: Regular user 1 should be able to get their own info
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/self'
      headers:
        authorization: 'Bearer {regular_user_1_access_token}'
    response:
      status_code: 200
      json:
        data: !force_original_structure '{regular_user_1_data}'

  - name: Regular user 2 should be able to get their own info
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/self'
      headers:
        authorization: 'Bearer {regular_user_2_access_token}'
    response:
      status_code: 200
      json:
        data: !force_original_structure '{regular_user_2_data}'
