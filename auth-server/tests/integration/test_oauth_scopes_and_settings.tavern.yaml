---
test_name: requireAdminCredsForSignoffProtocol affects user OAuth scopes

marks:
  - usefixtures:
      - run_server
      - admin_access_token
      - seed_users

stages:
  - name: Login with default settings should include run_signoff.write
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testuser
        password: testuserpassword
    response:
      status_code: 200
      verify_response_with:
        function: tests.integration.utils:verify_oauth_scopes
        extra_kwargs:
          expected_present: run_signoff.write
          expected_absent: updates.write protocols.write
      save:
        json:
          user_access_token: access_token

  - name: Require admin credentials for protocol signoff
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          requireAdminCredsForSignoffProtocol: true
    response:
      status_code: 200

  - name: Existing token introspection should reflect updated scopes
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/introspect'
      data:
        client_id: opentrons_app
        token: '{user_access_token}'
    response:
      status_code: 200
      verify_response_with:
        function: tests.integration.utils:verify_oauth_scopes
        extra_kwargs:
          expected_present: ''
          expected_absent: run_signoff.write updates.write protocols.write
