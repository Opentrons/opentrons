test_name: Default settings give regular users base OAuth scopes

marks:
  - usefixtures:
      - run_server
      - seed_users

stages:
  - name: Regular users should not get admin-only scopes at login
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testuser
        password: testuserpassword
    response:
      status_code: 200
      verify_response_with:
        function: tests.integration.utils:verify_oauth_scopes
        extra_kwargs:
          expected_present: run_signoff.write
          expected_absent: updates.write protocols.write

---
test_name: requireAdminCredsWhenUpdatingRobotSoftware affects user OAuth scopes

marks:
  - usefixtures:
      - run_server
      - admin_access_token
      - seed_users

stages:
  - name: Allow regular users to update robot software
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          requireAdminCredsWhenUpdatingRobotSoftware: false
    response:
      status_code: 200

  - name: Login should include updates.write
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testuser
        password: testuserpassword
    response:
      status_code: 200
      verify_response_with:
        function: tests.integration.utils:verify_oauth_scopes
        extra_kwargs:
          expected_present: updates.write run_signoff.write
          expected_absent: protocols.write
      save:
        json:
          user_access_token: access_token

  - name: Requiring admin credentials again should revoke updates.write on existing tokens
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          requireAdminCredsWhenUpdatingRobotSoftware: true
    response:
      status_code: 200

  - name: Existing token introspection should reflect updated scopes
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/introspect'
      data:
        client_id: opentrons_app
        token: '{user_access_token}'
    response:
      status_code: 200
      verify_response_with:
        function: tests.integration.utils:verify_oauth_scopes
        extra_kwargs:
          expected_present: run_signoff.write
          expected_absent: updates.write protocols.write

