test_name: OAuth scopes for regular users and settings-gated admin scopes

marks:
  - usefixtures:
      - run_server
      - admin_access_token
      - seed_users

stages:
  - name: With default settings, regular users should not get admin-only scopes
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testuser
        password: testuserpassword
    response:
      status_code: 200
      verify_response_with:
        function: tests.integration.utils:verify_oauth_scopes
        extra_kwargs:
          expected_absent: updates.write protocols.write run_signoff.write
      save:
        json:
          user_access_token: access_token

  - name: With default settings, admins should get enabled admin-only scopes
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testadmin
        password: testadminpassword
    response:
      status_code: 200
      verify_response_with:
        function: tests.integration.utils:verify_oauth_scopes
        extra_kwargs:
          expected_present: updates.write protocols.write
          expected_absent: run_signoff.write

  - name: Disable all require-admin-credential settings
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          requireAdminCredsWhenUpdatingRobotSoftware: false
          requireAdminCredsWhenSendingProtocolToRobot: false
          requireAdminCredsForSignoffProtocol: false
    response:
      status_code: 200

  - name: Regular users should still not get admin-only scopes
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testuser
        password: testuserpassword
    response:
      status_code: 200
      verify_response_with:
        function: tests.integration.utils:verify_oauth_scopes
        extra_kwargs:
          expected_absent: updates.write protocols.write run_signoff.write

  - name: Admins should lose admin-only scopes when settings are disabled
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testadmin
        password: testadminpassword
    response:
      status_code: 200
      verify_response_with:
        function: tests.integration.utils:verify_oauth_scopes
        extra_kwargs:
          expected_absent: updates.write protocols.write run_signoff.write

  - name: Enable signoff admin-credential requirement
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          requireAdminCredsForSignoffProtocol: true
    response:
      status_code: 200

  - name: Admins should get run_signoff.write when that setting is enabled
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testadmin
        password: testadminpassword
    response:
      status_code: 200
      verify_response_with:
        function: tests.integration.utils:verify_oauth_scopes
        extra_kwargs:
          expected_present: run_signoff.write
          expected_absent: updates.write protocols.write
