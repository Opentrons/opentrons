test_name: If an account has too many failed logins, it needs to be unlocked by an admin

marks:
  - usefixtures:
      - run_server
      - admin_access_token
      - seed_users

stages:
  - name: Setup - Enable access control
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings/accessControlEnabled'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          accessControlEnabled: true
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: true
      strict:
        - json:off

  - name: Setup - Set the maximum number of failed login attempts
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          maxNumberOfLoginAttempts: 3
    response:
      status_code: 200
      json:
        data:
          maxNumberOfLoginAttempts: 3
      strict:
        - json:off

  - name: Failed login attempt 1/3
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data: &wrong_credentials
        client_id: opentrons_app
        grant_type: password
        username: testuser
        password: not_the_right_password
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.
        opentrons_login_attempts_remaining: 2

  - name: Failed login attempt 2/3
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data: *wrong_credentials
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.
        opentrons_login_attempts_remaining: 1

  - name: Failed login attempt 3/3, now locked out
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data: *wrong_credentials
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.
        opentrons_login_attempts_remaining: 0
        opentrons_account_locked: true

  - name: Correct credentials, but rejected because of the lockout
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data: &correct_credentials
        client_id: opentrons_app
        grant_type: password
        username: testuser
        password: testuserpassword
    response:
      status_code: 400
      json: &locked_out_response
        error: invalid_grant
        error_description: Invalid credentials given.
        opentrons_login_attempts_remaining: 0
        opentrons_account_locked: true

  - name: Incorrect credentials rejected with exactly the same response (to prevent fishing for them)
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data: *wrong_credentials
    response:
      status_code: 400
      json: *locked_out_response

  - name: Unrelated accounts can still log in, unaffected by the lockout
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testadmin
        password: testadminpassword
    response:
      status_code: 200

  - name: Use admin credentials to see the lockout
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/byUsername/testuser'
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      json:
        data:
          locked: true
      strict:
        - json:off

  - name: Use admin credentials to clear the lockout
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/byUsername/testuser'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          locked: false
    response:
      status_code: 200
      json:
        data:
          locked: false
      strict:
        - json:off

  - name: Now that the lockout is cleared, correct credentials should succeed
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data: *correct_credentials
    response:
      status_code: 200

  - name: Incorrect credentials should start the counter back at 1/3
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data: *wrong_credentials
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.
        opentrons_login_attempts_remaining: 2

---
test_name: Successful logins should reset the counter

marks:
  - usefixtures:
      - run_server
      - admin_access_token
      - seed_users

stages:
  - name: Setup - Enable access control
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings/accessControlEnabled'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          accessControlEnabled: true
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: true
      strict:
        - json:off

  - name: Setup - Set the maximum number of failed login attempts
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          maxNumberOfLoginAttempts: 3
    response:
      status_code: 200
      json:
        data:
          maxNumberOfLoginAttempts: 3
      strict:
        - json:off

  - name: Failed login attempt 1/3
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data: *wrong_credentials
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.
        opentrons_login_attempts_remaining: 2

  - name: Successful login to an unrelated account - this should not reset the counter
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testadmin
        password: testadminpassword
    response:
      status_code: 200

  - name: Failed login attempt 2/3
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data: *wrong_credentials
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.
        opentrons_login_attempts_remaining: 1

  - name: Successful login - this should reset the counter
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testuser
        password: testuserpassword
    response:
      status_code: 200

  - name: First failed login attempt after the unlock - counter should start back from the top
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data: *wrong_credentials
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.
        opentrons_login_attempts_remaining: 2

---
test_name: The number of remaining attempts isn't returned when the limit is disabled.

marks:
  - usefixtures:
      - run_server
      - admin_access_token
      - seed_users

stages:
  - name: Setup - Enable access control
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings/accessControlEnabled'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          accessControlEnabled: true
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: true
      strict:
        - json:off

  - name: Setup - Disable the limit on login attempts
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          maxNumberOfLoginAttempts: null
    response:
      status_code: 200
      json:
        data:
          maxNumberOfLoginAttempts: null
      strict:
        - json:off

  - name: Failed login attempt 1
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data: *wrong_credentials
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.
        # Note: opentrons_login_attempts_remaining should not be present here.

  - name: Failed login attempt 2
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data: *wrong_credentials
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.
        # Note: opentrons_login_attempts_remaining should not be present here.

  - name: Enable a limit on login attempts
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          maxNumberOfLoginAttempts: 4
    response:
      status_code: 200
      json:
        data:
          maxNumberOfLoginAttempts: 4
      strict:
        - json:off

  - name: Failed login attempt (now tracked)
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data: *wrong_credentials
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.
        # Note: opentrons_login_attempts_remaining should be present now because we enabled the limit on login attempts.
        # We ran through 2 of our 4 attempts above, before the setting was turned on.
        opentrons_login_attempts_remaining: 1
