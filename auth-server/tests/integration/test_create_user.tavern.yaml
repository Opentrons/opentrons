test_name: Successful Create, delete, and update User flow

marks:
  - usefixtures:
      - run_server

stages:
  - name: Create a new user
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      json:
        data:
          userName: test_new_user
          password: securepassword123
          fullName: Test New User
          accountType: user
    response:
      status_code: 201
      json:
        data:
          userName: test_new_user
          fullName: Test New User
          accountType: user
          scopes: [users.write]

  - name: Get a user information
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/test_new_user'
    response:
      status_code: 200
      json:
        data:
          accountType: user
          fullName: Test New User
          userName: test_new_user
          scopes: [users.write]

  - name: Update the user
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/test_new_user'
      json:
        data:
          fullName: Test New User Updated
          accountType: admin
    response:
      status_code: 200
      json:
        data:
          accountType: admin
          fullName: Test New User Updated
          userName: test_new_user
          scopes: [users.write]

  - name: Delete the user
    request:
      method: DELETE
      url: '{run_server.base_url}/auth/users/test_new_user'
    response:
      status_code: 204

