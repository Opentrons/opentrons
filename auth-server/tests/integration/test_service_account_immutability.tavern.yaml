test_name: Service accounts cannot be mutated or locked out

marks:
  - usefixtures:
      - run_server
      - admin_access_token
      - seed_users

stages:
  - name: Enable access control
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings/accessControlEnabled'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          accessControlEnabled: true
    response:
      status_code: 200
      json:
        data:
          accessControlEnabled: true
      strict:
        - json:off

  - name: Set the maximum number of failed login attempts
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/settings'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          maxNumberOfLoginAttempts: 3
    response:
      status_code: 200
      json:
        data:
          maxNumberOfLoginAttempts: 3
      strict:
        - json:off

  - name: Create a service account
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          username: service
          password: servicepassword123
          fullName: Should Be Ignored
          accountType: service
    response:
      status_code: 201
      json:
        data:
          username: service
          fullName: Service Account
          accountType: service
          locked: false
          resetPassword: false

  - name: Reject renaming the service account
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/byUsername/service'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          username: renamed-service
    response:
      status_code: 400

  - name: Reject changing the service account legal name
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/byUsername/service'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          fullName: Some Other Name
    response:
      status_code: 400

  - name: Reject changing the service account type
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/byUsername/service'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          accountType: admin
    response:
      status_code: 400

  - name: Reject locking the service account
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/byUsername/service'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          locked: true
    response:
      status_code: 400

  - name: Reject deleting the service account
    request:
      method: DELETE
      url: '{run_server.base_url}/auth/users/byUsername/service'
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 400

  - name: Failed login attempt 1/3
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data: &wrong_credentials
        client_id: opentrons_app
        grant_type: password
        username: service
        password: not_the_right_password
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.
      strict:
        - json:off

  - name: Failed login attempt 2/3
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data: *wrong_credentials
    response:
      status_code: 400

  - name: Failed login attempt 3/3
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data: *wrong_credentials
    response:
      status_code: 400

  - name: Correct credentials still work after the failed-login limit
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: service
        password: servicepassword123
    response:
      status_code: 200
      json:
        access_token: !anystr
      strict:
        - json:off

  - name: Service account is not reported as locked
    request:
      method: GET
      url: '{run_server.base_url}/auth/users/byUsername/service'
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      json:
        data:
          username: service
          fullName: Service Account
          accountType: service
          locked: false
      strict:
        - json:off
