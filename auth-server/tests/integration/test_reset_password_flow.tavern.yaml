test_name: Admin reset password flow

marks:
  - usefixtures:
      - run_server
      - admin_access_token
      - user_scopes_list
      - reset_password_scopes_list

stages:
  - name: Create a user for the reset-password flow
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      json:
        data:
          username: reset_password_flow_user
          password: initialpassword123
          fullName: Reset Password Flow User
          accountType: user
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 201
      json:
        data:
          username: reset_password_flow_user
          fullName: Reset Password Flow User
          accountType: user
          locked: false
          scopes: !force_original_structure '{user_scopes_list}'
          resetPassword: false

  - name: Admin resets the user password to a temporary password
    request:
      method: POST
      url: '{run_server.base_url}/auth/users/byUsername/reset_password_flow_user/resetPassword'
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      save:
        json:
          temporary_password: data.temporaryPassword
      json:
        data:
          username: reset_password_flow_user
          fullName: Reset Password Flow User
          accountType: user
          locked: false
          scopes: !force_original_structure '{reset_password_scopes_list}'
          resetPassword: true
          temporaryPassword: !anystr

  - name: User can log in with the temporary password but only gets self-write scopes
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: reset_password_flow_user
        password: '{temporary_password}'
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        token_type: Bearer
        expires_in: !anyint
        scope: users.read.self users.write.self.password

  - name: User cannot log in with the previous password
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: reset_password_flow_user
        password: initialpassword123
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.
        opentrons_login_attempts_remaining: !anyint

  - name: Admin sets a new password for the user
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/byUsername/reset_password_flow_user'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          password: chosenpassword123
          resetPassword: true
    response:
      status_code: 200
      json:
        data:
          username: reset_password_flow_user
          fullName: Reset Password Flow User
          accountType: user
          locked: false
          scopes: !force_original_structure '{user_scopes_list}'
          resetPassword: false

  - name: User can log in with the chosen password and gets full scopes back
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: reset_password_flow_user
        password: chosenpassword123
    response:
      status_code: 200
      json:
        access_token: !anystr
      strict:
        - json:off

  - name: User cannot log in with the temporary password after choosing a new one
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: reset_password_flow_user
        password: '{temporary_password}'
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.
        opentrons_login_attempts_remaining: !anyint

