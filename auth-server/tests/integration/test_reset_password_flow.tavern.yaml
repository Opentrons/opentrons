test_name: Admin reset password flow

marks:
  - usefixtures:
      - run_server
      - admin_access_token
      - user_scopes_list

stages:
  - name: Create a user for the reset-password flow
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      json:
        data:
          username: reset_password_flow_user
          password: initialpassword123
          fullName: Reset Password Flow User
          accountType: user
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 201
      json:
        data:
          username: reset_password_flow_user
          fullName: Reset Password Flow User
          accountType: user
          locked: false
          scopes: !force_original_structure '{user_scopes_list}'
          resetPassword: false

  - name: Admin resets the user password to a temporary password
    request:
      method: POST
      url: '{run_server.base_url}/auth/users/byUsername/reset_password_flow_user/resetPassword'
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 200
      save:
        json:
          temporary_password: data.temporaryPassword
      json:
        data:
          username: reset_password_flow_user
          fullName: Reset Password Flow User
          accountType: user
          locked: false
          scopes: !force_original_structure '{user_scopes_list}'
          resetPassword: true
          temporaryPassword: !anystr

  - name: User can log in with the temporary password
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: reset_password_flow_user
        password: '{temporary_password}'
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        token_type: Bearer
        expires_in: !anyint
        scope: !anystr

  - name: User cannot log in with the previous password
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: reset_password_flow_user
        password: initialpassword123
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.
        opentrons_login_attempts_remaining: !anyint

  - name: Admin sets a new password for the user
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/byUsername/reset_password_flow_user'
      headers:
        Authorization: '{admin_access_token}'
      json:
        data:
          password: chosenpassword123
          resetPassword: true
    response:
      status_code: 200
      json:
        data:
          username: reset_password_flow_user
          fullName: Reset Password Flow User
          accountType: user
          locked: false
          scopes: !force_original_structure '{user_scopes_list}'
          resetPassword: false

  - name: User can log in with the chosen password
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: reset_password_flow_user
        password: chosenpassword123
    response:
      status_code: 200
      json:
        access_token: !anystr
      strict:
        - json:off

  - name: User cannot log in with the temporary password after choosing a new one
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: reset_password_flow_user
        password: '{temporary_password}'
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.
        opentrons_login_attempts_remaining: !anyint

---
test_name: Self reset password flow

marks:
  - usefixtures:
      - run_server
      - admin_access_token
      - admin_scopes_list

stages:
  - name: Create a user for the self reset-password flow
    request:
      method: POST
      url: '{run_server.base_url}/auth/users'
      json:
        data:
          username: self_reset_password_flow_user
          password: initialpassword123
          fullName: Self Reset Password Flow User
          accountType: admin
      headers:
        Authorization: '{admin_access_token}'
    response:
      status_code: 201
      json:
        data:
          username: self_reset_password_flow_user
          fullName: Self Reset Password Flow User
          accountType: admin
          locked: false
          scopes: !force_original_structure '{admin_scopes_list}'
          resetPassword: false

  - name: User logs in with their initial password
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: self_reset_password_flow_user
        password: initialpassword123
    response:
      status_code: 200
      save:
        json:
          user_access_token: access_token

  - name: User resets their own password to a temporary password
    request:
      method: POST
      url: '{run_server.base_url}/auth/users/self/resetPassword'
      headers:
        Authorization: 'Bearer {user_access_token}'
    response:
      status_code: 200
      save:
        json:
          self_temporary_password: data.temporaryPassword
      json:
        data:
          username: self_reset_password_flow_user
          fullName: Self Reset Password Flow User
          accountType: admin
          locked: false
          scopes: !force_original_structure '{admin_scopes_list}'
          resetPassword: true
          temporaryPassword: !anystr

  - name: User can log in with the temporary password from self reset
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: self_reset_password_flow_user
        password: '{self_temporary_password}'
    response:
      status_code: 200
      strict:
        - json:off
      json:
        access_token: !anystr
