        password: '{temporary_password}'
    response:
      status_code: 200
      save:
        json:
          user_access_token: access_token
      json:
        access_token: !anystr
        refresh_token: !anystr
        token_type: Bearer
        expires_in: !anyint
        scope: users.read.self users.write.self.password

  - name: User sets a new password via update self
    request:
      method: PATCH
      url: '{run_server.base_url}/auth/users/self'
      headers:
        Authorization: 'Bearer {user_access_token}'
      json:
        data:
          password: chosenpassword456
    response:
      status_code: 200
      json:
        data:
          username: self_update_reset_password_user
