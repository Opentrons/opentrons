      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: self_update_reset_password_user
        password: chosenpassword456
    response:
      status_code: 200
      strict:
        - json:off
      json:
        access_token: !anystr

  - name: User cannot log in with the temporary password after update
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: self_update_reset_password_user
        password: '{temporary_password}'
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.
        opentrons_login_attempts_remaining: !anyint
