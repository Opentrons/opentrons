test_name: Invalid refresh tokens should be rejected

marks:
  - usefixtures:
      - run_server
      - seed_users

stages:
  - name: Send an invalid refresh token to the token endpoint
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: refresh_token
        refresh_token: bogus_refresh_token
    response:
      status_code: 400
      json:
        error: invalid_grant
      strict:
        - json:off

  - name: Send an invalid refresh token to the token introspection endpoint
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/introspect'
      data:
        client_id: opentrons_app
        token: bogus_refresh_token
    response:
      status_code: 200
      json:
        active: false
      strict:
        - json:off

