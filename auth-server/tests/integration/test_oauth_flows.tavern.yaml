test_name: Successful OAuth 2 flow

marks:
  - usefixtures:
      - run_server
      - admin_scopes_str
      - seed_users

stages:
  - name: Exchange a username and password for an access token and refresh token
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testadmin
        password: testadminpassword
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        expires_in: !anyint
        token_type: Bearer
        scope: &returned_scope '{admin_scopes_str}'
      save:
        json:
          initial_access_token: access_token
          initial_refresh_token: refresh_token

  - name: Introspect the access token to confirm that it's active
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/introspect'
      data:
        client_id: opentrons_app
        token: '{initial_access_token}'
    response:
      status_code: 200
      json:
        active: true
        username: testadmin
        ot_fullname: Test Admin
        scope: *returned_scope

  - name: Introspect the refresh token and confirm it's inactive (only access tokens are active)
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/introspect'
      data:
        client_id: opentrons_app
        token: '{initial_refresh_token}'
    response:
      status_code: 200
      json:
        active: false
      strict:
        - json:off

  - name: Exchange the refresh token for a new access token and refresh token
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: refresh_token
        refresh_token: '{initial_refresh_token}'
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        expires_in: !anyint
        token_type: Bearer
        scope: *returned_scope
      save:
        json:
          refreshed_access_token: access_token
          refreshed_refresh_token: refresh_token

  - name: Introspect the new access token to confirm that it's active
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/introspect'
      data:
        client_id: opentrons_app
        token: '{refreshed_access_token}'
    response:
      status_code: 200
      json:
        active: true
        username: testadmin
        ot_fullname: Test Admin
        scope: *returned_scope

  - name: Introspect the new refresh token and confirm it's inactive (only access tokens are active)
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/introspect'
      data:
        client_id: opentrons_app
        token: '{refreshed_refresh_token}'
    response:
      status_code: 200
      json:
        active: false
      strict:
        - json:off
---
test_name: Getting a token should fail if the request asks for scopes beyond what the user is authorized for

marks:
  - usefixtures:
      - run_server
      - user_scopes_str
      - seed_users

stages:
  - name: Send a password authorization request with invalid scopes
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testuser
        password: testuserpassword
        scope: robot_control.write users.write # testuser is not authorized for users.write.
    response:
      status_code: 400
      json:
        error: invalid_scope
      strict:
        - json:off

  - name: Send a password authorization request with default scopes
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testuser
        password: testuserpassword
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        expires_in: !anyint
        token_type: Bearer
        # With no scopes explicitly specified in the request, the server should return
        # all the scopes that this account type (user) is authorized for.
        scope: '{user_scopes_str}'
      save:
        json:
          refresh_token: refresh_token

  - name: Send a refresh request with invalid scopes
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: refresh_token
        refresh_token: '{refresh_token}'
        scope: robot_control.write users.write # testuser is not authorized for users.write.
    response:
      status_code: 400
      json:
        error: invalid_scope
      strict:
        - json:off

---
test_name: The client should be able to request scopes narrower than what the user is authorized for

marks:
  - usefixtures:
      - run_server
      - admin_scopes_str
      - seed_users

stages:
  - name: Send a password authorization request with narrower-than-default scope
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testadmin
        password: testadminpassword
        # testadmin would also be authorized for a bunch of other scopes.
        # This should narrow it to just robot_control.write.
        scope: &requested_scope_1 robot_control.write
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        expires_in: !anyint
        token_type: Bearer
        # We should get back only the narrow scopes that we requested,
        # not all the scopes that an admin could theoretically have.
        scope: *requested_scope_1

  - name: Send a password authorization request with default scope
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testadmin
        password: testadminpassword
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        expires_in: !anyint
        token_type: Bearer
        scope: '{admin_scopes_str}'
      save:
        json:
          refresh_token: refresh_token

  - name: Refresh the token and request scopes narrower than what the token had before
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: refresh_token
        refresh_token: '{refresh_token}'
        # The token that we're refreshing had default scopes.
        # In the new token, this should narrow it to just robot_control.write.
        scope: &requested_scope_2 robot_control.write

    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        expires_in: !anyint
        token_type: Bearer
        scope: *requested_scope_2

---
test_name: Wrong username and password credentials should be rejected

marks:
  - usefixtures:
      - run_server
      - seed_users

stages:
  - name: Send an invalid username+password combo to the token endpoint
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testadmin
        password: not_the_right_password
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.
        opentrons_login_attempts_remaining: !anyint

  - name: Send an unrecognized username to the token endpoint
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: nonexistent_user
        password: definitely_not_the_right_password
    response:
      status_code: 400
      json:
        error: invalid_grant
        error_description: Invalid credentials given.

