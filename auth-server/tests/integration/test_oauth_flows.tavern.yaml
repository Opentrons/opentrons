test_name: Successful OAuth 2 flow

marks:
  - usefixtures:
      - run_server

stages:
  - name: Exchange a username and password for an access token and refresh token
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: test_admin
        password: test_admin_password
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        expires_in: !anyint
        token_type: Bearer
        scope: runs.read runs.write users.write
      save:
        json:
          initial_access_token: access_token
          initial_refresh_token: refresh_token

  - name: Introspect the access token to confirm that it's active
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/introspect'
      data:
        client_id: opentrons_app
        token: '{initial_access_token}'
    response:
      status_code: 200
      json:
        active: true
        username: test_admin
        scope: runs.read runs.write users.write

  - name: Introspect the refresh token to confirm that it's active
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/introspect'
      data:
        client_id: opentrons_app
        token: '{initial_refresh_token}'
    response:
      status_code: 200
      json:
        active: true
        username: test_admin
        scope: runs.read runs.write users.write

  - name: Exchange the refresh token for a new access token and refresh token
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: refresh_token
        refresh_token: '{initial_refresh_token}'
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        expires_in: !anyint
        token_type: Bearer
        scope: runs.read runs.write users.write
      save:
        json:
          refreshed_access_token: access_token
          refreshed_refresh_token: refresh_token

  - name: Introspect the new access token to confirm that it's active
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/introspect'
      data:
        client_id: opentrons_app
        token: '{refreshed_access_token}'
    response:
      status_code: 200
      json:
        active: true
        username: test_admin
        scope: runs.read runs.write users.write

  - name: Introspect the new refresh token to confirm that it's active
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/introspect'
      data:
        client_id: opentrons_app
        token: '{refreshed_refresh_token}'
    response:
      status_code: 200
      json:
        active: true
        username: test_admin
        scope: runs.read runs.write users.write

---
test_name: Getting a token should fail if the request asks for scopes beyond what the user is authorized for

marks:
  - usefixtures:
      - run_server

stages:
  - name: Send a password authorization request with invalid scopes
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: test_user
        password: test_user_password
        scope: runs.read runs.write users.write # test_user is not authorized for users.write.
    response:
      status_code: 400
      json:
        error: invalid_scope
      strict:
        - json:off

  - name: Send a password authorization request with default scopes
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: test_user
        password: test_user_password
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        expires_in: !anyint
        token_type: Bearer
        scope: runs.read runs.write
      save:
        json:
          refresh_token: refresh_token

  - name: Send a refresh request with invalid scopes
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: refresh_token
        refresh_token: '{refresh_token}'
        scope: runs.read runs.write users.write # test_user is not authorized for users.write.
    response:
      status_code: 400
      json:
        error: invalid_scope
      strict:
        - json:off

---
test_name: The client should be able to request scopes narrower than what the user is authorized for

marks:
  - usefixtures:
      - run_server

stages:
  - name: Send a password authorization request with narrower-than-default scope
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: test_admin
        password: test_admin_password
        scope: runs.read runs.write # test_admin would also be authorized for users.write.
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        expires_in: !anyint
        token_type: Bearer
        scope: runs.read runs.write
      save:
        json:
          refresh_token: refresh_token

  - name: Refresh the token and request scopes narrower than what the token had before
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: refresh_token
        refresh_token: '{refresh_token}'
        scope: runs.read # The request above set this to "runs.read runs.write". This narrows it to just "runs.read".
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        expires_in: !anyint
        token_type: Bearer
        scope: runs.read

