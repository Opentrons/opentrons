---
test_name: Unrecognized scopes should be rejected

marks:
  - usefixtures:
      - run_server
      - seed_users

stages:
  - name: Pass an unrecognized scope to the initial token request
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testadmin
        password: testadminpassword
        scope: unrecognized_scope
    response:
      status_code: 400
      json:
        error: invalid_scope
      strict:
        - json:off

  - name: Do a successful token request to get a refresh token
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: testadmin
        password: testadminpassword
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
      save:
        json:
          refresh_token: refresh_token
      strict:
        - json:off

  - name: Pass an unrecognized scope to the refresh token request
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: refresh_token
        refresh_token: '{refresh_token}'
        scope: unrecognized_scope
    response:
      status_code: 400
      json:
        error: invalid_scope
      strict:
        - json:off

---
test_name: Unsupported grant types (those other than "password" and "refresh") should be rejected

marks:
  - usefixtures:
      - run_server
      - seed_users

  - parametrize:
      key: grant_type
      vals:
        - authorization_code
        - client_credentials
        - nonexistent_grant_type

stages:
  - name: Send an unsupported grant type to the token endpoint
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: '{grant_type}'
        username: testadmin
        password: testadminpassword
    response:
      status_code: 400
      json:
        error: unsupported_grant_type
      strict:
        - json:off
