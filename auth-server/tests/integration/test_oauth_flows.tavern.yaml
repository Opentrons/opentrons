test_name: Wrong username and password credentials should be rejected

marks:
  - usefixtures:
      - run_server

stages:
  - name: Send an invalid username and password to the token endpoint
    request:
      method: POST
      url: '{run_server.base_url}/auth/oauth2/token'
      data:
        client_id: opentrons_app
        grant_type: password
        username: test_admin
        password: not_the_right_password
    response:
      status_code: 400
      json:
        error: invalid_grant
      strict:
        - json:off

